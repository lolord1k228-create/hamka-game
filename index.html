function getUserKey(){
    if (currentNick) return 'nick_' + currentNick;
    if (tg?.initDataUnsafe?.user?.id) return 'tg_' + tg.initDataUnsafe.user.id;
    return 'guest_user';

// Хешування пароля (SHA-256) – асинхронна функція
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Зберегти нік та хеш у localStorage
function saveAuth(nick, passHash) {
    localStorage.setItem('hamka_nick', nick);
    localStorage.setItem('hamka_pass', passHash);

    savedPassHash = passHash;
}

function clearAuth() {
    localStorage.removeItem('hamka_nick');
    localStorage.removeItem('hamka_pass');
    currentNick = null;
    savedPassHash = null;
}

// Обробка входу
async function handleLogin() {
    const nick = document.getElementById('authNick').value.trim();
    const pass = document.getElementById('authPass').value;
    if (!nick || !pass) { toast('Введи нік та пароль'); return; }

    const key = 'nick_' + nick;
    db.ref('users/' + key).once('value').then(async snap => {
        const data = snap.val();
        if (!data || !data.passwordHash) {
            toast('❌ Невірний нік або пароль');
            return;
        }
        const hash = await sha256(pass);
        if (hash === data.passwordHash) {
            saveAuth(nick, hash);
            userName = nick;
            startGame();
        } else {
            toast('❌ Невірний пароль');
        }
    }).catch(() => toast('Помилка мережі'));
}

// Обробка реєстрації
async function handleRegister() {
    const nick = document.getElementById('authNick').value.trim();
    const pass = document.getElementById('authPass').value;
    if (!nick || !pass) { toast('Введи нік та пароль'); return; }
    if (nick.length < 3 || pass.length < 4) { toast('Нік від 3 символів, пароль від 4'); return; }

    const key = 'nick_' + nick;
    const snap = await db.ref('users/' + key).once('value');
    if (snap.val()) {
        toast('❌ Такий нік вже зайнятий');
        return;
    }

    const hash = await sha256(pass);
    saveAuth(nick, hash);
    userName = nick;
    // Створюємо запис з дефолтними даними
    defD();
    saveG(); // збереже під новим ключем
    startGame();

    if(blocked)return;
    if(curEn<=0){toast('⚡ Немає енергії!');return}
    curEn--; const now=Date.now(); clicks=clicks.filter(t=>now-t<1000);
    if(clicks.length>=12){blocked=1;setTimeout(()=>{blocked=0;clicks=[]},2000);return}
    clicks.push(now);
    let inc=Math.floor(Math.random()*3)+1+(tapLvl-1);
    inc=Math.floor(inc*coinBoost*tapPow);
    if(Math.random()*100<crit)inc=Math.floor(inc*2);
    coins+=inc; totalTaps++; addXP(1); updBal(); updEnergy();
    // saveG(); – прибрано, зберігаємо тільки в setInterval
}

// Виправлення морзянки
function startDot(e){ e.preventDefault(); if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null;} morseSeq+='.'; document.getElementById('morseDisp').textContent=morseSeq;}
function startDash(e){ e.preventDefault(); if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null;} morseSeq+='-'; document.getElementById('morseDisp').textContent=morseSeq;}

// Виправлення зміни складності сапера
function changeSaperDiff(){
    if(sRows===7){sRows=10;sCols=10;sMines=16;}
    else if(sRows===10){sRows=13;sCols=13;sMines=24;}
    else{sRows=7;sCols=7;sMines=10;}
    sMult = sRows===7 ? 1.3 : sRows===10 ? 1.6 : 2.0; // додано
    resetSaper();
    renderSaper();
}

// Оновлена buildProfile з кнопкою виходу
function buildProfile(){
    const a=document.getElementById('profile-area');
    const titleNames={king:'👑 Король',lord:'🗡️ Лорд',knight:'🛡️ Лицар',hamka:'🐹 Хамка',pro:'Профі',player:'Гравець',noob:'Новачок',none:'Без титулу'};
    const currentTitleName=titleNames[curTitle]||curTitle;
    a.innerHTML='<div class="profile-header"><div class="avatar">'+curGif+'</div><div class="name">'+userName+'</div><div class="level">'+currentTitleName+' | ⭐ Рівень '+accLvl+'</div></div><div class="profile-stats"><div class="profile-stat"><div class="value">💰 '+coins+'</div>Монети</div><div class="profile-stat"><div class="value">🟣 '+homa+'</div>Хоми</div><div class="profile-stat"><div class="value">👆 '+totalTaps+'</div>Тапів</div><div class="profile-stat"><div class="value">💪 x'+tapPow.toFixed(1)+'</div>Сила</div></div><div class="card" style="margin-top:6px"><b>🎒 Інвентар</b><br><small>Гіфки: '+myGifs.join(' ')+'</small><br><small>Титули: '+myTitles.filter(t=>t!=='none').map(t=>titleNames[t]||t).join(', ')+'</small></div>';
    if (currentNick) {
        a.innerHTML += '<button class="btn btn-r btn-block btn-sm" onclick="logout()">🚪 Вийти</button>';
    }
}
