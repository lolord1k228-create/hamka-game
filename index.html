    accXP+=a; let lvl=1;
    for(let i=LEVELS.length-1;i>=0;i--) if(accXP>=LEVELS[i].x){lvl=LEVELS[i].l;break;}

let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal',saperGameActive=false;
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;saperGameActive=false;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0};}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++;}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt;}}
function renderSaper(){const a=document.getElementById('game-area');const cs=Math.min(24,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#1f2937;color:#fff;border:1px solid #374151;border-radius:3px;padding:2px;font-size:8px"> | x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'btn-o')+'" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'btn-g')+'" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat('+sCols+','+cs+'px);background:#1f2937;padding:4px;border-radius:6px">';for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#374151';if(d.revealed){bg=d.mine?'#ef4444':'#4b5563';if(d.mine)t='💣';else if(d.adj>0)t=d.adj;}else if(d.flag){bg='#f97316';t='🚩';}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.5)+'px;touch-action:manipulation" onclick="saperClick('+r+','+c+')">'+t+'</button>';}h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#374151;color:#fff">'+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h;}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1;}else{revealCell(r,c);}renderSaper();}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c);}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Міна!');}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc);}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 +'+w+'💰');saveG();}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача');}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;updBal();resetSaper();saperGameActive=true;renderSaper();saveG();}
function changeSaperDiff(){if(saperGameActive){toast('Закінчіть поточну гру');return;}if(sRows===7){sRows=10;sCols=10;sMines=16;}else if(sRows===10){sRows=13;sCols=13;sMines=24;}else{sRows=7;sCols=7;sMines=10;}sMult=sRows===7?1.3:sRows===10?1.6:2.0;resetSaper();renderSaper();}

// Морзе
let morseCode='',morseSeq='',morseTimeout=null;
function startDot(e){e.preventDefault();if(morseTimeout)clearTimeout(morseTimeout);morseSeq+='.';document.getElementById('morseDisp').textContent=morseSeq;}
function startDash(e){e.preventDefault();if(morseTimeout)clearTimeout(morseTimeout);morseSeq+='-';document.getElementById('morseDisp').textContent=morseSeq;}
function stopMorse(e){e.preventDefault();morseTimeout=setTimeout(()=>{if(morseSeq.length>0){if(morseSeq==='..')morseCode+='I';else if(morseSeq==='--')morseCode+='M';else if(morseSeq==='.-')morseCode+='A';morseSeq='';}},800);}
function submitMorse(){if(morseCode==='IMA'){coins+=20000;addXP(1000);morseLastLevel=accLvl;morseCode='';updBal();saveG();toast('✅ +20000💰');openGame('morse');}}

// Боси
function fightFreeBoss(){ const now=Date.now(); if(now-lastFreeBoss<600000){ toast(`⏳ ${Math.ceil((600000-(now-lastFreeBoss))/60000)} хв`); return; } lastFreeBoss=now; saveG(); toast('⚔️ Безкоштовний бос...'); setTimeout(()=>{ let chance=0.4+accLvl*0.02+luck*0.05; if(Math.random()<Math.min(chance,0.9)){ let rewards=['gif','homa','title','chest']; let rw=rewards[Math.floor(Math.random()*rewards.length)]; if(rw==='gif'){ let av=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa); if(av.length){ myGifs.push(av[0].id); toast('🎨 Гіфка'); } else{ homa+=30; toast('🟣 +30 Хом'); } } else if(rw==='homa'){ let amt=Math.floor(Math.random()*150)+50; homa+=amt; toast(`🟣 +${amt} Хом`); } else if(rw==='title'){ let titles=['king','lord','knight','hamka','pro','player','noob']; let nt=titles[Math.floor(Math.random()*titles.length)]; if(!myTitles.includes(nt)){ myTitles.push(nt); toast(`🏅 Титул ${nt}`); } else{ homa+=80; toast('🟣 +80 Хом'); } } else{ let ct=['common','rare','epic'][Math.floor(Math.random()*3)]; chests[ct]=(chests[ct]||0)+1; toast(`🎁 Ящик ${ct}`); } } else toast('❌ Поразка'); updAll(); saveG(); renderBosses(); },2000); }
function fightBoss(cost){ if(homa<cost){ toast(`❌ ${cost}🟣`); return; } homa-=cost; updAll(); saveG(); toast('⚔️ Битва...'); setTimeout(()=>{ let chance=0.3+accLvl*0.03+luck*0.05; if(cost>=5000) chance+=0.05; if(cost>=15000) chance+=0.1; if(Math.random()<Math.min(chance,0.85)){ let rewards=['gif','homa','title','chest']; let rw=rewards[Math.floor(Math.random()*rewards.length)]; if(rw==='gif'){ let av=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa); if(av.length){ myGifs.push(av[0].id); toast('🎨 Гіфка'); } else{ homa+=50; toast('🟣 +50 Хом'); } } else if(rw==='homa'){ let amt=Math.floor(Math.random()*200)+100+cost; homa+=amt; toast(`🟣 +${amt} Хом`); } else if(rw==='title'){ let titles=['king','lord','knight','hamka','pro','player','noob']; let nt=titles[Math.floor(Math.random()*titles.length)]; if(!myTitles.includes(nt)){ myTitles.push(nt); toast(`🏅 Титул ${nt}`); } else{ homa+=100; toast('🟣 +100 Хом'); } } else{ let ct=['common','rare','epic','legendary','mythic'][Math.floor(Math.random()*5)]; chests[ct]=(chests[ct]||0)+1; toast(`🎁 Ящик ${ct}`); } } else toast('❌ Поразка'); updAll(); saveG(); },2000); }
function renderBosses(){ const a=document.getElementById('game-area'); const now=Date.now(); const freeCD=Math.max(0,Math.ceil((600000-(now-lastFreeBoss))/60000)); a.innerHTML=`<div class="center-game"><h3>🐉 БОСИ</h3><div class="card"><b>🆓 Безкоштовний</b><br><button class="btn btn-b" onclick="fightFreeBoss()">${freeCD>0?`⏳ ${freeCD} хв`:'Битись'}</button></div><div class="card"><b>👾 Бос 1</b><br>100🟣<button class="btn btn-o" onclick="fightBoss(100)">Бій</button></div><div class="card"><b>👾 Бос 2</b><br>500🟣<button class="btn btn-o" onclick="fightBoss(500)">Бій</button></div><div class="card"><b>👾 Бос 3</b><br>2000🟣<button class="btn btn-o" onclick="fightBoss(2000)">Бій</button></div><div class="card"><b>👾 Бос 4</b><br>5000🟣<button class="btn btn-o" onclick="fightBoss(5000)">Бій</button></div><div class="card"><b>👾 Бос 5</b><br>15000🟣<button class="btn btn-o" onclick="fightBoss(15000)">Бій</button></div><div class="card"><b>👾 Бос 6</b><br>50000🟣<button class="btn btn-o" onclick="fightBoss(50000)">Бій</button></div></div>`; }

// Ящики
function buyChest(type){ const p={common:30000,rare:100000,epic:500000,legendary:2000000,mythic:10000000,homa_chest:500,homa10_chest:4500}[type]; if(!p)return; if(type.startsWith('homa')){ if(homa<p){toast('❌ Не вистачає хом');return} homa-=p; } else { if(coins<p){toast('❌ Не вистачає монет');return} coins-=p; } chests[type]=(chests[type]||0)+1; updAll(); saveG(); toast('✅ Ящик в інвентарі'); renderShopBox(); }
function openChestFromInventory(type){ if(!chests[type]||chests[type]<=0){toast('Немає ящиків');return} chests[type]--; saveG(); toast('📦 Відкриваємо...'); setTimeout(()=>{ let reward=''; if(type==='homa_chest'||type==='homa10_chest'){ let amt=Math.floor(Math.random()*200)+100; if(type==='homa10_chest') amt*=10; homa+=amt; reward=`🟣 +${amt} Хом`; } else { if(Math.random()<0.4){ homa++; reward='🟣 +1 Хома'; } else if(Math.random()<0.8){ let free=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa); if(free.length){ myGifs.push(free[0].id); reward=`🎨 Гіфка ${free[0].e}`; } else { homa+=2; reward='🟣 +2 Хоми'; } } else { let back=Math.floor(({common:30000,rare:100000,epic:500000}[type]||30000)*0.5); coins+=back; reward=`💰 +${back} монет`; } } toast(reward); updAll(); saveG(); renderShopBox(); },1500); }
function renderShopBox(){ const b=document.getElementById('shop-box'); if(!b)return; b.innerHTML=`<div class="card"><b>📦 Простий</b>30K💰<button class="btn btn-g btn-sm" onclick="buyChest('common')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('common')">Відкрити (${chests.common||0})</button></div><div class="card"><b>📦 Рідкісний</b>100K💰<button class="btn btn-g btn-sm" onclick="buyChest('rare')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('rare')">Відкрити (${chests.rare||0})</button></div><div class="card"><b>📦 Епічний</b>500K💰<button class="btn btn-g btn-sm" onclick="buyChest('epic')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('epic')">Відкрити (${chests.epic||0})</button></div><div class="card"><b>🟣 Хома-ящик</b>500🟣<button class="btn btn-g btn-sm" onclick="buyChest('homa_chest')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('homa_chest')">Відкрити (${chests.homa_chest||0})</button></div><div class="card"><b>🟣 Хома x10</b>4500🟣<button class="btn btn-g btn-sm" onclick="buyChest('homa10_chest')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('homa10_chest')">Відкрити (${chests.homa10_chest||0})</button></div>`; }

// Магазин
function getPrice(item){ const p={maxEnergy:{base:2000,mult:1.5},autoXP:{base:5000,mult:2},autoTap:{base:300,mult:1.4},energyRegen:{base:15000,mult:2.5},upgradeTap:{base:1000,mult:1.8},coinBoostB:{base:5000,mult:2},energyUp:{base:5000,mult:1.8},tapPowerB:{base:15000,mult:2.5},critChanceB:{base:10000,mult:2},luckB:{base:3000,mult:2}}; const d=p[item]; if(!d)return 0; if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1)); return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0)); }
function buyItem(t){ let p=0; if(t==='maxEnergy'){p=getPrice('maxEnergy'); if(coins<p)return; coins-=p; maxEn+=50; curEn+=50; buyCount.maxEnergy++; } else if(t==='autoXP'){p=getPrice('autoXP'); if(coins<p)return; coins-=p; autoXP++; buyCount.autoXP++; } else if(t==='xpBoost'){if(coins<300)return; coins-=300; addXP(100);} else if(t==='autoTap'){p=getPrice('autoTap'); if(coins<p)return; coins-=p; autoTap++; buyCount.autoTap++; } else if(t==='energyRegen'){p=getPrice('energyRegen'); if(coins<p)return; coins-=p; buyCount.energyRegen++; } else if(t==='upgradeTap'){p=getPrice('upgradeTap'); if(coins<p)return; coins-=p; tapLvl++; buyCount.upgradeTap++; } else if(t==='coinBoost'){p=getPrice('coinBoostB'); if(coins<p)return; coins-=p; coinBoost+=0.5; buyCount.coinBoostB++; } else if(t==='energyUp'){p=getPrice('energyUp'); if(coins<p)return; coins-=p; maxEn+=100; curEn+=100; buyCount.energyUp++; } else if(t==='tapPower'){p=getPrice('tapPowerB'); if(coins<p)return; coins-=p; tapPow+=0.5; buyCount.tapPowerB++; } else if(t==='critChance'){p=getPrice('critChanceB'); if(coins<p)return; coins-=p; crit+=5; buyCount.critChanceB++; } else if(t==='luck'){p=getPrice('luckB'); if(coins<p)return; coins-=p; luck+=0.1; buyCount.luckB++; } else if(t==='vip'){if(inv.includes('VIP')){toast('Вже є');return} if(coins<20000)return; coins-=20000; inv.push('VIP'); luck=Math.min(luck+0.1,1.3); buildVip(); toast('👑 VIP!'); } updAll(); saveG(); toast('✅ Куплено!'); }
function buyHoma(n){ let cost=n*50000; if(coins>=cost){ coins-=cost; homa+=n; updAll(); saveG(); toast(`✅ +${n}🟣`); } else toast('❌ Мало монет'); }
function buyHomaTitle(){ if(myTitles.includes('hamka')){toast('Вже є');return} if(homa>=25000){ homa-=25000; myTitles.push('hamka'); updAll(); saveG(); toast('🏅 Титул Хамка!'); } else toast('❌ 25000🟣'); }
function buyHomaGif(){ if(myGifs.includes('⚔️')){toast('Вже є');return} if(homa>=15000){ homa-=15000; myGifs.push('⚔️'); updAll(); saveG(); toast('⚔️ Гіфка Меч!'); } else toast('❌ 15000🟣'); }
function renderGifShop(){ const s=document.getElementById('gifShop'); if(s) s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>myGifs.includes(g.id)?`<div class="gif-cell">${g.e}</div>`:`<div class="gif-cell" onclick="buyGif('${g.id}')">${g.e}<span class="gif-price">${R[g.r]?.p||1000}</span></div>`).join(''); }
function buyGif(id){ let g=GIFS.find(x=>x.id===id); if(!g||myGifs.includes(id))return; let price=R[g.r]?.p||1000; if(coins>=price){ coins-=price; myGifs.push(id); updAll(); saveG(); toast(`✅ ${g.e} куплено!`); renderGifShop(); } else toast('❌ Мало монет'); }
function renderTitleShop(){ const s=document.getElementById('titleShop'); if(s) s.innerHTML=`<div class="card"><b>🏅 Новачок</b>50K💰<button class="btn btn-g btn-sm" onclick="buyTitle('noob')">Купити</button></div><div class="card"><b>🏅 Гравець</b>150K💰<button class="btn btn-g btn-sm" onclick="buyTitle('player')">Купити</button></div><div class="card"><b>🏅 Профі</b>500K💰<button class="btn btn-g btn-sm" onclick="buyTitle('pro')">Купити</button></div>`; }
function buyTitle(id){ if(myTitles.includes(id))return; let price={noob:50000,player:150000,pro:500000}[id]; if(coins>=price){ coins-=price; myTitles.push(id); updAll(); saveG(); toast('✅ Титул!'); } else toast('❌ Мало монет'); }

function execConsole(){ const inp=document.getElementById('consoleInput'); const cmd=inp.value.trim(); const out=document.getElementById('consoleOutput'); if(!cmd)return; out.innerHTML+=`> ${cmd}\n`; if(cmd==='/help') out.innerHTML+='/info /color#00ff88 /renameНік /clear\n'; else if(cmd==='/clear') out.innerHTML=''; else if(cmd.startsWith('/color')){ let col=cmd.split('#')[1]; if(col) chTheme('#'+col); out.innerHTML+='✅\n'; } else if(cmd.startsWith('/rename')){ let newName=cmd.slice(7); if(newName){ userName=newName; document.getElementById('userName').textContent=userName; saveG(); out.innerHTML+='✅\n'; } } else if(cmd==='/info') out.innerHTML+=`💰${Math.floor(coins)} 🟣${homa} ⭐${accLvl} 👆${totalTaps}\n`; else out.innerHTML+='Невідома команда. /help\n'; inp.value=''; out.scrollTop=out.scrollHeight; }

}
function buildTop(){ const a=document.getElementById('top-area'); a.innerHTML='<div>Завантаження...</div>'; db.ref('users').orderByChild('xp').limitToLast(20).once('value').then(snap=>{ let arr=[]; snap.forEach(c=>{ let d=c.val(); if(d&&typeof d.xp==='number') arr.push({name:d.name||'Гість',xp:d.xp,avatar:d.avatar||'🐹'}); }); arr.sort((a,b)=>b.xp-a.xp); let html='<div class="card"><b>🏆 Топ XP</b></div>'; arr.slice(0,20).forEach((u,i)=>{ let medal=i<3?['🥇','🥈','🥉'][i]:i+1; html+=`<div class="top-item"><div class="rank rank-${i+1<=3?i+1:''}">${medal}</div><div><b>${u.avatar} ${u.name}</b><br><small>${u.xp} XP</small></div></div>`; }); a.innerHTML=html; }); }
function tapEventHoma(){ const now=Date.now(); if(now-eventTapCooldown<5000){ toast(`⏳ ${Math.ceil((5000-(now-eventTapCooldown))/1000)} сек`); return; } eventTapCooldown=now; eventHoma+=0.25; toast('+0.25 івенхома'); updAll(); saveG(); renderEvent(); }
function openEventChest(cost){ if(eventHoma<cost){ toast('❌ Не вистачає івенхом'); return; } eventHoma-=cost; let r=Math.random(); let reward=''; if(cost===1){ if(r<0.34) reward='5 хом', homa+=5; else if(r<0.6) reward='20 хом', homa+=20; else if(r<0.75) reward='гіфка ☀️', myGifs.push('☀️'); else if(r<0.85) reward='гіфка 🏖️', myGifs.push('🏖️'); else if(r<0.95) reward='титул летний', myTitles.push('летний'); else if(r<0.99) reward='150 хом', homa+=150; else reward='титул ĹÈŤOʻ', myTitles.push('ĹÈŤOʻ'); } else { if(r<0.2) reward='50 хом', homa+=50; else if(r<0.4) reward='150 хом', homa+=150; else if(r<0.55) reward='гіфка ☀️', myGifs.push('☀️'); else if(r<0.7) reward='гіфка 🏖️', myGifs.push('🏖️'); else if(r<0.85) reward='титул летний', myTitles.push('летний'); else if(r<0.95) reward='500 хом', homa+=500; else if(r<0.997) reward='титул ĹÈŤOʻ', myTitles.push('ĹÈŤOʻ'); else reward='титул солнечний мальчик', myTitles.push('солнечний мальчик'); } toast(`🎁 ${reward}`); updAll(); saveG(); renderEvent(); }
function renderEvent(){ const a=document.getElementById('eventArea'); if(!a)return; a.innerHTML=`<div class="center-game"><h3 style="color:#ec4899">🌸 Літній бум</h3><div class="card">🪙 Івенхоми: ${eventHoma.toFixed(2)}<br><button class="btn btn-b btn-sm" onclick="tapEventHoma()">Тапнути (+0.25)</button><button class="btn btn-o btn-sm" onclick="openEventChest(1)">Ящик (1🪙)</button><button class="btn btn-o btn-sm" onclick="openEventChest(10)">Великий (10🪙)</button></div></div>`; }

function openGame(g){
    currentGame=g;
    const a=document.getElementById('game-area');
    if(g==='tap'){
        a.innerHTML=`<div class="center-game"><div style="font-size:20px;color:#fbbf24;">🪙 <span id="tapBalance">${Math.floor(coins)}</span></div><div class="tap-circle" id="tapBtn" onclick="tapClick(event)" ontouchstart="tapClick(event)">${curGif}</div></div>`;
        const btn=document.getElementById('tapBtn');
        if(btn){
            btn.removeEventListener('click',tapClick);
            btn.removeEventListener('touchstart',tapClick);
            btn.addEventListener('click',tapClick);
            btn.addEventListener('touchstart',tapClick,{passive:false});
        }
    } else if(g==='casino'){
        a.innerHTML=`<div class="center-game"><h3>🎰 Казино</h3><div style="display:flex;gap:6px"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">🍉</div></div><div class="bet-row"><button class="btn btn-g btn-sm" onclick="chBet(-10)">-</button><input type="number" id="bet" value="10"><button class="btn btn-g btn-sm" onclick="chBet(10)">+</button></div><button class="btn btn-o" onclick="spin()">Крутити</button></div>`;
    } else if(g==='saper'){ resetSaper(); renderSaper(); }
    else if(g==='morse'){
        if(accLvl<4){ a.innerHTML='<div class="center-game"><h3>🔒 З 4 рівня</h3></div>'; return; }
        a.innerHTML=`<div class="center-game"><h3>📻 Морзянка (IMA)</h3><div id="morseDisp" style="font-size:20px"></div><div><button class="btn btn-b" onmousedown="startDot(event)" onmouseup="stopMorse(event)" ontouchstart="startDot(event)" ontouchend="stopMorse(event)">•</button><button class="btn btn-o" onmousedown="startDash(event)" onmouseup="stopMorse(event)" ontouchstart="startDash(event)" ontouchend="stopMorse(event)">−</button></div><button class="btn btn-g" onclick="submitMorse()">Готово</button></div>`;
    } else if(g==='boss'){ renderBosses(); }
}
function switchTab(t,btn){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
    document.getElementById('tab-'+t).classList.add('show');
    document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));
    if(btn)btn.classList.add('active');
    if(t==='games') openGame(currentGame);
    if(t==='shop'){ renderShopRes(); renderShopUpg(); renderShopVis(); renderShopBox(); }
    if(t==='vip') buildVip();
    if(t==='profile') buildProfile();
    if(t==='top') buildTop();
    if(t==='event') renderEvent();
}
function renderShopRes(){ document.getElementById('shop-res').innerHTML=`<div class="card"><b>⚡ Енергія +50</b><br>💰 ${getPrice('maxEnergy')}<button class="btn btn-g btn-sm" onclick="buyItem('maxEnergy')">Купити</button></div><div class="card"><b>✨ Авто XP</b><br>💰 ${getPrice('autoXP')}<button class="btn btn-g btn-sm" onclick="buyItem('autoXP')">Купити</button></div><div class="card"><b>🚀 XP Бустер</b><br>300💰<button class="btn btn-g btn-sm" onclick="buyItem('xpBoost')">Купити</button></div><div class="card"><b>⚡ Авто тап</b><br>💰 ${getPrice('autoTap')}<button class="btn btn-g btn-sm" onclick="buyItem('autoTap')">Купити</button></div><div class="card"><b>🔄 Регенерація +1</b><br>💰 ${getPrice('energyRegen')}<button class="btn btn-g btn-sm" onclick="buyItem('energyRegen')">Купити</button></div><div class="card homa-card"><b>🟣 Купити Хоми</b><br><button class="btn btn-g btn-sm" onclick="buyHoma(1)">1🟣 (50K)</button><button class="btn btn-g btn-sm" onclick="buyHoma(5)">5🟣 (250K)</button><button class="btn btn-g btn-sm" onclick="buyHoma(10)">10🟣 (500K)</button></div>`; }
function renderShopUpg(){ document.getElementById('shop-upg').innerHTML=`<div class="card"><b>⭐ Прокачка тапу +1</b><br>💰 ${getPrice('upgradeTap')}<button class="btn btn-g btn-sm" onclick="buyItem('upgradeTap')">Прокачати</button></div><div class="card"><b>🪙 Бустер монет +0.5x</b><br>💰 ${getPrice('coinBoostB')}<button class="btn btn-g btn-sm" onclick="buyItem('coinBoost')">Купити (x${coinBoost.toFixed(1)})</button></div><div class="card"><b>⚡ Енергія +100</b><br>💰 ${getPrice('energyUp')}<button class="btn btn-g btn-sm" onclick="buyItem('energyUp')">Купити</button></div><div class="card"><b>💪 Сила +50%</b><br>💰 ${getPrice('tapPowerB')}<button class="btn btn-g btn-sm" onclick="buyItem('tapPower')">Купити (x${tapPow.toFixed(1)})</button></div><div class="card"><b>🎯 Крит +5%</b><br>💰 ${getPrice('critChanceB')}<button class="btn btn-g btn-sm" onclick="buyItem('critChance')">Купити (${crit}%)</button></div><div class="card"><b>👑 VIP</b><br>20000💰<button class="btn btn-g btn-sm" onclick="buyItem('vip')">Купити ${inv.includes('VIP')?'(Вже є)':''}</button></div><div class="card"><b>🍀 Удача +0.1</b><br>💰 ${getPrice('luckB')}<button class="btn btn-g btn-sm" onclick="buyItem('luck')">Купити (x${luck.toFixed(1)})</button></div>`; }
function renderShopVis(){ document.getElementById('shop-vis').innerHTML=`<b>🎨 Гіфки за 💰</b><div id="gifShop" class="gif-row"></div><div class="card homa-card"><b>🏅 Титул "Хамка"</b><br>🟣 25000<button class="btn btn-g btn-sm" onclick="buyHomaTitle()">Купити ${myTitles.includes('hamka')?'(Вже є)':''}</button></div><div class="card homa-card"><b>⚔️ Гіфка "Меч"</b><br>🟣 15000<button class="btn btn-g btn-sm" onclick="buyHomaGif()">Купити ${myGifs.includes('⚔️')?'(Вже є)':''}</button></div><b>🏅 Титули за 💰</b><div id="titleShop"></div>`; renderGifShop(); renderTitleShop(); }
function buildPages(){
    let adminBtn=isAdmin?'<button class="btn btn-r" onclick="openAdminPanel()">🔧 Адмін</button>':'';
    document.getElementById('contentArea').innerHTML=`
    <div id="tab-games" class="page show"><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px"><button class="btn btn-g" onclick="openGame('tap')">💸 Тап</button><button class="btn btn-o" onclick="openGame('casino')">🎰 Казино</button><button class="btn btn-r" onclick="openGame('saper')">💣 Сапер</button><button class="btn btn-b" onclick="openGame('morse')">📻 Морзе</button><button class="btn" style="background:#ec4899;color:#fff" onclick="openGame('boss')">🐉 Боси</button>${adminBtn}</div><div id="game-area"></div></div>
    <div id="tab-shop" class="page"><div class="shop-tabs"><button class="shop-tab active" onclick="shopTab('res',event)">Ресурси</button><button class="shop-tab" onclick="shopTab('upg',event)">Прокачка</button><button class="shop-tab" onclick="shopTab('vis',event)">Візуал</button><button class="shop-tab" onclick="shopTab('box',event)">Ящики</button></div><div id="shop-res"></div><div id="shop-upg" style="display:none"></div><div id="shop-vis" style="display:none"></div><div id="shop-box" style="display:none"></div></div>
    <div id="tab-vip" class="page"><div id="vip-area"></div></div>
    <div id="tab-profile" class="page"><div id="profile-area"></div></div>
    <div id="tab-top" class="page"><div id="top-area"></div></div>
    <div id="tab-event" class="page"><div id="eventArea"></div></div>`;
    openGame(currentGame);
    renderShopRes(); renderShopUpg(); renderShopVis(); renderShopBox();
    buildVip(); buildProfile(); buildTop(); renderEvent();
}
function shopTab(t,ev){
    document.querySelectorAll('#shop-res,#shop-upg,#shop-vis,#shop-box').forEach(e=>e.style.display='none');
    document.getElementById('shop-'+t).style.display='block';
    document.querySelectorAll('.shop-tab').forEach(b=>b.classList.remove('active'));
    if(ev&&ev.target)ev.target.classList.add('active');
    if(t==='vis'){ renderGifShop(); renderTitleShop(); }
}
function openAdminPanel(){ const a=document.getElementById('game-area'); a.innerHTML=`<div class="center-game"><h3>🔧 Адмін</h3><input id="adminNick" placeholder="Нік"><select id="adminAction"><option value="addCoins">💰 Монети</option><option value="addHoma">🟣 Хоми</option><option value="addGif">🎨 Гіфка(ID)</option><option value="addTitle">🏅 Титул</option><option value="rename">✏️ Ім'я</option><option value="delete">🗑️ Видалити</option></select><input id="adminValue" placeholder="Значення"><button class="btn btn-g" onclick="executeAdminAction()">Виконати</button></div>`; }
async function executeAdminAction(){ const nick=document.getElementById('adminNick').value.trim(); if(!nick)return; const key='nick_'+nick; const snap=await db.ref('users/'+key).once('value'); const data=snap.val(); if(!data){toast('Немає');return;} const act=document.getElementById('adminAction').value; const val=document.getElementById('adminValue').value.trim(); if(act==='addCoins') await db.ref('users/'+key+'/coins').set((data.coins||0)+parseInt(val)); if(act==='addHoma') await db.ref('users/'+key+'/homa').set((data.homa||0)+parseInt(val)); if(act==='addGif'){ let gifs=val.split(','); let cur=data.myGifs||[]; let ncur=[...new Set([...cur,...gifs])]; await db.ref('users/'+key+'/myGifs').set(ncur); } if(act==='addTitle'){ let titles=data.myTitles||[]; if(!titles.includes(val)) titles.push(val); await db.ref('users/'+key+'/myTitles').set(titles); } if(act==='rename') await db.ref('users/'+key+'/name').set(val); if(act==='delete') await db.ref('users/'+key).remove(); toast('✅'); }
function startGame(){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('game').style.display='flex';
    document.getElementById('userName').textContent=userName;
    buildPages();
    updAll();
    if(gameInterval) clearInterval(gameInterval);
    gameInterval=setInterval(()=>{
        curEn=Math.min(maxEn,curEn+1+(buyCount.energyRegen||0));
        updEnergy();
        if(autoTap>0){ coins+=autoTap; updBal(); }
        if(autoXP>0) addXP(autoXP);
        let now=Date.now();
        if(now-lastTimeReward>=300000){ lastTimeReward=now; coins+=500; toast('⏰ +500 монет за час'); updAll(); saveG(); }
        if(totalTaps%30===0) saveG();
    },1000);
    saveG();
}
function processOfflineBonus(){
    const now=Date.now(); const sec=Math.floor((now - lastSaveTime)/1000);
    if(sec>30){ const maxSec=Math.min(sec,10800); const energyGain = Math.floor(maxSec*(1+buyCount.energyRegen)); curEn=Math.min(maxEn, curEn + energyGain); let coinGain = 0; if(autoTap>0) coinGain += Math.floor(maxSec*(autoTap/5)); coins += coinGain; let xpGain = 0; if(autoXP>0) xpGain = Math.floor(maxSec*autoXP); if(xpGain>0) addXP(xpGain);
        const bonusMsg = `🎁 Офлайн бонус за ${Math.floor(maxSec/60)}хв: ⚡+${energyGain} ${coinGain>0?'💰+'+coinGain:''} ${xpGain>0?'⭐+'+xpGain+'XP':''}`;
        document.getElementById('offlineBonus').style.display='block'; document.getElementById('offlineBonus').innerHTML = bonusMsg; setTimeout(()=>document.getElementById('offlineBonus').style.display='none',8000);
    }
}
// ========== АВТОРИЗАЦІЯ ==========
async function handleLogin(){
    const nick=document.getElementById('authNick').value.trim();
    const pass=document.getElementById('authPass').value;
    if(!nick||!pass){toast('Введіть нік та пароль');return;}
    const key='nick_'+nick;
    const snap=await db.ref('users/'+key).once('value');
    const data=snap.val();
    if(!data||!data.passwordHash){toast('Невірний логін або пароль');return;}
    const hash=await sha256(pass);
    if(hash===data.passwordHash){
        saveAuth(nick,hash);
        userName=data.name||nick;
        loadD(data);
        processOfflineBonus();
        startGame();
    } else toast('Невірний пароль');
}
async function handleRegister(){
    const nick=document.getElementById('authNick').value.trim();
    const pass=document.getElementById('authPass').value;
    if(!nick||!pass||nick.length<3||pass.length<4){toast('Нік ≥3, пароль ≥4');return;}
    const key='nick_'+nick;
    const snap=await db.ref('users/'+key).once('value');
    if(snap.val()){toast('Нік вже зайнятий');return;}
    const hash=await sha256(pass);
    saveAuth(nick,hash);
    userName=nick;
    defD();
    saveG();
    startGame();
}
function authAsGuest(){
    clearAuth();
    if(tg?.initDataUnsafe?.user?.id){
        loginWithTelegram();
    } else {
        userName='Гість';
        loadGameData(data=>{ if(data) loadD(data); else defD(); processOfflineBonus(); startGame(); });
    }
}
function loginWithTelegram(){
    if(!tg?.initDataUnsafe?.user?.id){
        toast('Ця функція доступна тільки в Telegram');
        return;
    }
    const tgUser = tg.initDataUnsafe.user;
    const tgId = tgUser.id;
    const tgName = tgUser.first_name || (tgUser.username ? '@'+tgUser.username : 'TelegramUser');
    saveTgAuth(tgId, tgName);
    userName = tgName;
    const key = 'tg_'+tgId;
    db.ref('users/'+key).once('value').then(snap=>{
        const data = snap.val();
        if(data){
            loadD(data);
        } else {
            defD();
            userName = tgName;
            saveG();
        }
        processOfflineBonus();
        startGame();
    }).catch(()=>{
        defD();
        userName = tgName;
        saveG();
        startGame();
    });
}
function logout(){
    if(gameInterval) clearInterval(gameInterval);
    clearAuth();
    location.reload();
}
function activatePromo(){
    const c=document.getElementById('promoInp').value.trim().toUpperCase();
    if(!c)return;
    if(usedPromos.includes(c)){toast('Вже використано');return;}
    if(c==='LETO'){
        eventHoma+=50;
        toast('🎁 +50 івенхомів за промокод LETO!');
        usedPromos.push(c);
        saveG();
        renderEvent();
    } else if(promos[c.toLowerCase()]==='admin'){
        isAdmin=1;
        toast('🔧 Адмін права активовано!');
        buildPages();
    } else if(promos[c.toLowerCase()]==='event15'){
        eventHoma+=15;
        toast('+15 івенхомів');
        renderEvent();
    } else if(promos[c.toLowerCase()]){
        coins+=promos[c.toLowerCase()];
        toast(`🎁 +${promos[c.toLowerCase()]}💰`);
        usedPromos.push(c);
        updBal();
        saveG();
    } else toast('Невірний промокод');
    document.getElementById('promoInp').value='';
}

// ========== АВТОМАТИЧНИЙ ЗАПУСК ==========
function autoStart(){
    const tgId = localStorage.getItem('hamka_tg');
    if(tgId){
        telegramUserId = tgId;
        isTelegramUser = true;
        const key = 'tg_'+tgId;
        db.ref('users/'+key).once('value').then(snap=>{
            const data = snap.val();
            if(data){
                userName = data.name || (tg?.initDataUnsafe?.user?.first_name || 'TelegramUser');
                loadD(data);
            } else {
                userName = tg?.initDataUnsafe?.user?.first_name || 'TelegramUser';
                defD();
                saveG();
            }
            processOfflineBonus();
            startGame();
        }).catch(()=>{
            userName = tg?.initDataUnsafe?.user?.first_name || 'TelegramUser';
            defD();
            saveG();
            startGame();
        });
    } else if(localStorage.getItem('hamka_nick')){
        currentNick = localStorage.getItem('hamka_nick');
        savedPassHash = localStorage.getItem('hamka_pass');
        db.ref('users/nick_'+currentNick).once('value').then(snap=>{
            const data = snap.val();
            if(data && data.passwordHash === savedPassHash){
                userName = data.name || currentNick;
                loadD(data);
                processOfflineBonus();
                startGame();
            } else showAuthScreen();
        }).catch(()=>showAuthScreen());
    } else if(tg?.initDataUnsafe?.user?.id){
        // Відображаємо кнопку входу через Telegram
        showAuthScreen();
    } else {
        showAuthScreen();
    }
}
function showAuthScreen(){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('game').style.display='none';
    if(tg?.initDataUnsafe?.user?.id) document.getElementById('tgLoginBtn').style.display='block';
}
if(tg){
    tg.ready();
    autoStart();
} else {
    setTimeout(autoStart, 300);
}
</script>
