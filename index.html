<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 hamka</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
        .app{width:100%;max-width:420px;height:100vh;height:100dvh;background:#0a0a0a;display:flex;flex-direction:column;overflow:hidden}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222;min-height:50px}
        .top-bar span{font-size:14px;color:#00ff88;font-weight:700}
        .tab-nav{display:flex;gap:4px;padding:8px;background:#111;border-bottom:1px solid #222}
        .tab-nav button{flex:1;padding:10px 8px;border:none;border-radius:8px;background:transparent;color:#888;font-size:11px;font-weight:600;cursor:pointer}
        .tab-nav button.active{background:#00ff88;color:#000}
        .content-area{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
        .page{display:none}.page.show{display:block}
        .center-game{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:15px;padding:20px 0}
        .tap-circle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#2a2a35,#141418);border:3px solid #00ff88;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:55px;box-shadow:0 0 30px rgba(0,255,136,0.3);transition:transform 0.15s}
        .tap-circle:active{transform:scale(0.9)}
        .game-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin-bottom:8px}
        .bar-container{width:80%;height:6px;background:#222;border-radius:3px;overflow:hidden}
        .xp-fill{height:100%;background:linear-gradient(90deg,#4488ff,#00ccff);transition:width 0.4s;border-radius:3px}
        .btn{padding:12px 16px;border:none;border-radius:10px;font-weight:700;font-size:11px;cursor:pointer;transition:all 0.15s;text-align:center}
        .btn:active{transform:scale(0.95);opacity:0.8}
        .btn-g{background:#00ff88;color:#000}.btn-o{background:#ff8800;color:#fff}.btn-r{background:#ff4757;color:#fff}.btn-b{background:#4488ff;color:#fff}
        .btn-block{width:100%}.btn-sm{padding:8px 12px;font-size:10px}
        .card{background:#1a1a1d;padding:12px 14px;border-radius:10px;border:1px solid #222;margin-bottom:8px;font-size:11px}
        .shop-tabs{display:flex;gap:4px;margin-bottom:10px}
        .shop-tab{flex:1;padding:10px;border:1px solid #333;border-radius:8px;background:transparent;color:#999;font-size:10px;font-weight:600;cursor:pointer;text-align:center}
        .shop-tab.active{background:#00ff88;color:#000;border-color:#00ff88}
        .slot{width:50px;height:50px;background:#1a1a1d;border:2px solid #333;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
        .bet-row{display:flex;align-items:center;gap:8px}
        .bet-row input{width:60px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;padding:8px;border-radius:8px;font-size:11px;outline:none}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,0.95);padding:10px 20px;border-radius:20px;font-size:11px;font-weight:600;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid #333;color:#fff}
        .toast.show{opacity:1}
        .bal{text-align:center;padding:8px;background:#111;font-size:15px;font-weight:800;color:#ffcc00}
        .xp-info{text-align:center;font-size:10px;color:#4488ff;padding:4px}
        .promo-row{display:flex;gap:6px;padding:8px 12px;background:#111}
        .promo-row input{flex:1;background:#1a1a1d;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;font-size:11px;outline:none}
        .saper-cell{border:none;border-radius:2px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center}
        .stats-row{font-size:9px;color:#888;text-align:center}
        input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    </style>
</head>
<body>
<div class="app" id="app">
    <div id="login" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center">
        <div style="font-size:60px">🐹</div>
        <h2 style="color:#00ff88;margin:12px;font-size:24px">hamka</h2>
        <p style="color:#999;margin:8px 0;font-size:12px" id="tgInfo">Завантаження...</p>
        <button class="btn btn-g btn-block" onclick="playGame()" style="font-size:14px;margin-top:12px">🎮 Грати</button>
    </div>
    <div id="game" style="display:none;flex-direction:column;height:100%">
        <div class="top-bar"><span>🐹 <span id="userName">Гравець</span></span><span style="color:#ff44ff">🟣 <span id="homaDisp">0</span></span></div>
        <div class="tab-nav"><button class="active" onclick="switchTab('games',this)">🎮 Ігри</button><button onclick="switchTab('shop',this)">🛒 Магазин</button><button onclick="switchTab('info',this)">ℹ️ Інфо</button></div>
        <div class="content-area" id="contentArea"></div>
        <div class="bal" id="balance">💰 50</div>
        <div class="xp-info">⭐ Рівень <span id="lvlDisp">1</span> | XP: <span id="xpDisp">0</span> / 500</div>
        <div class="bar-container" style="width:90%;margin:0 auto"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <div class="promo-row"><input type="text" id="promoInp" placeholder="🎁 Промокод"><button class="btn btn-g btn-sm" onclick="activatePromo()">OK</button></div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
const LEVELS=[{l:1,x:0,rw:0},{l:2,x:500,rw:50},{l:3,x:1500,rw:100},{l:4,x:4000,rw:200},{l:5,x:10000,rw:500},{l:6,x:25000,rw:1000},{l:7,x:60000,rw:2000},{l:8,x:150000,rw:5000},{l:9,x:400000,rw:10000},{l:10,x:1000000,rw:25000}];
let coins=50,autoTap=0,tapLvl=1,totalTaps=0,totalWon=0,luck=1.0,lastSpin=0,coinBoost=1.0,autoXP=0,homa=0,saperHW=0,casinoW=0,maxEn=400,curEn=400,accXP=0,accLvl=1,tapPow=1.0,crit=0,curGif='🐹',morseUsed=0;
let buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
const usedPromos=[],promos={lordeddw:1000,robot:500,hamka2024:2500,gift:10000};
function getPrice(item){const p={maxEnergy:{base:5000,mult:1.8},autoXP:{base:15000,mult:2.5},autoTap:{base:500,mult:1.5},energyRegen:{base:50000,mult:3},upgradeTap:{base:2000,mult:2},coinBoostB:{base:15000,mult:2.5},energyUp:{base:15000,mult:2},tapPowerB:{base:50000,mult:3},critChanceB:{base:40000,mult:2.5},luckB:{base:10000,mult:2.5}};const d=p[item];if(!d)return 0;if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1));return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0))}
function defD(){coins=50;autoTap=0;tapLvl=1;totalTaps=0;luck=1.0;curGif='🐹';accXP=0;accLvl=1;coinBoost=1.0;autoXP=0;maxEn=400;curEn=400;homa=0;tapPow=1.0;crit=0;morseUsed=0;buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0}}
function saveG(){const d={coins,autoTap,tapLvl,totalTaps,luck,curGif,usedP:[...usedPromos],xp:accXP,lvl:accLvl,coinBoost,autoXP,maxEn,curEn,homa,tapPow,crit,morseUsed,buyCount};localStorage.setItem('hGuest',JSON.stringify(d))}
function loadD(d){coins=d.coins||50;autoTap=d.autoTap||0;tapLvl=d.tapLvl||1;totalTaps=d.totalTaps||0;luck=d.luck||1.0;curGif=d.curGif||'🐹';accXP=d.xp||0;accLvl=d.lvl||1;coinBoost=d.coinBoost||1.0;autoXP=d.autoXP||0;maxEn=d.maxEn||400;curEn=d.curEn||400;homa=d.homa||0;tapPow=d.tapPow||1.0;crit=d.crit||0;morseUsed=d.morseUsed||0;buyCount=d.buyCount||{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0}}
function startGame(){document.getElementById('login').style.display='none';document.getElementById('game').style.display='flex';document.getElementById('userName').textContent='Гравець';buildPages();updAll();openGame('tap');saveG()}
function playGame(){const s=localStorage.getItem('hGuest');if(s){try{loadD(JSON.parse(s))}catch(e){defD()}}else defD();startGame()}
function getLI(xp){let c=LEVELS[0],n=LEVELS[1];for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}}return{c,n}}
function addXP(a){const old=accLvl;accXP+=a;const li=getLI(accXP);accLvl=li.c.l;if(accLvl>old){coins+=li.c.rw;toast('🎉 Рівень '+accLvl+'! +'+li.c.rw+'💰')}updXp();saveG()}
function updXp(){const li=getLI(accXP);const next=li.n.x;const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100;document.getElementById('xpFill').style.width=Math.min(progress,100)+'%';document.getElementById('xpDisp').textContent=accXP;document.getElementById('lvlDisp').textContent=accLvl}
function buildPages(){document.getElementById('contentArea').innerHTML='<div id="tab-games" class="page show"><div class="game-btn-row"><button class="btn btn-g" onclick="openGame(\'tap\')">💸 Тап</button><button class="btn btn-o" onclick="openGame(\'casino\')">🎰 Казино</button><button class="btn btn-r" onclick="openGame(\'saper\')">💣 Сапер</button><button class="btn btn-b" onclick="openGame(\'morse\')">📻 Морзе</button></div><div id="game-area"></div></div><div id="tab-shop" class="page"><div class="shop-tabs"><button class="shop-tab active" onclick="shopTab(\'res\',event)">⚡ Ресурси</button><button class="shop-tab" onclick="shopTab(\'upg\',event)">⭐ Прокачка</button></div><div id="shop-res"></div><div id="shop-upg" style="display:none"></div></div><div id="tab-info" class="page"><div class="card"><b>📋 Команди</b><br><small>/help /info /neofetch /color"#f00" /maxenergy /maxtap</small></div><div class="card"><b>🎮 Як грати</b><br><small>Тапайте на коло для отримання монет. Грайте в казино, сапер та морзянку для більшого заробітку!</small></div></div>';renderShopRes();renderShopUpg()}
function renderShopRes(){document.getElementById('shop-res').innerHTML='<div class="card"><b>⚡ Енергія +50</b><br><small>💰'+getPrice('maxEnergy')+' | Куплено: '+buyCount.maxEnergy+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'maxEnergy\')">Купити</button></div><div class="card"><b>✨ Авто XP</b><br><small>💰'+getPrice('autoXP')+' | Куплено: '+buyCount.autoXP+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoXP\')">Купити</button></div><div class="card"><b>🚀 XP Бустер</b><br><small>💰500</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'xpBoost\')">Купити</button></div><div class="card"><b>⚡ Авто тап</b><br><small>💰'+getPrice('autoTap')+' | Куплено: '+buyCount.autoTap+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoTap\')">Купити</button></div><div class="card"><b>🔄 Регенерація +1</b><br><small>💰'+getPrice('energyRegen')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'energyRegen\')">Купити</button></div><div class="card" style="border-left:3px solid #ff44ff"><b>🟣 Купівля Хом</b><br><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-g btn-sm" onclick="buyHoma(1)" style="flex:1">1🟣 50K</button><button class="btn btn-g btn-sm" onclick="buyHoma(5)" style="flex:1">5🟣 250K</button></div></div>'}
function renderShopUpg(){document.getElementById('shop-upg').innerHTML='<div class="card"><b>⭐ Прокачка '+tapLvl+'</b><br><small>💰'+getPrice('upgradeTap')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'upgradeTap\')">Прокачати</button></div><div class="card"><b>🪙 Бустер монет</b><br><small>💰'+getPrice('coinBoostB')+' | x'+coinBoost.toFixed(1)+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'coinBoost\')">Купити</button></div><div class="card"><b>⚡ Енергія +100</b><br><small>💰'+getPrice('energyUp')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'energyUp\')">Купити</button></div><div class="card"><b>💪 Сила +50%</b><br><small>💰'+getPrice('tapPowerB')+' | x'+tapPow.toFixed(1)+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'tapPower\')">Купити</button></div><div class="card"><b>🎯 Крит +5%</b><br><small>💰'+getPrice('critChanceB')+' | '+crit+'%</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'critChance\')">Купити</button></div><div class="card"><b>🍀 Удача +0.1</b><br><small>💰'+getPrice('luckB')+' | x'+luck.toFixed(1)+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'luck\')">Купити</button></div>'}
function shopTab(t,ev){document.querySelectorAll('#shop-res, #shop-upg').forEach(e=>e.style.display='none');document.getElementById('shop-'+t).style.display='block';document.querySelectorAll('.shop-tab').forEach(b=>b.classList.remove('active'));if(ev&&ev.target)ev.target.classList.add('active')}
setInterval(()=>{if(curEn<maxEn){curEn=Math.min(maxEn,curEn+1+buyCount.energyRegen)}},1000);
let clicks=[],blocked=0;
function tapClick(e){if(blocked)return;if(curEn<=0){toast('⚡ Немає енергії!');return}curEn--;const now=Date.now();clicks=clicks.filter(t=>now-t<1000);if(clicks.length>=10){blocked=1;setTimeout(()=>{blocked=0;clicks=[]},2000);return}clicks.push(now);let inc=Math.floor(Math.random()*3)+1+(tapLvl-1);inc=Math.floor(inc*coinBoost*tapPow);if(Math.random()*100<crit)inc=Math.floor(inc*2);coins+=inc;totalTaps++;addXP(1);updBal();saveG()}
setInterval(()=>{if(autoTap>0){coins+=autoTap;updBal()}if(autoXP>0)addXP(autoXP);saveG()},1000);
function openGame(g){const a=document.getElementById('game-area');if(!a)return;if(g==='tap'){a.innerHTML='<div class="center-game"><div style="font-size:20px;font-weight:800;color:#ffcc00">🪙 <span id="tapBalance">'+coins+'</span></div><div style="background:#00ff88;color:#000;padding:4px 12px;border-radius:10px;font-size:10px">⭐ '+tapLvl+' | 💪 x'+tapPow.toFixed(1)+'</div><div class="tap-circle" id="tapBtn">'+curGif+'</div><div class="bar-container"><div class="energy-fill" id="tEnBar" style="width:'+(curEn/maxEn*100)+'%"></div></div><div class="stats-row">⚡ '+Math.floor(curEn)+'/'+maxEn+' | 👆 '+totalTaps+'</div></div>';document.getElementById('tapBtn').onclick=tapClick}else if(g==='casino'){a.innerHTML='<div class="center-game"><h3 style="color:#00ff88">🎰 Казино</h3><div style="display:flex;gap:8px"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">🍉</div></div><div class="bet-row"><button class="btn btn-g btn-sm" onclick="chBet(-10)">-</button><input type="number" id="bet" value="10"><button class="btn btn-g btn-sm" onclick="chBet(10)">+</button></div><button class="btn btn-o" onclick="spin()">🎰 КРУТИТИ (<span id="betDisp">10</span>💰)</button></div>'}else if(g==='saper'){resetSaper();renderSaper()}else if(g==='morse'){if(accLvl<6){a.innerHTML='<div class="center-game"><h3>🔒 Морзянка</h3><p style="color:#888">Доступна з 6 рівня</p></div>';return}if(morseUsed){a.innerHTML='<div class="center-game"><h3>📻 Морзянка</h3><p style="color:#888">Вже використано!</p></div>';return}a.innerHTML='<div class="center-game"><h3 style="color:#00ff88">📻 Морзянка</h3><p style="font-size:10px;color:#888">Введіть: <b style="color:#00ff88;font-size:14px">IMA</b></p><p style="color:#888;font-size:10px">+50000💰 +2500XP</p><div id="morseDisp" style="font-size:18px;color:#00ff88;min-height:20px"></div><div style="display:flex;gap:8px"><button class="btn btn-b btn-sm" onmousedown="startDot()" onmouseup="stopMorse()">•</button><button class="btn btn-o btn-sm" onmousedown="startDash()" onmouseup="stopMorse()">−</button></div><button class="btn btn-g" onclick="submitMorse()">Відправити</button><div id="morseRes" style="color:#888;font-size:9px"></div></div>'}}
function chBet(d){const i=document.getElementById('bet');if(i){i.value=Math.max(1,parseInt(i.value||10)+d);document.getElementById('betDisp').textContent=i.value}}
function spin(){const now=Date.now();if(now-lastSpin<3000)return;const bet=Number(document.getElementById('bet')?.value||0);if(!bet||coins<bet)return;lastSpin=now;coins-=bet;updBal();const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');if(!s1||!s2||!s3)return;const em=["🍒","🍋","🍉","⭐","7️⃣","💎"];const int=setInterval(()=>{s1.textContent=em[Math.floor(Math.random()*6)];s2.textContent=em[Math.floor(Math.random()*6)];s3.textContent=em[Math.floor(Math.random()*6)]},80);setTimeout(()=>{clearInterval(int);const x=em[Math.floor(Math.random()*6)],y=em[Math.floor(Math.random()*6)],z=em[Math.floor(Math.random()*6)];s1.textContent=x;s2.textContent=y;s3.textContent=z;let win=0;if(x===y&&y===z)win=bet*3;else if(x===y||y===z||x===z)win=Math.floor(bet*1.5);win=Math.floor(win*luck);coins+=win;if(win>0){addXP(Math.floor(win/5));totalWon++}updBal();saveG()},1200)}
let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sActive=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal';
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0}}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt}}
function renderSaper(){const a=document.getElementById('game-area');if(!a)return;const cs=Math.min(22,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 Ставка: <input type="number" id="saperBetInp" value="100" style="width:50px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;border-radius:4px;padding:4px;font-size:10px"> | 🏆 x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:6px;margin:4px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'')+'" onclick="saperMode=\'reveal\';renderSaper()">👆 Відкрити</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'')+'" onclick="saperMode=\'flag\';renderSaper()">🚩 Прапор</button></div><div style="display:inline-grid;gap:1px;grid-template-columns:repeat('+sCols+','+cs+'px)">';
for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#444';if(d.revealed){bg=d.mine?'#ff4757':'#1a1a1d';if(d.mine)t='💣';else if(d.adj>0)t=d.adj}else if(d.flag){bg='#ff8800';t='🚩'}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.45)+'px" onclick="saperClick('+r+','+c+')">'+t+'</button>'}
h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#555;color:#fff">📊 '+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1}else{revealCell(r,c)}renderSaper()}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c)}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;sActive=0;toast('💥 Міна! -'+sBet+'💰')}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc)}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 Перемога! +'+w+'💰');if(sRows===13)saperHW++;saveG()}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача! 50/50')}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;sActive=1;updBal();resetSaper();renderSaper();saveG()}
function changeSaperDiff(){if(sRows===7){sRows=10;sCols=10;sMines=16}else if(sRows===10){sRows=13;sCols=13;sMines=24}else{sRows=7;sCols=7;sMines=10}resetSaper();renderSaper()}
let morseCode='',morseSeq='',morseTimeout=null;
function startDot(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='.';document.getElementById('morseDisp').textContent=morseSeq}
function startDash(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='-';document.getElementById('morseDisp').textContent=morseSeq}
function stopMorse(){morseTimeout=setTimeout(()=>{if(morseSeq.length>0){const l=Object.keys({I:'..',M:'--',A:'.-'}).find(k=>({I:'..',M:'--',A:'.-'})[k]===morseSeq);if(l){morseCode+=l;document.getElementById('morseRes').textContent='Код: '+morseCode}morseSeq=''}},800)}
function submitMorse(){if(accLvl<6)return;if(morseUsed){toast('❌ Вже використано!');return}if(morseSeq.length>0){const l=Object.keys({I:'..',M:'--',A:'.-'}).find(k=>({I:'..',M:'--',A:'.-'})[k]===morseSeq);if(l)morseCode+=l;morseSeq=''}if(morseCode==='IMA'){coins+=50000;addXP(2500);morseUsed=1;morseCode='';updBal();saveG();toast('✅ +50000💰 +2500XP!');openGame('morse')}else{document.getElementById('morseRes').textContent='❌ Невірний код!';morseCode=''}}
function buyItem(t){if(t==='maxEnergy'){const p=getPrice('maxEnergy');if(coins<p)return;coins-=p;maxEn+=50;curEn=Math.min(curEn+50,maxEn);buyCount.maxEnergy++}else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p)return;coins-=p;autoXP++;buyCount.autoXP++}else if(t==='xpBoost'){if(coins<500)return;coins-=500;addXP(100)}else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p)return;coins-=p;autoTap++;buyCount.autoTap++}else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p)return;coins-=p;buyCount.energyRegen++}else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p)return;coins-=p;tapLvl++;buyCount.upgradeTap++}else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p)return;coins-=p;coinBoost+=0.5;buyCount.coinBoostB++}else if(t==='energyUp'){const p=getPrice('energyUp');if(coins<p)return;coins-=p;maxEn+=100;curEn=Math.min(curEn+100,maxEn);buyCount.energyUp++}else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p)return;coins-=p;tapPow+=0.5;buyCount.tapPowerB++}else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p)return;coins-=p;crit+=5;buyCount.critChanceB++}else if(t==='luck'){const p=getPrice('luckB');if(coins<p)return;coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++}updAll();saveG();toast('✅ Куплено!')}
function buyHoma(n){const p=n*50000;if(coins<p)return;coins-=p;homa+=n;updAll();saveG();toast('✅ +'+n+'🟣')}
function updAll(){updBal();updXp();updHoma();renderShopRes();renderShopUpg()}
function updBal(){document.getElementById('balance').textContent='💰 '+coins;const tb=document.getElementById('tapBalance');if(tb)tb.textContent=coins}
function updHoma(){document.getElementById('homaDisp').textContent=homa}
function activatePromo(){const i=document.getElementById('promoInp');const c=i.value.trim().toLowerCase();if(!c)return;if(usedPromos.includes(c)){toast('❌ Використано!');return}if(promos[c]){coins+=promos[c];usedPromos.push(c);updBal();toast('🎁 +'+promos[c]+'💰');saveG();i.value=''}else{toast('❌ Невірний!')}}
function switchTab(t,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));const tab=document.getElementById('tab-'+t);if(tab)tab.classList.add('show');document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}
</script>
