<script>
// ==================== КОНФІГ FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyD1-UDrqRzfUw_32nOzqT2mAozzab5DJZk",

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

const GIFS=[{id:'🐹',e:'🐹',r:'common'},{id:'🐱',e:'🐱',r:'common'},{id:'🐶',e:'🐶',r:'common'},{id:'🦊',e:'🦊',r:'common'},{id:'🐻',e:'🐻',r:'common'},{id:'🐯',e:'🐯',r:'rare'},{id:'🦁',e:'🦁',r:'rare'},{id:'🐺',e:'🐺',r:'rare'},{id:'👑',e:'👑',r:'superrare'},{id:'💎',e:'💎',r:'superrare'},{id:'🌟',e:'🌟',r:'epic'},{id:'🔥',e:'🔥',r:'epic'},{id:'🚀',e:'🚀',r:'mythic'},{id:'🦄',e:'🦄',r:'legendary'},{id:'🐲',e:'🐲',r:'legendary'},{id:'⚔️',e:'⚔️',r:'exclusive',homa:1}];
const R={common:{n:'Простий',p:1000},rare:{n:'Рідкісний',p:3000},superrare:{n:'Надрідкісний',p:8000},epic:{n:'Епічний',p:50000},mythic:{n:'Міфічний',p:150000},legendary:{n:'Легендарний',p:500000},exclusive:{n:'Ексклюзивний',p:0}};
const LEVELS=[{l:1,x:0,rw:0},{l:2,x:200,rw:20},{l:3,x:600,rw:40},{l:4,x:1500,rw:80},{l:5,x:4000,rw:160},{l:6,x:10000,rw:320},{l:7,x:25000,rw:640},{l:8,x:60000,rw:1280},{l:9,x:150000,rw:2500},{l:10,x:400000,rw:5000},{l:11,x:1000000,rw:10000},{l:12,x:2500000,rw:25000},{l:13,x:6000000,rw:50000},{l:14,x:15000000,rw:100000},{l:15,x:40000000,rw:250000},{l:16,x:100000000,rw:500000},{l:17,x:250000000,rw:1000000},{l:18,x:600000000,rw:2500000},{l:19,x:1500000000,rw:5000000},{l:20,x:4000000000,rw:10000000}];

let coins=50,inv=[],autoTap=0,tapLvl=1,totalTaps=0,totalWon=0,luck=1.0,lastSpin=0,isAdmin=0,coinBoost=1.0,autoXP=0,homa=0,saperHW=0,casinoW=0,maxEn=400,curEn=400,accXP=0,accLvl=1,userName='Гравець',myGifs=['🐹'],curGif='🐹',myTitles=['none'],curTitle='none',morseUsed=0,tapPow=1.0,crit=0;
let buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
const usedPromos=[],promos={lordeddw:500,robot:300,hamka2024:1000,gift:5000};
let lastSaveTime=Date.now();

let currentNick = localStorage.getItem('hamka_nick') || null;
let savedPassHash = localStorage.getItem('hamka_pass') || null;
let gameInterval = null;

// ---- Хешування ----
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function saveAuth(nick, passHash) {
    localStorage.setItem('hamka_nick', nick);
    localStorage.setItem('hamka_pass', passHash);
    currentNick = nick;
    savedPassHash = passHash;
}
function clearAuth() {
    localStorage.removeItem('hamka_nick');
    localStorage.removeItem('hamka_pass');
    currentNick = null;
    savedPassHash = null;
}
function getUserKey(){
    if(currentNick) return 'nick_' + currentNick;
    if(tg?.initDataUnsafe?.user?.id) return 'tg_' + tg.initDataUnsafe.user.id;
    return 'guest_user';
}

// ---- Дані ----
function loadD(d){
    coins=d.coins||50; inv=d.inv||[]; autoTap=d.autoTap||0; tapLvl=d.tapLvl||1; totalTaps=d.totalTaps||0; totalWon=d.totalWon||0; luck=d.luck||1.0;
    curGif=d.curGif||'🐹'; myGifs=d.myGifs||['🐹']; accXP=d.xp||0; accLvl=d.lvl||1; myTitles=d.myTitles||['none']; curTitle=d.curTitle||'none';
    coinBoost=d.coinBoost||1.0; autoXP=d.autoXP||0; maxEn=d.maxEn||400; curEn=d.curEn||400; homa=d.homa||0; saperHW=d.saperHW||0; casinoW=d.casinoW||0;
    tapPow=d.tapPow||1.0; crit=d.crit||0; morseUsed=d.morseUsed||0;
    buyCount=d.buyCount||{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
    lastSaveTime=d.lastSaveTime||Date.now();
    userName=d.name||userName;
}
function defD(){
    coins=50; inv=[]; autoTap=0; tapLvl=1; totalTaps=0; luck=1.0; curGif='🐹'; myGifs=['🐹']; accXP=0; accLvl=1; myTitles=['none']; curTitle='none';
    coinBoost=1.0; autoXP=0; maxEn=400; curEn=400; homa=0; saperHW=0; casinoW=0; tapPow=1.0; crit=0; morseUsed=0;
    buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
    lastSaveTime=Date.now();
}
function saveG(){
    lastSaveTime=Date.now();
    const d={coins,inv,autoTap,tapLvl,totalTaps,totalWon,luck,curGif,myGifs,xp:accXP,lvl:accLvl,myTitles,curTitle,coinBoost,autoXP,maxEn,curEn,homa,saperHW,casinoW,tapPow,crit,morseUsed,buyCount,lastSaveTime,name:userName,avatar:curGif};
    if(currentNick) d.passwordHash = savedPassHash;
    db.ref('users/'+getUserKey()).set(d);
}
function loadGameData(callback){
    db.ref('users/'+getUserKey()).once('value').then(snap=>callback(snap.val()||null)).catch(()=>callback(null));
}

// ---- Офлайн бонус ----
function processOfflineBonus(){
    const now=Date.now();
    const sec=Math.floor((now - lastSaveTime)/1000);
    if(sec>30){
        const maxSec=Math.min(sec,10800);
        curEn=Math.min(maxEn, curEn+Math.floor(maxSec*(1+buyCount.energyRegen)));
        if(autoTap>0) coins+=Math.floor(maxSec*(autoTap/5));
        if(autoXP>0) addXP(Math.floor(maxSec*autoXP));
        document.getElementById('offlineBonus').style.display='block';
        document.getElementById('offlineBonus').innerHTML='🎁 Офлайн бонус за '+Math.floor(maxSec/60)+'хв';
        setTimeout(()=>document.getElementById('offlineBonus').style.display='none',8000);
    }
}

// ---- Ігровий інтервал ----
function startGameInterval(){
    if(gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(()=>{
        curEn=Math.min(maxEn,curEn+1+buyCount.energyRegen);
        updEnergy();
        if(autoTap>0){coins+=autoTap;updBal();}
        if(autoXP>0)addXP(autoXP);
        saveG();
    },1000);
}

// ---- Старт гри ----
function startGame(){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('game').style.display='flex';
    document.getElementById('userName').textContent=userName;
    buildPages();
    updAll();
    openGame('tap');
    saveG();
    startGameInterval();
    updateTopTitles(); // оновлюємо титули за топ
}

// ---- Авторизація ----
async function handleLogin(){
    const nick=document.getElementById('authNick').value.trim();
    const pass=document.getElementById('authPass').value;
    if(!nick||!pass){toast('Введи нік та пароль');return;}
    const key='nick_'+nick;
    try{
        const snap=await db.ref('users/'+key).once('value');
        const data=snap.val();
        if(!data||!data.passwordHash){toast('❌ Невірний нік або пароль');return;}
        const hash=await sha256(pass);
        if(hash===data.passwordHash){
            saveAuth(nick,hash);
            userName=nick;
            loadD(data);
            processOfflineBonus();
            startGame();
        }else{toast('❌ Невірний пароль');}
    }catch(e){toast('Помилка мережі');}
}

async function handleRegister(){
    const nick=document.getElementById('authNick').value.trim();
    const pass=document.getElementById('authPass').value;
    if(!nick||!pass){toast('Введи нік та пароль');return;}
    if(nick.length<3||pass.length<4){toast('Нік від 3 символів, пароль від 4');return;}
    const key='nick_'+nick;
    const snap=await db.ref('users/'+key).once('value');
    if(snap.val()){toast('❌ Такий нік вже зайнятий');return;}
    const hash=await sha256(pass);
    saveAuth(nick,hash);
    userName=nick;
    defD();
    saveG();
    startGame();
}

function authAsGuest(){
    clearAuth();
    if(tg?.initDataUnsafe?.user?.id){
        userName=tg.initDataUnsafe.user.first_name||'Гравець';
    }else{userName='Гість';}
    currentNick=null;
    loadGameData(data=>{
        if(data) loadD(data);
        else defD();
        processOfflineBonus();
        startGame();
    });
}

function loginWithTelegram() {
    if (tg?.initDataUnsafe?.user?.id) {
        userName = tg.initDataUnsafe.user.first_name || 'Гравець';
        currentNick = null;
        loadGameData(gameData => {
            if (gameData) loadD(gameData);
            else defD();
            processOfflineBonus();
            startGame();
        });
    } else {
        toast('Відкрий гру в Telegram, щоб увійти');
    }
}

function logout(){
    if(gameInterval){clearInterval(gameInterval);gameInterval=null;}
    clearAuth();
    location.reload();
}

// ---- Автостарт ----
function autoStart(){
    if(currentNick&&savedPassHash){
        const key='nick_'+currentNick;
        db.ref('users/'+key).once('value').then(snap=>{
            const data=snap.val();
            if(data&&data.passwordHash===savedPassHash){
                userName=currentNick;
                loadGameData(gameData=>{
                    if(gameData)loadD(gameData);
                    else defD();
                    processOfflineBonus();
                    startGame();
                });
            }else{clearAuth();showAuthScreen();}
        }).catch(()=>showAuthScreen());
    }else if(tg?.initDataUnsafe?.user?.id){
        userName=tg.initDataUnsafe.user.first_name||'Гравець';
        loadGameData(gameData=>{
            if(gameData)loadD(gameData);
            else defD();
            processOfflineBonus();
            startGame();
        });
    }else{showAuthScreen();}
}
function showAuthScreen(){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('game').style.display='none';
    if (tg?.initDataUnsafe?.user?.id) {
        document.getElementById('tgLoginBtn').style.display = 'block';
    }
}
setTimeout(autoStart,300);

// ==================== ТИТУЛИ ЗА ТОП ====================
function updateTopTitles() {
    const key = getUserKey();
    db.ref('users').orderByChild('coins').limitToLast(10).once('value')
    .then(snap => {
        const topList = [];
        snap.forEach(child => {
            const data = child.val();
            if (data && typeof data.coins === 'number') {
                topList.push({ key: child.key, coins: data.coins });
            }
        });
        topList.sort((a, b) => b.coins - a.coins);
        const position = topList.findIndex(item => item.key === key) + 1;
        const topTitles = ['king', 'lord', 'knight'];
        // Видаляємо попередні топ-титули
        myTitles = myTitles.filter(t => !topTitles.includes(t));
        let newTopTitle = null;
        if (position === 1) {
            myTitles.push('king');
            newTopTitle = 'king';
            toast('👑 Ви стали Королем! (1 місце в топі)');
        } else if (position === 2) {
            myTitles.push('lord');
            newTopTitle = 'lord';
            toast('🗡️ Ви стали Лордом! (2 місце в топі)');
        } else if (position === 3) {
            myTitles.push('knight');
            newTopTitle = 'knight';
            toast('🛡️ Ви стали Лицарем! (3 місце в топі)');
        }
        // Автоматично встановлюємо топ-титул, якщо він новий і гравець не вибрав інший
        if (newTopTitle && curTitle !== newTopTitle) {
            curTitle = newTopTitle;
        } else if (!newTopTitle && topTitles.includes(curTitle)) {
            // Якщо більше не в топ-3, скидаємо на наступний доступний титул
            const priority = ['king', 'lord', 'knight', 'hamka', 'pro', 'player', 'noob', 'none'];
            let fallback = 'none';
            for (const t of priority) {
                if (myTitles.includes(t)) {
                    fallback = t;
                    break;
                }
            }
            curTitle = fallback;
        }
        saveG();
        updAll();
    }).catch(e => console.error('Помилка оновлення топ-титулів:', e));
}

function getPrice(item){
    const p={maxEnergy:{base:2000,mult:1.5},autoXP:{base:5000,mult:2},autoTap:{base:300,mult:1.4},energyRegen:{base:15000,mult:2.5},upgradeTap:{base:1000,mult:1.8},coinBoostB:{base:5000,mult:2},energyUp:{base:5000,mult:1.8},tapPowerB:{base:15000,mult:2.5},critChanceB:{base:10000,mult:2},luckB:{base:3000,mult:2}};
    const d=p[item];if(!d)return 0;
    if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1));
    return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0));
}

function getLI(xp){
    let c=LEVELS[0],n=LEVELS[1];
    for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}}
    return{c,n};
}
function addXP(a){
    const old=accLvl;
    accXP+=a;
    const li=getLI(accXP);
    accLvl=li.c.l;
    if(accLvl>old){coins+=li.c.rw;toast('🎉 Рівень '+accLvl+'! +'+li.c.rw+'💰');}
    updXp();
}
function updXp(){
    const li=getLI(accXP);
    const next=li.n.x;
    const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100;
    document.getElementById('xpFill').style.width=Math.min(progress,100)+'%';
    document.getElementById('xpDisp').textContent=accXP;
    document.getElementById('lvlDisp').textContent=accLvl;
}
function updEnergy(){
    document.getElementById('energyFill').style.width=(curEn/maxEn*100)+'%';
    document.getElementById('energyText').textContent=Math.floor(curEn);
    document.getElementById('maxEnergyText').textContent=maxEn;
}
function updBal(){
    document.getElementById('balance').textContent='💰 '+coins;
    const tb=document.getElementById('tapBalance');
    if(tb)tb.textContent=coins;
}

// Сапер
let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal',saperGameActive=false;
function resetSaper(){
    saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;saperGameActive=false;
    for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0};}
}
function placeMines(sr,sc){
    let p=0;
    while(p<sMines){
        const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);
        if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;
        if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++;}
    }
    for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){
        let cnt=0;
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;
        saperGrid[r][c].adj=cnt;
    }
}
function renderSaper(){
    const a=document.getElementById('game-area');
    const cs=Math.min(24,Math.floor((window.innerWidth-40)/sCols));
    let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#1f2937;color:#fff;border:1px solid #374151;border-radius:3px;padding:2px;font-size:8px"> | x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'btn-o')+'" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'btn-g')+'" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat('+sCols+','+cs+'px);background:#1f2937;padding:4px;border-radius:6px">';
    for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){
        const d=saperGrid[r][c];let t='',bg='#374151';
        if(d.revealed){bg=d.mine?'#ef4444':'#4b5563';if(d.mine)t='💣';else if(d.adj>0)t=d.adj;}
        else if(d.flag){bg='#f97316';t='🚩';}
        h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.5)+'px;touch-action:manipulation" onclick="saperClick('+r+','+c+')">'+t+'</button>';
    }
    h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#374151;color:#fff">'+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';
    a.innerHTML=h;
}
function saperClick(r,c){
    if(sOver)return;
    if(saperMode==='flag'){
        if(saperGrid[r][c].revealed)return;
        saperGrid[r][c].flag=!saperGrid[r][c].flag;
        sFlags+=saperGrid[r][c].flag?1:-1;
    }else{revealCell(r,c);}
    renderSaper();
}
function revealCell(r,c){
    if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;
    if(sFirst){sFirst=0;placeMines(r,c);}
    saperGrid[r][c].revealed=1;sRevealed++;
    if(saperGrid[r][c].mine){
        sOver=1;
        for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;
        toast('💥 Міна!');
    }else if(saperGrid[r][c].adj===0){
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc);
    }
    if(!sOver&&sRevealed>=sRows*sCols-sMines){
        if(Math.random()<0.5){
            sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 +'+w+'💰');saveG();
        }else{
            sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача');
        }
    }
}
function startSaperBet(){
    const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);
    if(!b||b<10||coins<b)return;
    coins-=b;sBet=b;updBal();
    resetSaper();saperGameActive=true;renderSaper();saveG();
}
function changeSaperDiff(){
    if(saperGameActive){toast('Закінчіть поточну гру');return;}
    if(sRows===7){sRows=10;sCols=10;sMines=16;}
    else if(sRows===10){sRows=13;sCols=13;sMines=24;}
    else{sRows=7;sCols=7;sMines=10;}
    sMult=sRows===7?1.3:sRows===10?1.6:2.0;
    resetSaper();renderSaper();
}

    <div class="card homa-card"><b>🟣 Хома-ящик</b><br><small>500🟣</small><br><button class="btn btn-g btn-block btn-sm" onclick="openHomaChest()">Відкрити</button></div>
    <div class="card homa-card"><b>🟣 Хома x10</b><br><small>4500🟣</small><br><button class="btn btn-g btn-block btn-sm" onclick="openHomaChestBulk(10)">Відкрити 10</button></div>`;
}

// Купівля
function buyItem(t){
    if(t==='maxEnergy'){const p=getPrice('maxEnergy');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;maxEn+=50;curEn=Math.min(curEn+50,maxEn);buyCount.maxEnergy++;}
    else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;autoXP++;buyCount.autoXP++;}
    else if(t==='xpBoost'){if(coins<300){toast('❌ 300💰');return}coins-=300;addXP(100);}
    else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;autoTap++;buyCount.autoTap++;}
    else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;buyCount.energyRegen++;}
    else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;tapLvl++;buyCount.upgradeTap++;}
    else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;coinBoost+=0.5;buyCount.coinBoostB++;}
    else if(t==='energyUp'){const p=getPrice('energyUp');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;maxEn+=100;curEn=Math.min(curEn+100,maxEn);buyCount.energyUp++;}
    else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;tapPow+=0.5;buyCount.tapPowerB++;}
    else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;crit+=5;buyCount.critChanceB++;}
    else if(t==='vip'){if(inv.includes('VIP')){toast('✅ Вже є!');return}if(coins<20000){toast('❌ 20000💰');return}coins-=20000;inv.push('VIP');luck=Math.min(luck+0.1,1.3);buildVip();toast('👑 VIP!');}
    else if(t==='luck'){const p=getPrice('luckB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++;}
    updAll();saveG();toast('✅ Куплено!');
}
function buyHoma(n){const p=n*50000;if(coins<p){toast('❌ '+p+'💰');return}coins-=p;homa+=n;updAll();saveG();toast('✅ +'+n+'🟣');}
function buyHomaTitle(){if(myTitles.includes('hamka')){toast('✅ Вже є!');return}if(homa<25000){toast('❌ 25000🟣');return}homa-=25000;myTitles.push('hamka');updAll();saveG();toast('🏅 Хамка!');}
function buyHomaGif(){if(myGifs.includes('⚔️')){toast('✅ Вже є!');return}if(homa<15000){toast('❌ 15000🟣');return}homa-=15000;myGifs.push('⚔️');updAll();saveG();toast('⚔️ Меч!');}

// Гіфки
function renderGifShop(){
    const s=document.getElementById('gifShop');if(!s)return;
    s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>myGifs.includes(g.id)?'<div class="gif-cell" style="border-color:#4b5563">'+g.e+'</div>':'<div class="gif-cell" onclick="buyGif(\''+g.id+'\')">'+g.e+'<span class="gif-price">'+(R[g.r]?.p||1000)+'</span></div>').join('');
}
function buyGif(id){
    const g=GIFS.find(g=>g.id===id);if(!g||myGifs.includes(id))return;if(g.homa)return;
    const p=R[g.r]?.p||1000;if(coins<p){toast('❌ '+p+'💰');return}
    coins-=p;myGifs.push(id);updAll();saveG();toast('✅ '+g.e+'!');
}
function renderTitleShop(){
    const s=document.getElementById('titleShop');if(!s)return;
    const a=[{id:'noob',name:'Новачок',price:50000},{id:'player',name:'Гравець',price:150000},{id:'pro',name:'Профі',price:500000}].filter(t=>!myTitles.includes(t.id));
    s.innerHTML=a.length===0?'<p style="color:#888;font-size:8px">✅</p>':a.map(t=>'<div class="card"><b>🏅 '+t.name+'</b><br><small>💰'+t.price+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyTitle(\''+t.id+'\')">Купити</button></div>').join('');
}
function buyTitle(id){if(myTitles.includes(id))return;const prices={noob:50000,player:150000,pro:500000};const p=prices[id]||100000;if(coins<p){toast('❌ '+p+'💰');return}coins-=p;myTitles.push(id);updAll();saveG();toast('✅ Титул!');}
function selGif(id){if(!myGifs.includes(id))return;curGif=id;updAll();saveG();}

// Ящики
function openChest(r){
    const p={common:30000,rare:100000,epic:500000,legendary:2000000,mythic:10000000};if(!p[r]||coins<p[r]){toast('❌ Недостатньо монет!');return}
    coins-=p[r];updBal();saveG();toast('📦 Відкриваємо...');
    setTimeout(()=>{
        const rand=Math.random();
        if(rand<0.4){homa++;toast('🟣 +1 Хома!')}
        else if(rand<0.8){const g=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(g.length>0){const pk=g[Math.floor(Math.random()*g.length)];myGifs.push(pk.id);toast('🎨 '+pk.e+' Гіфка!')}else{homa+=2;toast('🟣 +2 Хоми!')}}
        else{coins+=Math.floor(p[r]*0.5);updBal();toast('💰 +'+Math.floor(p[r]*0.5)+' монет!')}
        updAll();saveG();
    },1500);
}
function openHomaChest(){if(homa<500){toast('❌ 500🟣');return}homa-=500;updAll();saveG();toast('🟣 Відкриваємо...');setTimeout(()=>{const rand=Math.random();if(rand<0.5){homa+=Math.floor(Math.random()*200)+100;toast('🟣 +Хоми!')}else{const g=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(g.length>0){const pk=g[Math.floor(Math.random()*g.length)];myGifs.push(pk.id);toast('🎨 '+pk.e+' Гіфка!')}else{homa+=250;toast('🟣 +250 Хом!')}}updAll();saveG();},1500);}
function openHomaChestBulk(n){n=parseInt(n)||10;if(homa<4500){toast('❌ 4500🟣');return}homa-=4500;updAll();saveG();for(let i=0;i<n;i++){setTimeout(()=>{const rand=Math.random();if(rand<0.5)homa+=Math.floor(Math.random()*200)+100;else{const g=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(g.length>0)myGifs.push(g[Math.floor(Math.random()*g.length)].id)}if(i===n-1){updAll();saveG();toast('✅ 10 ящиків!')}},i*200);}}

// VIP та профіль
function buildVip(){
    const v=document.getElementById('vip-area');
    if(isAdmin||inv.includes('VIP')){
        v.innerHTML='<div><b style="color:#00ff88;font-size:10px">🎨 Гіфка (вибір)</b><div class="gif-row" id="styleGifGrid"></div><b style="color:#00ff88;font-size:10px;display:block;margin-top:6px">🎨 Колір теми</b><div class="color-dots"><div class="color-dot active" style="background:#00ff88" onclick="chTheme(\'#00ff88\')"></div><div class="color-dot" style="background:#ef4444" onclick="chTheme(\'#ef4444\')"></div><div class="color-dot" style="background:#3b82f6" onclick="chTheme(\'#3b82f6\')"></div></div><b style="color:#00ff88;font-size:10px;display:block;margin-top:6px">💻 Консоль</b><div class="console-box" id="consoleOutput">Готово. /help</div><input type="text" class="console-inp" id="consoleInput" placeholder="Команда..."><button class="btn btn-g btn-sm btn-block" onclick="execConsole()">▶ Виконати</button></div>';
        renderStyleGifs();
    }else{v.innerHTML='<h3 style="color:#ef4444;text-align:center;font-size:10px">🔒 Потрібен VIP (20000💰)</h3>';}
}
function buildProfile(){
    const a=document.getElementById('profile-area');
    const titleNames={king:'👑 Король',lord:'🗡️ Лорд',knight:'🛡️ Лицар',hamka:'🐹 Хамка',pro:'Профі',player:'Гравець',noob:'Новачок',none:'Без титулу'};
    const currentTitleName=titleNames[curTitle]||curTitle;
    a.innerHTML='<div class="profile-header"><div class="avatar">'+curGif+'</div><div class="name">'+userName+'</div><div class="level">'+currentTitleName+' | ⭐ Рівень '+accLvl+'</div></div><div class="profile-stats"><div class="profile-stat"><div class="value">💰 '+coins+'</div>Монети</div><div class="profile-stat"><div class="value">🟣 '+homa+'</div>Хоми</div><div class="profile-stat"><div class="value">👆 '+totalTaps+'</div>Тапів</div><div class="profile-stat"><div class="value">💪 x'+tapPow.toFixed(1)+'</div>Сила</div></div><div class="card" style="margin-top:6px"><b>🎒 Інвентар</b><br><small>Гіфки: '+myGifs.join(' ')+'</small><br><small>Титули: '+myTitles.filter(t=>t!=='none').map(t=>titleNames[t]||t).join(', ')+'</small></div>';
    if(currentNick)a.innerHTML+='<button class="btn btn-r btn-block btn-sm" onclick="logout()">🚪 Вийти</button>';
}
function buildTop(){
    const a=document.getElementById('top-area');
    a.innerHTML='<div class="card"><b>🏆 Топ гравців</b></div><p style="color:#888;text-align:center;font-size:9px">Завантаження...</p>';
    db.ref('users').orderByChild('coins').limitToLast(20).once('value')
    .then(snap=>{
        const sorted=[];
        snap.forEach(child=>{
            const data=child.val();
            if(data&&typeof data.coins==='number') sorted.push({key:child.key,...data});
        });
        sorted.sort((a,b)=>(b.coins||0)-(a.coins||0));
        let h='<div class="card"><b>🏆 Топ гравців</b></div>';
        if(sorted.length===0){h+='<p style="color:#888;text-align:center;font-size:9px">Немає даних</p>';}
        else{
            sorted.slice(0,20).forEach((data,i)=>{
                const rank=i+1;
                const rankClass=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
                let displayName=data.name;
                if(!displayName) displayName=data.key.replace('nick_','').replace('tg_','').replace('guest_user','Гість');
                const avatar=data.avatar||'🐹';
                const lvl=data.lvl||1;
                const coinsVal=data.coins||0;
                const medal=rank<=3?['🥇','🥈','🥉'][i]:rank;
                // Показуємо титул гравця, якщо є
                const titleNames={king:'👑',lord:'🗡️',knight:'🛡️',hamka:'🐹',pro:'⭐',player:'🎮',noob:'🆕'};
                const titleIcon=titleNames[data.curTitle]||'';
                h+=`<div class="top-item">
                    <div class="rank ${rankClass}" style="background:${rankClass?'':'#333'}">${medal}</div>
                    <div style="flex:1"><b>${avatar} ${displayName} ${titleIcon}</b><br><small style="color:#888">⭐ ${lvl} рівень</small></div>
                    <div style="color:#fbbf24;font-weight:700">💰 ${coinsVal}</div>
                </div>`;
            });
        }
        a.innerHTML=h;
        updateTopTitles(); // оновлюємо власні титули після завантаження топу
    })
    .catch(err=>{a.innerHTML='<div class="card"><b>🏆 Топ гравців</b></div><p style="color:#888;text-align:center;font-size:9px">Помилка завантаження</p>';console.error(err);});
}
function renderStyleGifs(){
    const s=document.getElementById('styleGifGrid');if(!s)return;
    s.innerHTML=GIFS.map(g=>'<div class="gif-cell '+(curGif===g.id?'sel':'')+' '+(myGifs.includes(g.id)?'':'locked')+'" onclick="selGif(\''+g.id+'\')">'+g.e+'</div>').join('');
}
function chTheme(c){document.documentElement.style.setProperty('--main',c);}
function execConsole(){
    const i=document.getElementById('consoleInput');const c=i.value.trim();if(!c)return;
    const o=document.getElementById('consoleOutput');if(!o)return;
    function clog(t){o.innerHTML+=t+'\n';o.scrollTop=o.scrollHeight;}
    clog('> '+c);
    if(!inv.includes('VIP')&&!isAdmin){clog('❌ Потрібен VIP');i.value='';return;}
    if(c=='/help')clog('/help /clear /info /neofetch /color"#f00" /rename"Ім\'я" /title <назва>');
    else if(c=='/clear')o.innerHTML='';
    else if(c=='/info')clog('💰'+coins+' 🟣'+homa+' ⭐'+tapLvl+' XP:'+accXP);
    else if(c=='/neofetch')clog('╔══╗\n║'+userName+'\n╚══╝\n💰'+coins+'\n🟣'+homa+'\n⭐'+accLvl+'\n👆'+totalTaps);
    else if(c.startsWith('/color"')){const m=c.match(/\/color"([^"]+)"/);if(m){chTheme(m[1]);clog('✅');}}
    else if(c.startsWith('/rename"')){const m=c.match(/\/rename"([^"]+)"/);if(m){userName=m[1];document.getElementById('userName').textContent=userName;saveG();clog('✅');}}
    else if(c.startsWith('/title ')){
        const newTitle=c.split(' ')[1];
        if(myTitles.includes(newTitle)){
            curTitle=newTitle;
            updAll();
            saveG();
            clog('✅ Титул змінено на '+newTitle);
        }else{clog('❌ У вас немає цього титулу');}
    }
    else clog('❌');i.value='';
}

// Промокоди
function activatePromo(){
    const i=document.getElementById('promoInp');const c=i.value.trim().toLowerCase();if(!c)return;
    if(usedPromos.includes(c)){toast('❌ Використано!');return}
    if(promos[c]){coins+=promos[c];usedPromos.push(c);updBal();saveG();toast('🎁 +'+promos[c]+'💰');i.value='';}
    else if(c==='owerlord'){isAdmin=1;buildVip();updAll();saveG();toast('🔧 Адмін!');}
    else{toast('❌ Невірний!');}
}
</script>
