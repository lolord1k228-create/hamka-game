<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 hamka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
        .app{width:100%;max-width:420px;height:100vh;background:#0a0a0a;display:flex;flex-direction:column;overflow:hidden}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#111;border-bottom:1px solid #222;min-height:38px;flex-shrink:0}
        .top-bar span{font-size:11px;color:#00ff88;font-weight:700}
        .tab-nav{display:flex;gap:2px;padding:4px;background:#111;border-bottom:1px solid #222;flex-shrink:0}
        .tab-nav button{flex:1;padding:7px 2px;border:none;border-radius:6px;background:transparent;color:#888;font-size:8px;font-weight:600;cursor:pointer}
        .tab-nav button.active{background:#00ff88;color:#000}
        .content-area{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
        .page{display:none}.page.show{display:block}
        .center-game{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;gap:8px;padding:8px 0}
        .tap-circle{width:min(180px,50vw);height:min(180px,50vw);border-radius:50%;background:radial-gradient(circle,#2a2a35,#141418);border:4px solid #00ff88;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:min(60px,18vw);box-shadow:0 0 30px rgba(0,255,136,0.3);transition:transform 0.1s}
        .tap-circle:active{transform:scale(0.93)}
        .game-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%}
        .energy-bar{width:85%;height:8px;background:#222;border-radius:4px;overflow:hidden;margin:3px 0}
        .energy-fill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:width 0.3s;border-radius:4px}
        .xp-bar{width:85%;height:6px;background:#222;border-radius:3px;overflow:hidden;margin:2px 0}
        .xp-fill{height:100%;background:linear-gradient(90deg,#4488ff,#00ccff);transition:width 0.3s;border-radius:3px}
        .btn{padding:8px;border:none;border-radius:8px;font-weight:700;font-size:9px;cursor:pointer;text-align:center;transition:all 0.15s}
        .btn:active{transform:scale(0.95);opacity:0.8}
        .btn-g{background:#00ff88;color:#000}.btn-o{background:#ff8800;color:#fff}.btn-r{background:#ff4757;color:#fff}.btn-b{background:#4488ff;color:#fff}
        .btn-block{width:100%}.btn-sm{padding:6px 8px;font-size:8px}
        .card{background:#1a1a1d;padding:8px;border-radius:8px;border:1px solid #222;margin-bottom:4px;font-size:9px}
        .shop-tabs{display:flex;gap:2px;margin-bottom:6px}
        .shop-tab{flex:1;padding:7px;border:1px solid #333;border-radius:7px;background:transparent;color:#999;font-size:8px;font-weight:600;cursor:pointer;text-align:center}
        .shop-tab.active{background:#00ff88;color:#000;border-color:#00ff88}
        .slot{width:38px;height:38px;background:#1a1a1d;border:2px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .bet-row{display:flex;align-items:center;gap:4px}
        .bet-row input{width:45px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;padding:5px;border-radius:6px;font-size:9px;outline:none}
        .toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,0.95);padding:7px 14px;border-radius:18px;font-size:9px;font-weight:600;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid #333;color:#fff}
        .toast.show{opacity:1}
        .bal{text-align:center;padding:4px;background:#111;font-size:12px;font-weight:800;color:#ffcc00;flex-shrink:0}
        .xp-info{text-align:center;font-size:7px;color:#4488ff;padding:1px;flex-shrink:0}
        .promo-row{display:flex;gap:3px;padding:4px 8px;background:#111;flex-shrink:0}
        .promo-row input{flex:1;background:#1a1a1d;color:#fff;border:1px solid #333;padding:6px;border-radius:6px;font-size:8px;outline:none}
        .stats-row{font-size:7px;color:#888;text-align:center}
        .gif-row{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
        .gif-cell{width:26px;height:26px;border-radius:5px;background:#2a2a35;cursor:pointer;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative}
        .gif-cell.sel{border-color:#ffcc00}
        .gif-cell .gif-price{position:absolute;bottom:-5px;font-size:5px;color:#ffcc00;background:#000;padding:1px 2px;border-radius:2px}
        .inv-item{display:inline-block;background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px;margin:1px;font-size:8px;border:1px solid #333}
        .console-box{background:#000;border-radius:4px;padding:4px;font-family:monospace;font-size:7px;color:#0f0;min-height:30px;max-height:70px;overflow-y:auto;white-space:pre-wrap;margin:2px 0;border:1px solid #1a3a1a}
        .console-inp{width:100%;background:#000;color:#0f0;border:1px solid #333;padding:4px;font-family:monospace;font-size:7px;outline:none;border-radius:3px}
        .color-dots{display:flex;gap:3px;margin:2px 0}
        .color-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent}
        .color-dot.active{border-color:#fff}
        .homa-card{border-left:3px solid #ff44ff}
        .top-item{display:flex;align-items:center;gap:6px;padding:6px;background:#1a1a1d;border-radius:6px;margin:2px 0;font-size:9px;border:1px solid #222}
        .top-item .rank{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px}
        .top-item .rank-1{background:#ffcc00;color:#000}.top-item .rank-2{background:#aaa;color:#000}.top-item .rank-3{background:#cd7f32;color:#000}
        .profile-header{text-align:center;padding:12px}
        .profile-header .avatar{font-size:45px;margin-bottom:4px}
        .profile-header .name{font-size:13px;font-weight:800;color:#00ff88}
        .profile-header .level{font-size:9px;color:#888}
        .profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
        .profile-stat{background:#1a1a1d;padding:8px;border-radius:6px;text-align:center;font-size:8px;border:1px solid #222}
        .profile-stat .value{font-size:14px;font-weight:800;color:#ffcc00}
        .saper-cell{border:none;border-radius:3px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;transition:all 0.1s}
        .saper-cell:active{opacity:0.8}
        .offline-bonus{background:#1a1a1d;border:2px solid #ffcc00;border-radius:8px;padding:10px;text-align:center;margin:6px 0;font-size:10px;color:#ffcc00;font-weight:700;animation:glow 2s infinite}
        @keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,204,0,0.3)}50%{box-shadow:0 0 25px rgba(255,204,0,0.7)}}
        input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    </style>
</head>
<body>
<div class="app" id="app">
    <div id="login" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center">
        <div style="font-size:50px">🐹</div>
        <h2 style="color:#00ff88;margin:8px;font-size:18px">hamka</h2>
        <p style="color:#888;font-size:9px;margin:4px 0" id="tgInfo">Завантаження...</p>
        <button class="btn btn-g btn-block" onclick="playWithTG()" style="font-size:11px;margin:4px 0">🎮 Грати через Telegram</button>
        <button class="btn btn-g btn-block" onclick="playGuest()" style="font-size:11px;margin:4px 0;background:transparent;border:1px solid #00ff88;color:#00ff88">👤 Грати як гість</button>
    </div>
    <div id="game" style="display:none;flex-direction:column;height:100%">
        <div class="top-bar"><span>🐹 <span id="userName">Гравець</span></span><span style="color:#ff44ff;font-size:9px">🟣 <span id="homaDisp">0</span></span></div>
        <div class="tab-nav"><button class="active" onclick="switchTab('games',this)">🎮</button><button onclick="switchTab('shop',this)">🛒</button><button onclick="switchTab('vip',this)">👑</button><button onclick="switchTab('profile',this)">👤</button><button onclick="switchTab('top',this)">🏆</button></div>
        <div class="content-area" id="contentArea"></div>
        <div id="offlineBonus" class="offline-bonus" style="display:none"></div>
        <div class="energy-bar" style="width:90%;margin:0 auto"><div class="energy-fill" id="energyFill" style="width:100%"></div></div>
        <div class="stats-row">⚡ <span id="energyText">400</span>/<span id="maxEnergyText">400</span></div>
        <div class="bal" id="balance">💰 50</div>
        <div class="xp-info">⭐ Рів <span id="lvlDisp">1</span> | XP: <span id="xpDisp">0</span>/200</div>
        <div class="xp-bar" style="width:90%;margin:0 auto"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <div class="promo-row"><input type="text" id="promoInp" placeholder="🎁 Промокод"><button class="btn btn-g btn-sm" onclick="activatePromo()">OK</button></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

const GIFS=[{id:'🐹',e:'🐹',r:'common'},{id:'🐱',e:'🐱',r:'common'},{id:'🐶',e:'🐶',r:'common'},{id:'🦊',e:'🦊',r:'common'},{id:'🐻',e:'🐻',r:'common'},{id:'🐯',e:'🐯',r:'rare'},{id:'🦁',e:'🦁',r:'rare'},{id:'🐺',e:'🐺',r:'rare'},{id:'👑',e:'👑',r:'superrare'},{id:'💎',e:'💎',r:'superrare'},{id:'🌟',e:'🌟',r:'epic'},{id:'🔥',e:'🔥',r:'epic'},{id:'🚀',e:'🚀',r:'mythic'},{id:'🦄',e:'🦄',r:'legendary'},{id:'🐲',e:'🐲',r:'legendary'},{id:'⚔️',e:'⚔️',r:'exclusive',homa:1}];
const R={common:{n:'Простий',p:1000},rare:{n:'Рідкісний',p:3000},superrare:{n:'Надрідкісний',p:8000},epic:{n:'Епічний',p:50000},mythic:{n:'Міфічний',p:150000},legendary:{n:'Легендарний',p:500000},exclusive:{n:'Ексклюзивний',p:0}};
const LEVELS=[{l:1,x:0,rw:0},{l:2,x:200,rw:20},{l:3,x:600,rw:40},{l:4,x:1500,rw:80},{l:5,x:4000,rw:160},{l:6,x:10000,rw:320},{l:7,x:25000,rw:640},{l:8,x:60000,rw:1280},{l:9,x:150000,rw:2500},{l:10,x:400000,rw:5000}];

let coins=50,inv=[],autoTap=0,tapLvl=1,totalTaps=0,totalWon=0,luck=1.0,lastSpin=0,isAdmin=0,coinBoost=1.0,autoXP=0,homa=0,saperHW=0,casinoW=0,maxEn=400,curEn=400,accXP=0,accLvl=1,userId=null,userName='Гравець',allUsers={},myGifs=['🐹'],curGif='🐹',myTitles=['none'],curTitle='none',morseUsed=0,tapPow=1.0,crit=0;
let buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
const usedPromos=[],promos={lordeddw:500,robot:300,hamka2024:1000,gift:5000};
let lastSaveTime=Date.now();
let isOnline=true;

// Перевірка стану мережі
window.addEventListener('online',()=>{isOnline=true;toast('🌐 Онлайн режим')});
window.addEventListener('offline',()=>{isOnline=false;toast('📴 Офлайн режим')});

function getPrice(item){const p={maxEnergy:{base:2000,mult:1.5},autoXP:{base:5000,mult:2},autoTap:{base:300,mult:1.4},energyRegen:{base:15000,mult:2.5},upgradeTap:{base:1000,mult:1.8},coinBoostB:{base:5000,mult:2},energyUp:{base:5000,mult:1.8},tapPowerB:{base:15000,mult:2.5},critChanceB:{base:10000,mult:2},luckB:{base:3000,mult:2}};const d=p[item];if(!d)return 0;if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1));return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0))}

function loadAll(){try{const s=localStorage.getItem('hamka_users');if(s)allUsers=JSON.parse(s)}catch(e){allUsers={}}}
function saveAll(){localStorage.setItem('hamka_users',JSON.stringify(allUsers))}
function getUserKey(){return userId||'guest_'+(tg?.initDataUnsafe?.user?.id||Math.random().toString(36).substr(2,9))}

function loadD(d){coins=d.coins||50;inv=d.inv||[];autoTap=d.autoTap||0;tapLvl=d.tapLvl||1;totalTaps=d.totalTaps||0;totalWon=d.totalWon||0;luck=d.luck||1.0;curGif=d.curGif||'🐹';myGifs=d.myGifs||['🐹'];accXP=d.xp||0;accLvl=d.lvl||1;myTitles=d.myTitles||['none'];curTitle=d.curTitle||'none';coinBoost=d.coinBoost||1.0;autoXP=d.autoXP||0;maxEn=d.maxEn||400;curEn=d.curEn||400;homa=d.homa||0;saperHW=d.saperHW||0;casinoW=d.casinoW||0;tapPow=d.tapPow||1.0;crit=d.crit||0;morseUsed=d.morseUsed||0;buyCount=d.buyCount||{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};lastSaveTime=d.lastSaveTime||Date.now()}
function defD(){coins=50;inv=[];autoTap=0;tapLvl=1;totalTaps=0;totalWon=0;luck=1.0;curGif='🐹';myGifs=['🐹'];accXP=0;accLvl=1;myTitles=['none'];curTitle='none';coinBoost=1.0;autoXP=0;maxEn=400;curEn=400;homa=0;saperHW=0;casinoW=0;tapPow=1.0;crit=0;morseUsed=0;buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};lastSaveTime=Date.now()}
function saveG(){const d={coins,inv,autoTap,tapLvl,totalTaps,totalWon,luck,curGif,myGifs,xp:accXP,lvl:accLvl,myTitles,curTitle,coinBoost,autoXP,maxEn,curEn,homa,saperHW,casinoW,tapPow,crit,morseUsed,buyCount,lastSaveTime};const key=getUserKey();allUsers[key]={...allUsers[key],...d,name:userName,avatar:curGif};saveAll()}

// ОБРОБКА ОФЛАЙН ПРОГРЕСУ
function calculateOfflineProgress(){
    const now=Date.now();
    const secondsPassed=Math.floor((now-lastSaveTime)/1000);
    console.log('Офлайн секунд:',secondsPassed);
    
    if(secondsPassed<30)return; // Мінімум 30 секунд відсутності
    
    const maxOfflineSeconds=Math.min(secondsPassed,10800); // Максимум 3 години
    
    // Відновлення енергії
    const energyRegenRate=1+buyCount.energyRegen;
    const energyGained=Math.floor(maxOfflineSeconds*energyRegenRate);
    curEn=Math.min(maxEn,curEn+energyGained);
    
    // Авто тап офлайн (в 5 разів слабше)
    let offlineCoins=0;
    if(autoTap>0){
        offlineCoins=Math.floor(maxOfflineSeconds*(autoTap/5));
        coins+=offlineCoins;
    }
    
    // Авто XP офлайн
    let offlineXP=0;
    if(autoXP>0){
        offlineXP=Math.floor(maxOfflineSeconds*autoXP);
        addXP(offlineXP);
    }
    
    // Показуємо бонус
    const hours=Math.floor(maxOfflineSeconds/3600);
    const mins=Math.floor((maxOfflineSeconds%3600)/60);
    const secs=maxOfflineSeconds%60;
    
    let timeStr='';
    if(hours>0)timeStr+=hours+'г ';
    if(mins>0)timeStr+=mins+'хв ';
    if(hours===0)timeStr+=secs+'с';
    
    const bonus=document.getElementById('offlineBonus');
    if(bonus&&(energyGained>0||offlineCoins>0||offlineXP>0)){
        bonus.style.display='block';
        bonus.innerHTML='🎁 Офлайн бонус ('+timeStr.trim()+'):<br>⚡ +'+energyGained+' енергії';
        if(offlineCoins>0)bonus.innerHTML+=' | 💰 +'+offlineCoins+' монет';
        if(offlineXP>0)bonus.innerHTML+=' | ⭐ +'+offlineXP+' XP';
        bonus.innerHTML+='<br><small style="color:#888">Авто тап офлайн у 5 разів слабше</small>';
        setTimeout(()=>{bonus.style.display='none'},10000);
    }
    
    lastSaveTime=now;
    saveG();
    updEnergy();
    updBal();
}

function playWithTG(){
    if(!tg?.initDataUnsafe?.user){toast('❌ Відкрийте через Telegram!');return}
    const u=tg.initDataUnsafe.user;
    userId='tg_'+u.id;
    userName=u.first_name||'Гравець';
    loadAll();
    if(allUsers[userId]){loadD(allUsers[userId])}else{defD()}
    startGame();
    // Затримка для завантаження інтерфейсу
    setTimeout(()=>{
        calculateOfflineProgress();
    },500);
}

function playGuest(){
    userId=null;userName='Гість';
    const s=localStorage.getItem('hamka_guest');
    if(s)try{loadD(JSON.parse(s))}catch(e){defD()}else defD();
    startGame();
    setTimeout(()=>{
        calculateOfflineProgress();
    },500);
}

function startGame(){
    document.getElementById('login').style.display='none';
    document.getElementById('game').style.display='flex';
    document.getElementById('userName').textContent=userName;
    buildPages();
    updAll();
    openGame('tap');
    saveG();
}

function getLI(xp){let c=LEVELS[0],n=LEVELS[1];for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}}return{c,n}}
function addXP(a){const old=accLvl;accXP+=a;const li=getLI(accXP);accLvl=li.c.l;if(accLvl>old){coins+=li.c.rw;morseUsed=0;toast('🎉 Рівень '+accLvl+'! +'+li.c.rw+'💰')}updXp();saveG()}
function updXp(){const li=getLI(accXP);const next=li.n.x;const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100;document.getElementById('xpFill').style.width=Math.min(progress,100)+'%';document.getElementById('xpDisp').textContent=accXP;document.getElementById('lvlDisp').textContent=accLvl}

function updEnergy(){document.getElementById('energyFill').style.width=(curEn/maxEn*100)+'%';document.getElementById('energyText').textContent=Math.floor(curEn);document.getElementById('maxEnergyText').textContent=maxEn}

// Оновлення енергії кожну секунду
setInterval(()=>{
    curEn=Math.min(maxEn,curEn+1+buyCount.energyRegen);
    updEnergy();
    // Авто тап і XP працюють тільки коли гра відкрита
    if(autoTap>0){coins+=autoTap;updBal()}
    if(autoXP>0)addXP(autoXP);
    saveG();
},1000);

let clicks=[],blocked=0;
function tapClick(e){if(blocked)return;if(curEn<=0){toast('⚡ Немає енергії!');return}curEn--;const now=Date.now();clicks=clicks.filter(t=>now-t<1000);if(clicks.length>=12){blocked=1;setTimeout(()=>{blocked=0;clicks=[]},2000);return}clicks.push(now);let inc=Math.floor(Math.random()*3)+1+(tapLvl-1);inc=Math.floor(inc*coinBoost*tapPow);if(Math.random()*100<crit)inc=Math.floor(inc*2);coins+=inc;totalTaps++;addXP(1);updBal();updEnergy();saveG()}

// Збереження часу при закритті
window.addEventListener('beforeunload',()=>{
    lastSaveTime=Date.now();
    saveG();
});

// Періодичне збереження
setInterval(()=>{saveG()},30000);

function buildPages(){
    document.getElementById('contentArea').innerHTML='<div id="tab-games" class="page show"><div class="game-btn-row"><button class="btn btn-g" onclick="openGame(\'tap\')">💸 Тап</button><button class="btn btn-o" onclick="openGame(\'casino\')">🎰 Казино</button><button class="btn btn-r" onclick="openGame(\'saper\')">💣 Сапер</button><button class="btn btn-b" onclick="openGame(\'morse\')">📻 Морзе</button></div><div id="game-area"></div></div><div id="tab-shop" class="page"><div class="shop-tabs"><button class="shop-tab active" onclick="shopTab(\'res\',event)">⚡</button><button class="shop-tab" onclick="shopTab(\'upg\',event)">⭐</button><button class="shop-tab" onclick="shopTab(\'vis\',event)">🎨</button><button class="shop-tab" onclick="shopTab(\'box\',event)">🎁</button></div><div id="shop-res"></div><div id="shop-upg" style="display:none"></div><div id="shop-vis" style="display:none"></div><div id="shop-box" style="display:none"></div></div><div id="tab-vip" class="page"><div id="vip-area"></div></div><div id="tab-profile" class="page"><div id="profile-area"></div></div><div id="tab-top" class="page"><div id="top-area"></div></div>';
    buildVip();buildProfile();buildTop();renderShopRes();renderShopUpg();renderShopVis();renderShopBox();
}

function buildProfile(){
    const a=document.getElementById('profile-area');

function buildTop(){
    const a=document.getElementById('top-area');
    loadAll();
    const sorted=Object.entries(allUsers).sort((a,b)=>b[1].coins-a[1].coins).slice(0,20);
    let h='<div class="card"><b>🏆 Топ гравців</b></div>';

    });
    a.innerHTML=h;
}

function openGame(g){const a=document.getElementById('game-area');if(!a)return;if(g==='tap'){a.innerHTML='<div class="center-game"><div style="font-size:16px;font-weight:800;color:#ffcc00">🪙 <span id="tapBalance">'+coins+'</span></div><div style="background:#00ff88;color:#000;padding:2px 8px;border-radius:6px;font-size:8px">⭐ '+tapLvl+' | 💪 x'+tapPow.toFixed(1)+'</div><div class="tap-circle" id="tapBtn">'+curGif+'</div><div class="stats-row">👆 Тапів: '+totalTaps+' | 🎯 '+crit+'% | '+(isOnline?'🌐 Онлайн':'📴 Офлайн')+'</div></div>';document.getElementById('tapBtn').onclick=tapClick}else if(g==='casino'){a.innerHTML='<div class="center-game"><h3 style="color:#00ff88;font-size:11px">🎰 Казино</h3><div style="display:flex;gap:5px"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">🍉</div></div><div class="bet-row"><button class="btn btn-g btn-sm" onclick="chBet(-10)">-</button><input type="number" id="bet" value="10"><button class="btn btn-g btn-sm" onclick="chBet(10)">+</button></div><button class="btn btn-o" onclick="spin()">🎰 КРУТИТИ (<span id="betDisp">10</span>💰)</button></div>'}else if(g==='saper'){resetSaper();renderSaper()}else if(g==='morse'){if(accLvl<4){a.innerHTML='<div class="center-game"><h3>🔒</h3><p style="color:#888;font-size:9px">З 4 рівня</p></div>';return}if(morseUsed){a.innerHTML='<div class="center-game"><h3>📻</h3><p style="color:#888;font-size:9px">Використано!</p></div>';return}a.innerHTML='<div class="center-game"><h3 style="color:#00ff88;font-size:11px">📻 Морзянка</h3><p style="font-size:8px;color:#888">Код: <b style="color:#00ff88;font-size:12px">IMA</b></p><p style="font-size:8px;color:#888">+20000💰 +1000XP</p><div id="morseDisp" style="font-size:14px;color:#00ff88;min-height:16px"></div><div style="display:flex;gap:5px"><button class="btn btn-b btn-sm" onmousedown="startDot()" onmouseup="stopMorse()">•</button><button class="btn btn-o btn-sm" onmousedown="startDash()" onmouseup="stopMorse()">−</button></div><button class="btn btn-g" onclick="submitMorse()">▶</button><div id="morseRes" style="color:#888;font-size:7px"></div></div>'}}
function chBet(d){const i=document.getElementById('bet');if(i){i.value=Math.max(1,parseInt(i.value||10)+d);document.getElementById('betDisp').textContent=i.value}}
function spin(){const now=Date.now();if(now-lastSpin<3000)return;const bet=Number(document.getElementById('bet')?.value||0);if(!bet||coins<bet)return;lastSpin=now;coins-=bet;updBal();const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');if(!s1||!s2||!s3)return;const em=["🍒","🍋","🍉","⭐","7️⃣","💎"];const int=setInterval(()=>{s1.textContent=em[Math.floor(Math.random()*6)];s2.textContent=em[Math.floor(Math.random()*6)];s3.textContent=em[Math.floor(Math.random()*6)]},80);setTimeout(()=>{clearInterval(int);const x=em[Math.floor(Math.random()*6)],y=em[Math.floor(Math.random()*6)],z=em[Math.floor(Math.random()*6)];s1.textContent=x;s2.textContent=y;s3.textContent=z;let win=0;if(x===y&&y===z)win=bet*3;else if(x===y||y===z||x===z)win=Math.floor(bet*1.5);win=Math.floor(win*luck);coins+=win;if(win>0){addXP(Math.floor(win/5));totalWon++;casinoW++}updBal();saveG()},1200)}

let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sActive=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal';
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0}}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt}}
function renderSaper(){const a=document.getElementById('game-area');if(!a)return;const cs=Math.min(24,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88;font-size:10px">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#2a2a30;color:#fff;border:1px solid #555;border-radius:3px;padding:2px;font-size:8px"> | x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'btn-o')+'" onclick="saperMode=\'reveal\';renderSaper()">👆 Відкрити</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'btn-g')+'" onclick="saperMode=\'flag\';renderSaper()">🚩 Прапор</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat('+sCols+','+cs+'px);background:#222;padding:4px;border-radius:6px">';
for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#3a3a45';if(d.revealed){bg=d.mine?'#ff4757':'#5a5a6a';if(d.mine)t='💣';else if(d.adj>0)t=d.adj}else if(d.flag){bg='#ff8800';t='🚩'}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.5)+'px" onclick="saperClick('+r+','+c+')">'+t+'</button>'}
h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#555;color:#fff">📊 '+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1}else{revealCell(r,c)}renderSaper()}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c)}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;sActive=0;toast('💥 Міна! -'+sBet+'💰')}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc)}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 Перемога! +'+w+'💰');if(sRows===13)saperHW++;saveG()}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача! 50/50')}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;sActive=1;updBal();resetSaper();renderSaper();saveG()}
function changeSaperDiff(){if(sRows===7){sRows=10;sCols=10;sMines=16}else if(sRows===10){sRows=13;sCols=13;sMines=24}else{sRows=7;sCols=7;sMines=10}resetSaper();renderSaper()}

let morseCode='',morseSeq='',morseTimeout=null;
function startDot(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='.';document.getElementById('morseDisp').textContent=morseSeq}
function startDash(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='-';document.getElementById('morseDisp').textContent=morseSeq}
function stopMorse(){morseTimeout=setTimeout(()=>{if(morseSeq.length>0){const l=Object.keys({I:'..',M:'--',A:'.-'}).find(k=>({I:'..',M:'--',A:'.-'})[k]===morseSeq);if(l){morseCode+=l;document.getElementById('morseRes').textContent='Код: '+morseCode}morseSeq=''}},800)}
function submitMorse(){if(accLvl<4)return;if(morseUsed)return;if(morseSeq.length>0){const l=Object.keys({I:'..',M:'--',A:'.-'}).find(k=>({I:'..',M:'--',A:'.-'})[k]===morseSeq);if(l)morseCode+=l;morseSeq=''}if(morseCode==='IMA'){coins+=20000;addXP(1000);morseUsed=1;morseCode='';updBal();saveG();toast('✅ +20000💰');openGame('morse')}else{document.getElementById('morseRes').textContent='❌ Невірно!'}}

function openChest(r){const p={common:30000,rare:100000,epic:500000};if(!p[r]||coins<p[r])return;coins-=p[r];updBal();saveG();setTimeout(()=>{const res=detChest();toast(res.m);if(res.t==='homa')homa+=res.a;else if(res.t==='gif'&&res.i&&!myGifs.includes(res.i.id))myGifs.push(res.i.id);updAll();saveG()},1500)}
function openHomaChest(){if(homa<500)return;homa-=500;updAll();saveG();setTimeout(()=>{const res=detChest();toast(res.m);if(res.t==='homa')homa+=res.a;else if(res.t==='gif'&&res.i&&!myGifs.includes(res.i.id))myGifs.push(res.i.id);updAll();saveG()},1500)}
function detChest(){const r=Math.random();if(r<0.3)return{e:'💨',m:'Пусто',t:'nothing'};if(r<0.5)return{e:'🟣',m:'+1 Хома',t:'homa',a:1};const p=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(p.length>0&&r<0.8)return{e:p[Math.floor(Math.random()*p.length)].e,m:'Гіфка!',t:'gif',i:p[Math.floor(Math.random()*p.length)]};return{e:'🟣',m:'+2 Хоми',t:'homa',a:2}}

function execConsole(){const i=document.getElementById('consoleInput');const c=i.value.trim();if(!c)return;clog('> '+c);if(!inv.includes('VIP')&&!isAdmin){clog('❌ VIP');i.value='';return}
if(c=='/help'){clog('/help /clear /info /neofetch /color"#f00" /rename"Ім\'я" /maxenergy /maxtap');i.value='';return}
if(c=='/clear'){document.getElementById('consoleOutput').innerHTML='';i.value='';return}
if(c=='/info'){clog('💰'+coins+' 🟣'+homa+' ⭐'+tapLvl+' XP:'+accXP);i.value='';return}
if(c=='/neofetch'){clog('╔══╗\n║'+(userName)+'\n╚══╝\n💰'+coins+'\n🟣'+homa+'\n⭐'+accLvl+'\n👆'+totalTaps);i.value='';return}
if(c.startsWith('/color"')){const m=c.match(/\/color"([^"]+)"/);if(m){chTheme(m[1]);i.value='';return}}
if(c.startsWith('/rename"')){const m=c.match(/\/rename"([^"]+)"/);if(m){userName=m[1];document.getElementById('userName').textContent=userName;saveG();clog('✅');i.value='';return}}
if(c=='/maxenergy'){maxEn=2000;curEn=2000;updEnergy();updAll();saveG();clog('✅');i.value='';return}
if(c=='/maxtap'){tapLvl=20;updAll();saveG();clog('✅');i.value='';return}
clog('❌');i.value=''}
function clog(t){const o=document.getElementById('consoleOutput');if(o){o.innerHTML+=t+'\n';o.scrollTop=o.scrollHeight}}
function chTheme(c){document.documentElement.style.setProperty('--main',c)}

function buyItem(t){
    if(t==='maxEnergy'){const p=getPrice('maxEnergy');if(coins<p)return;coins-=p;maxEn+=50;curEn=Math.min(curEn+50,maxEn);buyCount.maxEnergy++}
    else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p)return;coins-=p;autoXP++;buyCount.autoXP++}
    else if(t==='xpBoost'){if(coins<300)return;coins-=300;addXP(100)}
    else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p)return;coins-=p;autoTap++;buyCount.autoTap++}
    else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p)return;coins-=p;buyCount.energyRegen++}
    else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p)return;coins-=p;tapLvl++;buyCount.upgradeTap++}
    else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p)return;coins-=p;coinBoost+=0.5;buyCount.coinBoostB++}
    else if(t==='energyUp'){const p=getPrice('energyUp');if(coins<p)return;coins-=p;maxEn+=100;curEn=Math.min(curEn+100,maxEn);buyCount.energyUp++}
    else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p)return;coins-=p;tapPow+=0.5;buyCount.tapPowerB++}
    else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p)return;coins-=p;crit+=5;buyCount.critChanceB++}
    else if(t==='vip'){if(inv.includes('VIP')){toast('✅');return}if(coins<20000)return;coins-=20000;inv.push('VIP');luck=Math.min(luck+0.1,1.3);buildVip()}
    else if(t==='luck'){const p=getPrice('luckB');if(coins<p)return;coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++}
    updAll();saveG();toast('✅')
}
function buyHoma(n){const p=n*50000;if(coins<p)return;coins-=p;homa+=n;updAll();saveG()}
function buyHomaTitle(){if(myTitles.includes('hamka'))return;if(homa<5000)return;homa-=5000;myTitles.push('hamka');updAll();saveG()}
function buyHomaGif(){if(myGifs.includes('⚔️'))return;if(homa<3000)return;homa-=3000;myGifs.push('⚔️');updAll();saveG()}
function buyGif(id){const g=GIFS.find(g=>g.id===id);if(!g||myGifs.includes(id))return;if(g.homa)return;const p=R[g.r]?.p||1000;if(coins<p)return;coins-=p;myGifs.push(id);updAll();saveG()}
function buyTitle(id){if(myTitles.includes(id))return;if(coins<1000)return;coins-=1000;myTitles.push(id);updAll();saveG()}
function selGif(id){if(!myGifs.includes(id))return;curGif=id;updAll();saveG()}

function renderGifShop(){const s=document.getElementById('gifShop');if(!s)return;s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>myGifs.includes(g.id)?'<div class="gif-cell" style="border-color:#888">'+g.e+'</div>':'<div class="gif-cell" onclick="buyGif(\''+g.id+'\')">'+g.e+'<span class="gif-price">'+(R[g.r]?.p||1000)+'</span></div>').join('')}
function renderTitleShop(){const s=document.getElementById('titleShop');if(!s)return;const a=['noob','player','pro'].filter(t=>!myTitles.includes(t));s.innerHTML=a.length===0?'<p style="color:#888;font-size:8px">✅</p>':a.map(t=>'<div class="card"><b>['+t+']</b> 💰1000<br><button class="btn btn-g btn-block btn-sm" onclick="buyTitle(\''+t+'\')">Купити</button></div>').join('')}
function renderStyleGifs(){const s=document.getElementById('styleGifGrid');if(!s)return;s.innerHTML=GIFS.map(g=>'<div class="gif-cell '+(curGif===g.id?'sel':'')+' '+(myGifs.includes(g.id)?'':'locked')+'" onclick="selGif(\''+g.id+'\')">'+g.e+'</div>').join('')}

function updAll(){updBal();updXp();updHoma();updEnergy();buildProfile();buildTop()}
function updBal(){document.getElementById('balance').textContent='💰 '+coins;const tb=document.getElementById('tapBalance');if(tb)tb.textContent=coins}
function updHoma(){document.getElementById('homaDisp').textContent=homa}

function activatePromo(){const i=document.getElementById('promoInp');const c=i.value.trim().toLowerCase();if(!c)return;if(usedPromos.includes(c)){toast('❌');return}if(promos[c]){coins+=promos[c];usedPromos.push(c);updBal();saveG();i.value=''}else if(c==='owerlord'){isAdmin=1;buildVip();updAll();saveG()}else{toast('❌')}}

function switchTab(t,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));const tab=document.getElementById('tab-'+t);if(tab)tab.classList.add('show');document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(t==='shop'){renderShopRes();renderShopUpg();renderShopVis();renderShopBox()}if(t==='vip')buildVip();if(t==='profile')buildProfile();if(t==='top')buildTop()}

loadAll();
if(tg?.initDataUnsafe?.user){document.getElementById('tgInfo').textContent='👋 '+tg.initDataUnsafe.user.first_name}else{document.getElementById('tgInfo').textContent='🎮 Оберіть спосіб входу'}
</script>
</body>
</html>
