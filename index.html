function generateMegaQuest(level) {
    const t = MEGA_QUEST_TYPES[Math.floor(Math.random() * MEGA_QUEST_TYPES.length)];
    const target = Math.floor(t.baseTarget * (1 + (level-1) * 0.5));
    return {
        type: t.type,
        desc: t.desc.replace('{0}', target),
        target: target,
        rewardEventHoma: 2 + level,
        rewardCoins: 500 * level,
        rewardHoma: 10 * level,
    };
}

function tapClick(e){ 
    if(blocked)return; if(curEn<=0){toast('⚡ Немає енергії!');return} curEn--;
    const now=Date.now();clicks=clicks.filter(t=>now-t<1000);
    if(clicks.length>=12){blocked=1;setTimeout(()=>{blocked=0;clicks=[]},2000);return}
    clicks.push(now);
    let inc=Math.floor(Math.random()*3)+1+(tapLvl-1); inc=Math.floor(inc*coinBoost*tapPow);
    if(Math.random()*100<crit)inc=Math.floor(inc*2);
    coins+=inc;totalTaps++;addXP(1);updBal();updEnergy();
    tapsToday++; coinsEarnedToday += inc;
    updateAllProgress();
    console.log('Тап! tapsToday:', tapsToday, 'coinsEarnedToday:', coinsEarnedToday);
}

function spin(){ 
    const now=Date.now();if(now-lastSpin<3000)return;
    const bet=Number(document.getElementById('bet')?.value||0);
    if(!bet||coins<bet)return;
    lastSpin=now;coins-=bet;updBal();
    const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');
    const em=["🍒","🍋","🍉","⭐","7️⃣","💎"];
    const int=setInterval(()=>{s1.textContent=em[Math.floor(Math.random()*6)];s2.textContent=em[Math.floor(Math.random()*6)];s3.textContent=em[Math.floor(Math.random()*6)];},80);
    setTimeout(()=>{
        clearInterval(int);
        const x=em[Math.floor(Math.random()*6)],y=em[Math.floor(Math.random()*6)],z=em[Math.floor(Math.random()*6)];
        s1.textContent=x;s2.textContent=y;s3.textContent=z;
        let win=0;
        if(x===y&&y===z)win=bet*3;
        else if(x===y||y===z||x===z)win=Math.floor(bet*1.5);
        win=Math.floor(win*luck);
        coins+=win;
        if(win>0){addXP(Math.floor(win/5));totalWon++; casinoWinsToday++;}
        casinoPlaysToday++;
        updateAllProgress();
        console.log('Казино! casinoPlaysToday:', casinoPlaysToday, 'casinoWinsToday:', casinoWinsToday);
        updBal();saveG();
    },1200);
}

function fightBoss(cost) {
    if (homa < cost) { toast('❌ Недостатньо 🟣'); return; }
    homa -= cost; updHoma(); saveG();
    toast('⚔️ Битва з босом...');
    setTimeout(() => {
        let chance = 0.3 + accLvl * 0.03 + luck * 0.05;
        if (cost >= 5000) chance += 0.05;
        if (cost >= 15000) chance += 0.1;
        if (Math.random() < Math.min(chance, 0.85)) {
            const rewards = ['gif', 'homa', 'title', 'chest'];
            const reward = rewards[Math.floor(Math.random() * rewards.length)];
            if (reward === 'gif') {
                const available = GIFS.filter(g => !myGifs.includes(g.id) && !g.homa);
                if (available.length > 0) { const gif = available[Math.floor(Math.random() * available.length)]; myGifs.push(gif.id); toast('🎨 Отримано гіфку: ' + gif.e); newGifsToday++; }
                else { homa += 50; homaEarnedToday += 50; toast('🟣 +50 Хом (всі гіфки зібрані)'); }
            } else if (reward === 'homa') { const amount = Math.floor(Math.random() * 200) + 100 + cost; homa += amount; homaEarnedToday += amount; toast('🟣 +' + amount + ' Хом'); }
            else if (reward === 'title') {
                const specialTitles = ['king', 'lord', 'knight', 'hamka', 'pro', 'player', 'noob'];
                const newTitle = specialTitles[Math.floor(Math.random() * specialTitles.length)];
                if (!myTitles.includes(newTitle)) { myTitles.push(newTitle); toast('🏅 Отримано титул: ' + newTitle); newTitlesToday++; }
                else { homa += 100; homaEarnedToday += 100; toast('🟣 +100 Хом (титул вже є)'); }
            } else if (reward === 'chest') {
                const chestTypes = ['common', 'rare', 'epic', 'legendary', 'mythic'];
                const ct = chestTypes[Math.floor(Math.random() * chestTypes.length)];
                chests[ct] = (chests[ct] || 0) + 1;
                toast('🎁 Отримано ящик: ' + ct);
            }
        } else { toast('❌ Поразка... Спробуйте ще!'); }
        bossKillsToday++;
        updateAllProgress();
        console.log('Бос! bossKillsToday:', bossKillsToday);
        updAll(); saveG();
    }, 2000);
}
