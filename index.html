function getBaseFine(level) {
    const fines = [
        {l:1,type:'coins',amt:500},{l:2,type:'coins',amt:750},{l:3,type:'coins',amt:3000},{l:4,type:'coins',amt:5000},{l:5,type:'coins',amt:10000},
        {l:6,type:'homa',amt:30},{l:7,type:'homa',amt:100},{l:8,type:'homa',amt:150},{l:9,type:'homa',amt:200},{l:10,type:'homa',amt:250},
        {l:11,type:'homa',amt:320},{l:12,type:'homa',amt:390},{l:13,type:'homa',amt:460},{l:14,type:'homa',amt:530},{l:15,type:'homa',amt:600},
        {l:16,type:'homa',amt:650},{l:17,type:'homa',amt:700},{l:18,type:'homa',amt:750},{l:19,type:'homa',amt:800},{l:20,type:'homa',amt:850}
    ];
    let f = fines.find(f => f.l === level);
    if(f) return {type:f.type, amount:f.amt};
    return {type:'homa', amount:1350};
}
function getCurrentFine() {
    let level = Math.min(autoclickViolations, 20);
    let base = getBaseFine(level);
    let extra = banCount * 100;
    return {type:base.type, amount:base.amount + extra};
}
function checkAutoClicker() {
    const now = Date.now();
    tapTimestamps = tapTimestamps.filter(t => now - t < 1000);
    if(tapTimestamps.length > 23) {
        if(now - lastViolationTime > 2000) {
            lastViolationTime = now;
            autoclickViolations++;
            if(autoclickViolations >= 5) {
                if(!autoclickFlagged) {
                    banCount++;
                    autoclickFlagged = true;
                    toast(`⚠️ ВИЯВЛЕНО АВТОКЛІКЕР! Ви забанені. Сплатіть у VIP-розділі.`);
                }
            } else {
                toast(`⚠️ Підозріла швидкість тапів!`);
            }
            saveGame();
            if(document.getElementById('tab-vip')?.classList.contains('show')) renderVipTab();
        }
        tapTimestamps = [];
    }
}
function payFine() {
    if(!autoclickFlagged) { toast("Немає мітки автоклікера"); return; }
    const fine = getCurrentFine();
    let canPay = false;
    if(fine.type === 'coins' && coins >= fine.amount) { coins -= fine.amount; canPay = true; }
    else if(fine.type === 'homa' && homa >= fine.amount) { homa -= fine.amount; canPay = true; }
    else { toast(`❌ Не вистачає ${fine.amount} ${fine.type==='coins'?'💰':'🟣'}`); return; }
    if(canPay) {
        autoclickViolations = 0; autoclickFlagged = false; saveGame();
        toast(`✅ Штраф сплачено! (Банів: ${banCount})`);
        updAll();
        if(document.getElementById('tab-vip')?.classList.contains('show')) renderVipTab();
        if(document.getElementById('tab-top')?.classList.contains('show')) buildTop();
    }
}

function tapClick(e) {

    curEn--;
    let inc = Math.floor(Math.random() * 5) + 1 + (tapLvl - 1);
    inc = Math.floor(inc * coinBoost * tapPow);
    if(Math.random() * 100 < crit) inc *= 2;
    coins += inc;

    if(totalTaps % 100 === 0) { eventHoma += 1; toast(`🌸 +1 івенхом за 100 тапів!`); }

function spin() {
    let bet = Number(document.getElementById('bet')?.value || 0);
    if(!bet || coins < bet) return;
    coins -= bet; updBal();
    let s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), s3 = document.getElementById('s3');
    let em = ["🍒","🍋","🍉","⭐","7️⃣","💎"];
    let x = em[Math.floor(Math.random()*6)], y = em[Math.floor(Math.random()*6)], z = em[Math.floor(Math.random()*6)];
    s1.textContent = x; s2.textContent = y; s3.textContent = z;
    let win = 0;
    if(x === y && y === z) win = bet * 3;
    else if(x === y || y === z || x === z) win = Math.floor(bet * 1.5);
    win = Math.floor(win * luck);
    coins += win;
    if(win > 0) addXP(Math.floor(win / 5));
    updBal(); saveGame();
}

// ========== САПЕР ==========
let saperGrid = [], sRows = 7, sCols = 7, sMines = 10, sFlags = 0, sOver = 0, sRevealed = 0, sBet = 0, sMult = 1.3, sFirst = 1, saperMode = 'reveal', saperGameActive = false;
function resetSaper() {
    saperGrid = []; sFlags = 0; sOver = 0; sRevealed = 0; sFirst = 1;
    sMult = sRows === 7 ? 1.3 : sRows === 10 ? 1.6 : 2.0;
    saperGameActive = false;
    for(let r = 0; r < sRows; r++) {
        saperGrid[r] = [];
        for(let c = 0; c < sCols; c++) saperGrid[r][c] = { mine: 0, revealed: 0, flag: 0, adj: 0 };
    }
}
function placeMines(sr, sc) {
    let p = 0;
    while(p < sMines) {
        let r = Math.floor(Math.random() * sRows), c = Math.floor(Math.random() * sCols);
        if(Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1) continue;
        if(!saperGrid[r][c].mine) { saperGrid[r][c].mine = 1; p++; }
    }
    for(let r = 0; r < sRows; r++) {
        for(let c = 0; c < sCols; c++) {
            if(!saperGrid[r][c].mine) {
                let cnt = 0;
                for(let dr = -1; dr <= 1; dr++)
                    for(let dc = -1; dc <= 1; dc++)
                        if(saperGrid[r+dr] && saperGrid[r+dr][c+dc] && saperGrid[r+dr][c+dc].mine) cnt++;
                saperGrid[r][c].adj = cnt;
            }
        }
    }
}
function renderSaper() {
    let a = document.getElementById('game-area');
    let cs = Math.min(24, Math.floor((window.innerWidth - 40) / sCols));
    let h = '<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#1f2937;color:#fff;border:1px solid #374151;border-radius:3px;padding:2px;font-size:8px"> | x' + sMult.toFixed(1) + ' | 🚩' + sFlags + '/' + sMines + '</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm ' + (saperMode === 'reveal' ? 'btn-g' : 'btn-o') + '" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm ' + (saperMode === 'flag' ? 'btn-o' : 'btn-g') + '" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat(' + sCols + ',' + cs + 'px);background:#1f2937;padding:4px;border-radius:6px">';
    for(let r = 0; r < sRows; r++) {
        for(let c = 0; c < sCols; c++) {
            let d = saperGrid[r][c];
            let t = '', bg = '#374151';
            if(d.revealed) { bg = d.mine ? '#ef4444' : '#4b5563'; if(d.mine) t = '💣'; else if(d.adj > 0) t = d.adj; }
            else if(d.flag) { bg = '#f97316'; t = '🚩'; }
            h += '<button class="saper-cell" style="width:' + cs + 'px;height:' + cs + 'px;background:' + bg + ';font-size:' + (cs * 0.5) + 'px;touch-action:manipulation" onclick="saperClick(' + r + ',' + c + ')">' + t + '</button>';
        }
    }
    h += '</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#374151;color:#fff">' + (sRows === 7 ? 'Легко x1.3' : sRows === 10 ? 'Середньо x1.6' : 'Важко x2.0') + '</button></div>';
    a.innerHTML = h;
}
function saperClick(r, c) {
    if(sOver) return;
    if(saperMode === 'flag') {
        if(saperGrid[r][c].revealed) return;
        saperGrid[r][c].flag = !saperGrid[r][c].flag;
        sFlags += saperGrid[r][c].flag ? 1 : -1;
    } else { revealCell(r, c); }
    renderSaper();
}
function revealCell(r, c) {
    if(saperGrid[r][c].revealed || saperGrid[r][c].flag) return;
    if(sFirst) { sFirst = 0; placeMines(r, c); }
    saperGrid[r][c].revealed = 1;
    sRevealed++;
    if(saperGrid[r][c].mine) {
        sOver = 1;
        for(let rr = 0; rr < sRows; rr++) for(let cc = 0; cc < sCols; cc++) if(saperGrid[rr][cc].mine) saperGrid[rr][cc].revealed = 1;
        toast('💥 Міна!');
    } else if(saperGrid[r][c].adj === 0) {
        for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++)
            if(saperGrid[r+dr] && saperGrid[r+dr][c+dc] && !saperGrid[r+dr][c+dc].revealed) revealCell(r+dr, c+dc);
    }
    if(!sOver && sRevealed >= sRows * sCols - sMines) {
        if(Math.random() < 0.5) {
            sOver = 1;
            let w = Math.floor(sBet * sMult);
            coins += w; updBal(); addXP(Math.floor(w/5)); toast('🏆 +' + w + '💰'); saveGame();
        } else {
            sOver = 1;
            for(let rr = 0; rr < sRows; rr++) for(let cc = 0; cc < sCols; cc++) if(saperGrid[rr][cc].mine) saperGrid[rr][cc].revealed = 1;
            toast('💥 Невдача');
        }
    }
}
function startSaperBet() {
    let i = document.getElementById('saperBetInp');
    let b = Number(i?.value || 0);
    if(!b || b < 10 || coins < b) return;
    coins -= b; sBet = b; updBal();
    resetSaper(); saperGameActive = true; renderSaper(); saveGame();
}
function changeSaperDiff() {
    if(saperGameActive) { toast('Закінчіть гру'); return; }
    if(sRows === 7) { sRows = 10; sCols = 10; sMines = 16; }
    else if(sRows === 10) { sRows = 13; sCols = 13; sMines = 24; }
    else { sRows = 7; sCols = 7; sMines = 10; }
    sMult = sRows === 7 ? 1.3 : sRows === 10 ? 1.6 : 2.0;
    resetSaper(); renderSaper();
}

        else if(rand < 0.5) { let amt = Math.floor(Math.random() * 250) + 100; eventHoma += amt; reward = `🌸 +${amt} Івенхомів`; renderEventUI(); }

        else { let amt = Math.floor(Math.random() * 1000) + 600; homa += amt; reward = `🟣 +${amt} Хом`; }
    } else {
        const chestPrice = { common:30000, rare:100000, epic:500000, legendary:2000000, mythic:10000000 }[type];
        if(rand < 0.3) { let amt = Math.floor(chestPrice * (0.5 + Math.random() * 1.5)); coins += amt; reward = `💰 +${amt} монет`; }
        else if(rand < 0.55) { let amt = Math.floor(Math.random() * 45) + 5; homa += amt; reward = `🟣 +${amt} Хом`; }
        else if(rand < 0.75) { let free = GIFS.filter(g => !g.homa); if(free.length) { let g = free[Math.floor(Math.random() * free.length)]; addGif(g.id, 1); reward = `🎨 Гіфка ${g.e}`; } else { homa += 15; reward = `🟣 +15 Хом`; } }

        else { let bonus = Math.floor(Math.random() * 40) + 15; maxEn += bonus; curEn += bonus; reward = `⚡ +${bonus} макс. енергії`; }
    }
    toast(reward); flashReward(); updAll(); saveGame();

async function loadMarketListings() {
    let c = document.getElementById('market-content');
    if(!c) return;
    c.innerHTML = '<div class="card">Завантаження...</div>';
    try {
        let snap = await db.ref('market_listings').once('value');
        let list = snap.val();
        if(!list || Object.keys(list).length === 0) { c.innerHTML = '<div class="card">Немає лотів</div>'; return; }
        let html = '<div style="display:flex;justify-content:space-between"><b>🏪 Лоти</b><button class="btn btn-b btn-sm" onclick="refreshMarket()">🔄</button></div>';
        for(let [id, data] of Object.entries(list)) {
            let isOwn = data.sellerId === currentUser?.uid;
            let itemDisplay = data.itemType === 'gif' ? data.itemId : data.itemType;
            html += `<div class="market-item"><div><b>${itemDisplay}</b><br><small>від ${data.sellerName || '?'}</small></div><div class="price">🟣 ${data.price}</div><div>${!isOwn ? `<button class="btn btn-g btn-sm" onclick="buyMarketItem('${id}',${data.price},'${data.itemType}','${data.itemId}','${data.sellerId}')">Купити</button>` : `<button class="btn btn-r btn-sm" onclick="cancelMarketListing('${id}')">Скасувати</button>`}</div></div>`;
        }
        c.innerHTML = html;
    } catch(e) { c.innerHTML = '<div class="card">Помилка ринку</div>'; }
}
async function refreshMarket() { await loadMarketListings(); toast('🔄 Ринок оновлено'); }
async function listItemOnMarket(type, id, price) {
    if(!id || price <= 0) { toast('Ціна >0'); return; }
    if(type === 'gif') { if(!hasGif(id)) { toast('Немає гіфки'); return; } removeGif(id, 1); }
    else if(type === 'title') { if(!hasTitle(id)) { toast('Немає титулу'); return; } removeTitle(id, 1); }
    else if(chests[type] && chests[type] > 0) { chests[type]--; }
    else { toast('Немає предмета'); return; }
    updAll(); saveGame();
    await db.ref('market_listings').push().set({ sellerId: currentUser.uid, sellerName: userName, itemType: type, itemId: id, price: price, timestamp: Date.now() });
    toast(`✅ Виставлено ${id} за ${price}🟣`); renderInventoryTab(); await refreshMarket();
}
async function buyMarketItem(listId, price, type, itemId, sellerId) {
    if(homa < price) { toast(`❌ Не вистачає ${price}🟣`); return; }
    try {
        let snap = await db.ref('market_listings/' + listId).once('value');
        if(!snap.exists()) { toast('Лот вже продано'); return; }
        let gain = Math.floor(price * 0.9);
        homa -= price;
        let seller = await db.ref('users/' + sellerId).once('value');
        if(seller.val()) await db.ref('users/' + sellerId + '/homa').set((seller.val().homa || 0) + gain);
        if(type === 'gif') addGif(itemId, 1);
        else if(type === 'title') addTitle(itemId, 1);
        else chests[type] = (chests[type] || 0) + 1;
        updAll(); saveGame();
        await db.ref('market_listings/' + listId).remove();
        toast(`🎉 Куплено ${itemId} за ${price}🟣`); renderInventoryTab(); await refreshMarket();
    } catch(e) { toast('Помилка купівлі'); }
}
async function cancelMarketListing(listId) {
    try {
        let snap = await db.ref('market_listings/' + listId).once('value');
        let l = snap.val();
        if(!l) { toast('Лот не знайдено'); return; }
        if(l.sellerId !== currentUser.uid) { toast('Не ваш лот'); return; }
        if(l.itemType === 'gif') addGif(l.itemId, 1);
        else if(l.itemType === 'title') addTitle(l.itemId, 1);
        else chests[l.itemType] = (chests[l.itemType] || 0) + 1;
        updAll(); saveGame();
        await db.ref('market_listings/' + listId).remove();
        toast('✅ Лот скасовано'); renderInventoryTab(); await refreshMarket();
    } catch(e) { toast('Помилка'); }
}

        }

function promptSell(type, id) {
    let price = prompt(`Ціна в 🟣 Хома для ${id} (комісія 10%)`, "10");

    price = parseInt(price);
    if(isNaN(price) || price <= 0) { toast('Ціна >0'); return; }
    listItemOnMarket(type, id, price);
}

function execConsoleVip() {
    let inp = document.getElementById('consoleInputVip');
    let cmd = inp.value.trim();
    let out = document.getElementById('consoleOutputVip');
    if(!cmd) return;
    out.innerHTML += `> ${cmd}\n`;
    if(cmd === '/help') out.innerHTML += '/info /color#00ff88 /renameНік /clear\n';
    else if(cmd === '/clear') out.innerHTML = '';
    else if(cmd.startsWith('/color')) { let col = cmd.split('#')[1]; if(col) chTheme('#' + col); out.innerHTML += '✅\n'; }
    else if(cmd.startsWith('/rename')) { let newName = cmd.slice(7); if(newName) { userName = newName; document.getElementById('userName').textContent = userName; if(creatorData.level >= 2) creatorData.promoCode = newName; saveGame(); out.innerHTML += '✅\n'; } }
    else if(cmd === '/info') out.innerHTML += `💰${Math.floor(coins)} 🟣${homa} ⭐${accLvl} 👆${totalTaps}\n`;
    else out.innerHTML += 'Невідома команда. /help\n';
    inp.value = '';
    out.scrollTop = out.scrollHeight;
}

async function handleCreatorPromo(code) {
    let snap = await db.ref('users').once('value');
    let creatorUid = null;
    snap.forEach(child => {
        let d = child.val();
        if(d.creatorData && d.creatorData.promoCode === code && d.creatorData.level >= 2) { creatorUid = child.key; }
    });
    if(!creatorUid) return false;
    homa += 100;
    addCreatorXP(20);
    let creatorSnap = await db.ref('users/' + creatorUid).once('value');
    let cd = creatorSnap.val().creatorData || { level: 2, xp: 0, promoCode: code };
    cd.xp = (cd.xp || 0) + 20;
    cd.promoRefCount = (cd.promoRefCount || 0) + 1;
    await db.ref('users/' + creatorUid + '/creatorData').set(cd);
    toast(`🎉 Ви ввели промокод Creator ${code}! +100🟣 та +20 XP Creator для ${code}`);
    return true;
}
async function reviewApplications() {
    if(!isAdmin) { toast('Немає прав'); return; }
    let apps = [];
    let snap = await db.ref('users').once('value');
    snap.forEach(child => {
        let d = child.val();
        if(d.creatorData && d.creatorData.applicationStatus === 'pending') {
            apps.push({ uid: child.key, name: d.name, text: d.creatorData.applicationText, level: d.creatorData.level });
        }
    });
    if(apps.length === 0) { toast('Немає заявок'); return; }
    let html = '<div class="card"><b>📋 Заявки на Creator</b></div>';
    for(let a of apps) {
        html += `<div class="card"><b>${a.name}</b><br><small>${a.text}</small><br><button class="btn btn-g btn-sm" onclick="approveApp('${a.uid}')">✅ Прийняти</button> <button class="btn btn-r btn-sm" onclick="rejectApp('${a.uid}')">❌ Відхилити</button></div>`;
    }
    document.getElementById('game-area').innerHTML = html;
}
async function approveApp(uid) {
    let snap = await db.ref('users/' + uid).once('value');
    let data = snap.val();
    let cd = data.creatorData || { level: 1, xp: 0 };
    if(cd.level === 1) {
        cd.level = 2; cd.promoCode = data.name; cd.applicationStatus = 'approved';
        await db.ref('users/' + uid + '/creatorData').set(cd);
        await db.ref('users/' + uid + '/myTitles/tester').set(1);
        toast(`✅ ${data.name} підвищено до 2 рівня Creator!`);
    } else if(cd.level === 2 && cd.xp >= 500) {
        cd.level = 3; cd.applicationStatus = 'approved';
        await db.ref('users/' + uid + '/creatorData').set(cd);
        await db.ref('users/' + uid + '/myTitles/admin_title').set(1);
        toast(`✅ ${data.name} підвищено до 3 рівня Creator!`);
    }
    reviewApplications();
}
async function rejectApp(uid) {
    await db.ref('users/' + uid + '/creatorData/applicationStatus').set('rejected');
    toast('❌ Заявку відхилено');
    reviewApplications();
}

function showPlayerProfile(pd) {

function buildTop() {
    const a = document.getElementById('top-area');
    if(!a) return;
    a.innerHTML = '<div class="card"><b>🏆 Топ гравців</b></div><p style="text-align:center; padding:20px; color:#888;">Завантаження...</p>';
    
    db.ref('users').once('value').then(snap => {
        const users = [];
        snap.forEach(child => {
            const data = child.val();
            if(!data || !data.name) return;
            
            // ========== УМОВИ ДЛЯ ТОПУ ==========
            // 1. Пропускаємо гравців з ніком "Гравець"
            if(data.name === 'Гравець') return;
            // 2. Потрібен мінімум 3 рівень
            if(data.lvl < 3) return;
            // 3. Пропускаємо прихованих
            if(data.hideFromTop === true) return;
            
            let chestCount = 0;
            if(data.chests){
                for(let key in data.chests) chestCount += data.chests[key] || 0;
            }
            users.push({
                name: data.name,
                xp: data.xp || 0,
                coins: data.coins || 0,
                lvl: data.lvl || 1,
                avatar: data.curGif || '🐹',
                homa: data.homa || 0,
                eventHoma: data.eventHoma || 0,
                totalTaps: data.totalTaps || 0,
                totalChests: chestCount,
                curTitle: data.curTitle || 'none'
            });
        });
        
        users.sort((a,b) => (b.xp || 0) - (a.xp || 0));
        const topUsers = users.slice(0, 20);
        
        if(topUsers.length === 0){
            a.innerHTML = '<div class="card"><b>🏆 Топ гравців</b></div><p style="text-align:center;color:#888;">⚠️ Немає гравців 3+ рівня</p><p style="text-align:center;color:#666;font-size:9px;">Досягніть 3 рівня, щоб потрапити в топ!</p>';
            return;
        }
        
        let h = '<div class="card"><b>🏆 Топ гравців (3+ рівень)</b><br><small style="color:#888;">Клікніть для деталей</small></div>';
        topUsers.forEach((user, i) => {
            const rank = i+1;
            let rankClass = '', medal = rank;
            if(rank === 1){ rankClass = 'rank-1'; medal = '🥇'; }
            else if(rank === 2){ rankClass = 'rank-2'; medal = '🥈'; }
            else if(rank === 3){ rankClass = 'rank-3'; medal = '🥉'; }
            let titleDisplay = 'Без титулу';
            try {
                titleDisplay = getTitleDisplay(user.curTitle).replace(/<[^>]*>/g, '');
            } catch(e) { titleDisplay = user.curTitle || 'Без титулу'; }
            
            h += `<div class="top-item" onclick='showPlayerProfile(${JSON.stringify({
                name: user.name,
                xp: user.xp,
                coins: user.coins,
                lvl: user.lvl,
                avatar: user.avatar,
                homa: user.homa,
                eventHoma: user.eventHoma,
                totalTaps: user.totalTaps,
                totalChests: user.totalChests,
                titleDisplay: titleDisplay
            })})'>
                <div class="rank ${rankClass}">${medal}</div>
                <div style="flex:1"><b>${user.avatar} ${user.name}</b><br><small>⭐ Рівень ${user.lvl} | XP: ${user.xp}</small></div>
                <div style="color:#fbbf24">💰 ${Math.floor(user.coins)}</div>
            </div>`;
        });
        a.innerHTML = h;
    }).catch((e) => { 
        console.error('Помилка завантаження топу:', e);
        a.innerHTML = '<div class="card"><b>🏆 Топ гравців</b></div><p style="text-align:center;color:#888">Помилка завантаження. Спробуйте пізніше.</p>';
    });
}

// ========== МАГАЗИН ==========
function getPrice(item) {
    let p = { maxEnergy: { base: 2000, mult: 1.5 }, autoXP: { base: 5000, mult: 2 }, autoTap: { base: 300, mult: 1.4 }, energyRegen: { base: 15000, mult: 2.5 }, upgradeTap: { base: 1000, mult: 1.8 }, coinBoostB: { base: 5000, mult: 2 }, energyUp: { base: 5000, mult: 1.8 }, tapPowerB: { base: 15000, mult: 2.5 }, critChanceB: { base: 10000, mult: 2 }, luckB: { base: 3000, mult: 2 } };
    let d = p[item];
    if(!d) return 999999;
    if(item === 'upgradeTap') return Math.floor(d.base * Math.pow(d.mult, tapLvl - 1));
    return Math.floor(d.base * Math.pow(d.mult, buyCount[item] || 0));
}
function buyItem(t) {
    let p = 0;
    if(t === 'maxEnergy') { p = getPrice('maxEnergy'); if(coins < p) return; coins -= p; maxEn += 50; curEn += 50; buyCount.maxEnergy++; }
    else if(t === 'autoXP') { p = getPrice('autoXP'); if(coins < p) return; coins -= p; autoXP++; buyCount.autoXP++; }
    else if(t === 'xpBoost') { if(coins < 300) return; coins -= 300; addXP(100); }
    else if(t === 'autoTap') { p = getPrice('autoTap'); if(coins < p) return; coins -= p; autoTap++; buyCount.autoTap++; }
    else if(t === 'energyRegen') { p = getPrice('energyRegen'); if(coins < p) return; coins -= p; buyCount.energyRegen++; }
    else if(t === 'upgradeTap') { p = getPrice('upgradeTap'); if(coins < p) return; coins -= p; tapLvl++; buyCount.upgradeTap++; }
    else if(t === 'coinBoost') { p = getPrice('coinBoostB'); if(coins < p) return; coins -= p; coinBoost += 0.5; buyCount.coinBoostB++; }
    else if(t === 'energyUp') { p = getPrice('energyUp'); if(coins < p) return; coins -= p; maxEn += 100; curEn += 100; buyCount.energyUp++; }
    else if(t === 'tapPower') { p = getPrice('tapPowerB'); if(coins < p) return; coins -= p; tapPow += 0.5; buyCount.tapPowerB++; }
    else if(t === 'critChance') { p = getPrice('critChanceB'); if(coins < p) return; coins -= p; crit += 5; buyCount.critChanceB++; }
    else if(t === 'luck') { p = getPrice('luckB'); if(coins < p) return; coins -= p; luck += 0.1; buyCount.luckB++; }
    else if(t === 'vip') { if(inv.includes('VIP')) { toast('Вже є'); return; } if(coins < 20000) return; coins -= 20000; inv.push('VIP'); luck = Math.min(luck + 0.1, 1.3); toast('👑 VIP придбано!'); renderVipTab(); }
    updAll(); saveGame(); toast('✅ Куплено!');
}
function buyHoma(n) { let cost = n * 50000; if(coins >= cost) { coins -= cost; homa += n; updAll(); saveGame(); toast(`✅ +${n}🟣`); } else toast('❌ Мало монет'); }
function buyHomaTitle() { if(hasTitle('hamka')) { toast('Вже є'); return; } if(homa >= 25000) { homa -= 25000; addTitle('hamka', 1); updAll(); saveGame(); toast('🏅 Титул Хамка!'); renderInventoryTab(); renderVipTab(); } else toast('❌ 25000🟣'); }
function buyHomaGif() { if(hasGif('⚔️')) { toast('Вже є'); return; } if(homa >= 15000) { homa -= 15000; addGif('⚔️', 1); updAll(); saveGame(); toast('⚔️ Гіфка Меч!'); renderInventoryTab(); renderVipTab(); } else toast('❌ 15000🟣'); }
function renderGifShop() {
    let s = document.getElementById('gifShop');
    if(!s) return;
    s.innerHTML = GIFS.filter(g => !g.homa).map(g => {
        let owned = hasGif(g.id);
        let priceCoins = R[g.r]?.p || 1000;
        let priceHoma = 0;
        if(g.r === 'legendary') priceHoma = 500;
        else if(g.r === 'mythic') priceHoma = 200;
        return `<div class="gif-cell" style="width:60px;height:60px;flex-direction:column;gap:4px;"><div style="font-size:28px;">${g.e}</div>${!owned ? `<div style="display:flex;gap:4px;">${priceCoins > 0 ? `<button class="btn btn-g btn-sm" style="padding:2px 4px;font-size:8px;" onclick="buyGif('${g.id}')">💰${priceCoins}</button>` : ''}${priceHoma > 0 ? `<button class="btn btn-o btn-sm" style="padding:2px 4px;font-size:8px;" onclick="buyGifForHoma('${g.id}')">🟣${priceHoma}</button>` : ''}</div>` : `<div style="font-size:9px;">✅ x${getGifCount(g.id)}</div>`}</div>`;
    }).join('');
}
function buyGif(id) {
    let g = GIFS.find(g => g.id === id);
    if(!g || hasGif(id)) return;
    let price = R[g.r]?.p || 1000;
    if(coins >= price) { coins -= price; addGif(id, 1); updAll(); saveGame(); toast(`🎨 Ви купили гіфку ${g.e} за ${price}💰!`); renderGifShop(); renderInventoryTab(); renderVipTab(); }
    else toast(`❌ Не вистачає монет (потрібно ${price}💰)`);
}
function buyGifForHoma(id) {
    let g = GIFS.find(g => g.id === id);
    if(!g || hasGif(id)) return;
    let priceHoma = 0;
    if(g.r === 'legendary') priceHoma = 500;
    else if(g.r === 'mythic') priceHoma = 200;
    else return toast('❌ Цю гіфку не можна купити за хоми');
    if(homa >= priceHoma) { homa -= priceHoma; addGif(id, 1); updAll(); saveGame(); toast(`🎨 Ви купили гіфку ${g.e} за ${priceHoma}🟣!`); renderGifShop(); renderInventoryTab(); renderVipTab(); }
    else toast(`❌ Не вистачає хом (потрібно ${priceHoma}🟣)`);
}

    let a = document.getElementById('game-area');
    if(g === 'tap') {
        a.innerHTML = '<div class="center-game"><div style="font-size:20px;color:#fbbf24;font-weight:800">🪙 <span id="tapBalance">' + Math.floor(coins) + '</span></div><div class="tap-circle" id="tapBtn">' + curGif + '</div></div>';
        let btn = document.getElementById('tapBtn');
        if(btn) { btn.onclick = tapClick; btn.ontouchstart = tapClick; }
    } else if(g === 'casino') {
        a.innerHTML = '<div class="center-game"><h3 style="color:#00ff88">🎰 Казино</h3><div style="display:flex;gap:6px"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">🍉</div></div><div class="bet-row"><button class="btn btn-g btn-sm" onclick="chBet(-10)">-</button><input type="number" id="bet" value="10"><button class="btn btn-g btn-sm" onclick="chBet(10)">+</button></div><button class="btn btn-o" onclick="spin()">🎰 КРУТИТИ</button></div>';

    } else if(g === 'boss') { renderBosses(); }

function switchTab(t) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
    document.getElementById('tab-' + t).classList.add('show');
    document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
    let btns = document.querySelectorAll('.tab-nav button');
    let idx = { 'games':0, 'shop':1, 'vip':2, 'creator':3, 'profile':4, 'top':5, 'inventory':6 }[t];
    if(idx !== undefined && btns[idx]) btns[idx].classList.add('active');
    if(t === 'games') openGame(currentGame);
    if(t === 'shop') { renderShopRes(); renderShopUpg(); renderShopVis(); renderShopBox(); renderMarketTab(); }
    if(t === 'vip') renderVipTab();
    if(t === 'creator') renderCreatorTab();
    if(t === 'profile') buildProfile();
    if(t === 'top') buildTop();
    if(t === 'inventory') renderInventoryTab();
}
function shopTab(t) {
    document.querySelectorAll('#shop-res, #shop-upg, #shop-vis, #shop-box, #shop-market').forEach(e => e.style.display = 'none');
    document.getElementById('shop-' + t).style.display = 'block';
    document.querySelectorAll('.shop-tab').forEach(b => b.classList.remove('active'));
    if(t === 'res') document.querySelector('.shop-tab:first-child')?.classList.add('active');
    else if(t === 'upg') document.querySelector('.shop-tab:nth-child(2)')?.classList.add('active');
    else if(t === 'vis') document.querySelector('.shop-tab:nth-child(3)')?.classList.add('active');
    else if(t === 'box') document.querySelector('.shop-tab:nth-child(4)')?.classList.add('active');
    else if(t === 'market') document.querySelector('.shop-tab:nth-child(5)')?.classList.add('active');
    if(t === 'vis') { renderGifShop(); renderTitleShop(); }
    if(t === 'market') renderMarketTab();
}
function openAdminPanel() {
    let a = document.getElementById('game-area');
    a.innerHTML = `<div class="center-game"><h3>🔧 Адмін панель</h3><div class="card"><input id="adminNick" placeholder="UID гравця"><select id="adminAction"><option value="addCoins">💰 Монети</option><option value="addHoma">🟣 Хоми</option><option value="addEventHoma">🌸 Івенхоми</option><option value="addGif">🎨 Гіфка(ID)</option><option value="addTitle">🏅 Титул</option><option value="rename">✏️ Ім'я</option></select><input id="adminValue" placeholder="Значення"><button class="btn btn-g" onclick="executeAdminAction()">Виконати</button></div></div>`;
}
async function executeAdminAction() {
    if(!isAdmin) { toast('Немає прав'); return; }
    let uid = document.getElementById('adminNick').value.trim();
    let action = document.getElementById('adminAction').value;
    let val = document.getElementById('adminValue').value.trim();
    if(!uid || !val) { toast('Введіть дані'); return; }
    let snap = await db.ref('users/' + uid).once('value');
    let data = snap.val();
    if(!data) { toast('Гравця не знайдено'); return; }
    let updates = {};
    if(action === 'addCoins') updates.coins = (data.coins || 0) + parseInt(val);
    else if(action === 'addHoma') updates.homa = (data.homa || 0) + parseInt(val);
    else if(action === 'addEventHoma') updates.eventHoma = (data.eventHoma || 0) + parseFloat(val);
    else if(action === 'addGif') { let cur = data.myGifs || {}; cur[val] = (cur[val] || 0) + 1; updates.myGifs = cur; }
    else if(action === 'addTitle') { let cur = data.myTitles || {}; cur[val] = (cur[val] || 0) + 1; updates.myTitles = cur; }
    else if(action === 'rename') updates.name = val;
    await db.ref('users/' + uid).update(updates);
    toast('✅ Готово');
    if(currentUser && currentUser.uid === uid) { loadData({ ...data, ...updates }); updateUI(); }
}
function buildPages() {
    let adminBtn = isAdmin ? '<button class="btn btn-r" onclick="openAdminPanel()">🔧 Адмін</button>' : '';

// ========== ВХІД ПО НІКУ БЕЗ ПАРОЛЯ ==========
async function loginWithNoPassword() {
    let nick = document.getElementById('authNick').value.trim();
    if(!nick || nick.length < 2) { toast('Введіть нікнейм (мінімум 2 символи)'); return; }
    try {
        let userCredential = await auth.signInAnonymously();
        currentUser = userCredential.user;
        let userRef = db.ref('users/' + currentUser.uid);
        let snap = await userRef.once('value');
        if(snap.val()) { loadData(snap.val()); }
        else { defData(); userName = nick; saveGame(); }
        toast(`🎉 Ласкаво просимо, ${userName}!`);
        startGame();
    } catch(e) { toast('Помилка: ' + e.message); }
}
async function handleLogin() {
    let nick = document.getElementById('authNick').value.trim();
    let pass = document.getElementById('authPass').value;
    if(!nick || !pass) { toast('Введіть нік та пароль'); return; }
    let email = nick + '@hamka.ua';
    try {
        let userCredential = await auth.signInWithEmailAndPassword(email, pass);
        currentUser = userCredential.user;
        let snap = await db.ref('users/' + currentUser.uid).once('value');
        if(snap.val()) loadData(snap.val());
        else { defData(); userName = nick; saveGame(); }
        startGame();
    } catch(e) { toast('Невірний логін або пароль'); }
}
async function handleRegister() {
    let nick = document.getElementById('authNick').value.trim();
    let pass = document.getElementById('authPass').value;
    if(nick.length < 3 || pass.length < 4) { toast('Нік ≥3, пароль ≥4'); return; }
    let email = nick + '@hamka.ua';
    try {
        let userCredential = await auth.createUserWithEmailAndPassword(email, pass);
        currentUser = userCredential.user;
        defData();
        userName = nick;
        saveGame();
        startGame();
    } catch(e) { toast('Помилка: ' + e.message); }
}
function loginWithTelegram() {
    if(!tg?.initDataUnsafe?.user?.id) { toast('Тільки в Telegram'); return; }
    let tgId = 'tg_' + tg.initDataUnsafe.user.id;
    let tgName = tg.initDataUnsafe.user.first_name || 'User';
    auth.signInAnonymously().then(async (uc) => {
        let snap = await db.ref('users/' + tgId).once('value');
        if(snap.val()) { loadData(snap.val()); userName = snap.val().name || tgName; }
        else { defData(); userName = tgName; saveGame(); }
        let oldData = { coins, autoTap, tapLvl, totalTaps, luck, myGifs, myTitles, curGif, curTitle, xp: accXP, lvl: accLvl, coinBoost, autoXP, maxEn, curEn, homa, tapPow, crit, buyCount, chests, name: userName, eventHoma, lastFreeBoss, eventTapCooldown, lastTimeReward, morseLastLevel, lastSaveTime, currentTheme, hideFromTop, inv, creatorData };
        await db.ref('users/' + tgId).set(oldData);
        await db.ref('users/' + uc.user.uid).remove();
        currentUser = { uid: tgId };
        loadData(oldData);
        startGame();
    }).catch(e => toast('Помилка: ' + e.message));
}
function startGame() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    document.getElementById('userName').innerHTML = userName;
    buildPages();
    updateUI();
    processOfflineBonus();
    if(gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(() => {
        curEn = Math.min(maxEn, curEn + 1 + (buyCount.energyRegen || 0));
        updEnergy();
        if(autoTap > 0) { coins += autoTap; updBal(); }
        if(autoXP > 0) addXP(autoXP);
        if(creatorData.level >= 2) {
            creatorData.onlineHours = (creatorData.onlineHours || 0) + 1/3600;
            addCreatorXP(20/3600);
        }
        let now = Date.now();
        if(now - lastTimeReward >= 300000) { lastTimeReward = now; coins += 500; toast('⏰ +500 монет за час'); updAll(); saveGame(); }
        if(totalTaps % 30 === 0) saveGame();
    }, 1000);
    saveGame();
}
function logout() {
    if(gameInterval) clearInterval(gameInterval);
    gameInterval = null;
    auth.signOut().then(() => { location.reload(); }).catch(() => location.reload());
}
async function activatePromo() {
    let c = document.getElementById('promoInp').value.trim().toUpperCase();
    if(!c) return;
    if(usedPromos.includes(c)) { toast('Вже використано'); return; }
    if(c === 'H7F9H6L0') {
        giveCreatorLevel3ByAdminPromo();
        usedPromos.push(c);
        saveGame(); updAll();
        document.getElementById('promoInp').value = '';
        return;
    }
    let handled = await handleCreatorPromo(c);
    if(handled) {
        usedPromos.push(c);
        saveGame(); updAll();
        document.getElementById('promoInp').value = '';
        return;
    }
    if(c === 'LETO') { eventHoma += 50; toast('🎁 +50 івенхомів'); usedPromos.push(c); saveGame(); updAll(); }
    else if(promos[c.toLowerCase()] === 'admin') { isAdmin = 1; toast('🔧 Адмін права'); buildPages(); }
    else if(promos[c.toLowerCase()] === 'event15') { eventHoma += 15; toast('+15 івенхомів'); usedPromos.push(c); saveGame(); updAll(); }
    else if(promos[c.toLowerCase()]) { coins += promos[c.toLowerCase()]; toast(`🎁 +${promos[c.toLowerCase()]}💰`); usedPromos.push(c); updBal(); saveGame(); }
    else { toast('Невірний промокод'); }
    document.getElementById('promoInp').value = '';
}

auth.onAuthStateChanged(async (user) => {
    if(user) {
        currentUser = user;
        let snap = await db.ref('users/' + currentUser.uid).once('value');
        if(snap.val()) loadData(snap.val());
        else { defData(); saveGame(); }
        startGame();
    } else {
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('game').style.display = 'none';
    }
});
if(tg) tg.ready();
</script>
