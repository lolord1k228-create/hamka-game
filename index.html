<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 hamka v0.2.2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation}
        .app{width:100%;max-width:420px;height:100vh;background:#0a0a0a;display:flex;flex-direction:column;overflow:hidden}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#111;min-height:40px}
        .top-bar span{font-size:12px;color:#00ff88;font-weight:700}
        .tab-nav{display:flex;gap:2px;padding:4px;background:#111}
        .tab-nav button{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;color:#888;font-size:9px;cursor:pointer}
        .tab-nav button.active{background:#00ff88;color:#000}
        .content-area{flex:1;overflow-y:auto;padding:8px}
        .page{display:none}.page.show{display:block}
        .center-game{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:10px}
        .tap-circle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#2a2a35,#141418);border:3px solid #00ff88;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:50px;box-shadow:0 0 20px rgba(0,255,136,0.3)}
        .tap-circle:active{transform:scale(0.93)}
        .energy-bar{width:85%;height:8px;background:#222;border-radius:4px;overflow:hidden;margin:4px 0}
        .energy-fill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:width 0.3s}
        .xp-bar{width:85%;height:5px;background:#222;border-radius:3px;overflow:hidden;margin:2px 0}
        .xp-fill{height:100%;background:linear-gradient(90deg,#4488ff,#00ccff);transition:width 0.3s}
        .btn{padding:10px;border:none;border-radius:8px;font-weight:700;font-size:10px;cursor:pointer;text-align:center}
        .btn:active{transform:scale(0.95)}
        .btn-g{background:#00ff88;color:#000}.btn-o{background:#ff8800;color:#fff}.btn-r{background:#ff4757;color:#fff}.btn-b{background:#4488ff;color:#fff}
        .btn-block{width:100%}.btn-sm{padding:6px 8px;font-size:9px}
        .card{background:#1a1a1d;padding:10px;border-radius:8px;border:1px solid #222;margin-bottom:5px;font-size:10px}
        .shop-tabs{display:flex;gap:4px;margin-bottom:6px}
        .shop-tab{flex:1;padding:6px;border:1px solid #333;border-radius:6px;background:transparent;color:#999;font-size:9px;cursor:pointer;text-align:center}
        .shop-tab.active{background:#00ff88;color:#000;border-color:#00ff88}
        .slot{width:40px;height:40px;background:#1a1a1d;border:2px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
        .bet-row{display:flex;align-items:center;gap:6px}
        .bet-row input{width:50px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;padding:6px;border-radius:6px;font-size:10px;outline:none}
        .toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#1a1a1d;padding:8px 16px;border-radius:20px;font-size:10px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;border:1px solid #333}
        .toast.show{opacity:1}
        .bal{text-align:center;padding:6px;background:#111;font-size:13px;font-weight:800;color:#ffcc00}
        .xp-info{text-align:center;font-size:8px;color:#4488ff;padding:2px}
        .promo-row{display:flex;gap:4px;padding:4px 8px;background:#111}
        .promo-row input{flex:1;background:#1a1a1d;color:#fff;border:1px solid #333;padding:6px;border-radius:6px;font-size:9px;outline:none}
        .stats-row{font-size:9px;color:#888;text-align:center;margin:4px 0}
        .gif-row{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
        .gif-cell{width:28px;height:28px;border-radius:5px;background:#2a2a35;cursor:pointer;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
        .gif-cell.sel{border-color:#ffcc00}
        .gif-cell .gif-price{position:absolute;bottom:-5px;font-size:5px;color:#ffcc00;background:#000;padding:1px 2px;border-radius:2px}
        .inv-item{display:inline-block;background:rgba(0,0,0,0.3);padding:2px 5px;border-radius:4px;margin:1px;font-size:8px;border:1px solid #333}
        .console-box{background:#000;border-radius:4px;padding:4px;font-family:monospace;font-size:7px;color:#0f0;min-height:30px;max-height:70px;overflow-y:auto;white-space:pre-wrap;margin:2px 0;border:1px solid #1a3a1a}
        .console-inp{width:100%;background:#000;color:#0f0;border:1px solid #333;padding:4px;font-family:monospace;font-size:7px;outline:none;border-radius:3px}
        .color-dots{display:flex;gap:3px;margin:2px 0}
        .color-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent}
        .color-dot.active{border-color:#fff}
        .homa-card{border-left:3px solid #ff44ff}
        .top-item{display:flex;align-items:center;gap:6px;padding:6px;background:#1a1a1d;border-radius:6px;margin:2px 0;font-size:9px;border:1px solid #222}
        .top-item .rank{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px}
        .top-item .rank-1{background:#ffcc00;color:#000}.top-item .rank-2{background:#aaa;color:#000}.top-item .rank-3{background:#cd7f32;color:#000}
        .profile-header{text-align:center;padding:12px}
        .profile-header .avatar{font-size:40px;margin-bottom:4px}
        .profile-header .name{font-size:13px;font-weight:800;color:#00ff88}
        .profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
        .profile-stat{background:#1a1a1d;padding:8px;border-radius:6px;text-align:center;font-size:8px;border:1px solid #222}
        .profile-stat .value{font-size:14px;font-weight:800;color:#ffcc00}
        .saper-cell{border:none;border-radius:3px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;transition:all 0.1s}
        .offline-bonus{background:#1a1a1d;border:2px solid #ffcc00;border-radius:8px;padding:10px;text-align:center;margin:6px 0;font-size:10px;color:#ffcc00;font-weight:700;animation:glow 2s infinite}
        @keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,204,0,0.3)}50%{box-shadow:0 0 25px rgba(255,204,0,0.7)}}
        input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    </style>
</head>
<body>
<div class="app" id="app">
    <div id="login" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center">
        <div style="font-size:50px">🐹</div>
        <h2 style="color:#00ff88;margin:8px;font-size:18px">hamka v0.2.2</h2>
        <button class="btn btn-g btn-block" onclick="playGame()" style="font-size:13px;margin:8px 0">🎮 Грати</button>
    </div>
    <div id="game" style="display:none;flex-direction:column;height:100%">
        <div class="top-bar"><span>🐹 <span id="userName">Гравець</span></span><span style="color:#ff44ff;font-size:10px">🟣 <span id="homaDisp">0</span></span></div>
        <div class="tab-nav"><button class="active" onclick="switchTab('games',this)">🎮</button><button onclick="switchTab('shop',this)">🛒</button><button onclick="switchTab('vip',this)">👑</button><button onclick="switchTab('profile',this)">👤</button><button onclick="switchTab('top',this)">🏆</button></div>
        <div class="content-area" id="contentArea"></div>
        <div id="offlineBonus" class="offline-bonus" style="display:none"></div>
        <div class="energy-bar" style="width:90%;margin:0 auto"><div class="energy-fill" id="energyFill" style="width:100%"></div></div>
        <div class="stats-row">⚡ <span id="energyText">400</span>/<span id="maxEnergyText">400</span></div>
        <div class="bal" id="balance">💰 50</div>
        <div class="xp-info">⭐ Рів <span id="lvlDisp">1</span> | XP: <span id="xpDisp">0</span>/200</div>
        <div class="xp-bar" style="width:90%;margin:0 auto"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <div class="promo-row"><input type="text" id="promoInp" placeholder="🎁 Промокод"><button class="btn btn-g btn-sm" onclick="activatePromo()">OK</button></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== Hamka v0.2.2 – фикс визуала + миграция старых сохранений ==========
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

const GIFS=[{id:'🐹',e:'🐹',r:'common'},{id:'🐱',e:'🐱',r:'common'},{id:'🐶',e:'🐶',r:'common'},{id:'🦊',e:'🦊',r:'common'},{id:'🐻',e:'🐻',r:'common'},{id:'🐯',e:'🐯',r:'rare'},{id:'🦁',e:'🦁',r:'rare'},{id:'🐺',e:'🐺',r:'rare'},{id:'👑',e:'👑',r:'superrare'},{id:'💎',e:'💎',r:'superrare'},{id:'🌟',e:'🌟',r:'epic'},{id:'🔥',e:'🔥',r:'epic'},{id:'🚀',e:'🚀',r:'mythic'},{id:'🦄',e:'🦄',r:'legendary'},{id:'🐲',e:'🐲',r:'legendary'},{id:'⚔️',e:'⚔️',r:'exclusive',homa:1}];
const R={common:{n:'Простий',p:1000},rare:{n:'Рідкісний',p:3000},superrare:{n:'Надрідкісний',p:8000},epic:{n:'Епічний',p:50000},mythic:{n:'Міфічний',p:150000},legendary:{n:'Легендарний',p:500000},exclusive:{n:'Ексклюзивний',p:0}};
const LEVELS=[{l:1,x:0,rw:0},{l:2,x:200,rw:20},{l:3,x:600,rw:40},{l:4,x:1500,rw:80},{l:5,x:4000,rw:160},{l:6,x:10000,rw:320},{l:7,x:25000,rw:640},{l:8,x:60000,rw:1280},{l:9,x:150000,rw:2500},{l:10,x:400000,rw:5000}];

let coins=50,inv=[],autoTap=0,tapLvl=1,totalTaps=0,totalWon=0,luck=1.0,lastSpin=0,isAdmin=0,coinBoost=1.0,autoXP=0,homa=0,saperHW=0,casinoW=0,maxEn=400,curEn=400,accXP=0,accLvl=1,userId=null,userName='Гравець',allUsers={},myGifs=['🐹'],curGif='🐹',myTitles=['none'],curTitle='none',morseUsed=0,tapPow=1.0,crit=0;
let buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
const usedPromos=[],promos={lordeddw:500,robot:300,hamka2024:1000,gift:5000};
let lastSaveTime=Date.now();

// Миграция старых сохранений
function migrateOldSaves(){
    // Было hGuest?
    const oldGuest = localStorage.getItem('hGuest');
    if(oldGuest && !localStorage.getItem('hamka_save')){
        try{
            const d = JSON.parse(oldGuest);
            if(d && typeof d === 'object'){
                localStorage.setItem('hamka_save', JSON.stringify(d));
                toast('🔄 Старий прогрес відновлено!');
            }
        }catch(e){}
    }
    // Были аккаунты?
    const oldAccs = localStorage.getItem('hAcc');
    if(oldAccs){
        try{
            const accs = JSON.parse(oldAccs);
            const users = Object.values(accs);
            if(users.length && !localStorage.getItem('hamka_save')){
                const last = users[users.length-1];
                if(last && typeof last === 'object'){
                    localStorage.setItem('hamka_save', JSON.stringify(last));
                    toast('🔄 Знайдено старий акаунт!');
                }
            }
        }catch(e){}
    }
}
migrateOldSaves();

function getPrice(item){const p={maxEnergy:{base:2000,mult:1.5},autoXP:{base:5000,mult:2},autoTap:{base:300,mult:1.4},energyRegen:{base:15000,mult:2.5},upgradeTap:{base:1000,mult:1.8},coinBoostB:{base:5000,mult:2},energyUp:{base:5000,mult:1.8},tapPowerB:{base:15000,mult:2.5},critChanceB:{base:10000,mult:2},luckB:{base:3000,mult:2}};const d=p[item];if(!d)return 0;if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1));return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0))}
function loadAll(){try{const s=localStorage.getItem('hamka_users');if(s)allUsers=JSON.parse(s)}catch(e){allUsers={}}}
function saveAll(){localStorage.setItem('hamka_users',JSON.stringify(allUsers))}
function loadD(d){coins=d.coins||50;inv=d.inv||[];autoTap=d.autoTap||0;tapLvl=d.tapLvl||1;totalTaps=d.totalTaps||0;totalWon=d.totalWon||0;luck=d.luck||1.0;curGif=d.curGif||'🐹';myGifs=d.myGifs||['🐹'];accXP=d.xp||0;accLvl=d.lvl||1;myTitles=d.myTitles||['none'];curTitle=d.curTitle||'none';coinBoost=d.coinBoost||1.0;autoXP=d.autoXP||0;maxEn=d.maxEn||400;curEn=d.curEn||400;homa=d.homa||0;saperHW=d.saperHW||0;casinoW=d.casinoW||0;tapPow=d.tapPow||1.0;crit=d.crit||0;morseUsed=d.morseUsed||0;buyCount=d.buyCount||{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};lastSaveTime=d.lastSaveTime||Date.now()}
function defD(){coins=50;inv=[];autoTap=0;tapLvl=1;totalTaps=0;luck=1.0;curGif='🐹';myGifs=['🐹'];accXP=0;accLvl=1;myTitles=['none'];curTitle='none';coinBoost=1.0;autoXP=0;maxEn=400;curEn=400;homa=0;saperHW=0;casinoW=0;tapPow=1.0;crit=0;morseUsed=0;buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};lastSaveTime=Date.now()}
function saveG(){lastSaveTime=Date.now();const d={coins,inv,autoTap,tapLvl,totalTaps,totalWon,luck,curGif,myGifs,xp:accXP,lvl:accLvl,myTitles,curTitle,coinBoost,autoXP,maxEn,curEn,homa,saperHW,casinoW,tapPow,crit,morseUsed,buyCount,lastSaveTime};localStorage.setItem('hamka_save',JSON.stringify(d))}

function playGame(){
    const s=localStorage.getItem('hamka_save');
    if(s)try{loadD(JSON.parse(s))}catch(e){defD()}else defD();
    const now=Date.now();
    const sec=Math.floor((now-lastSaveTime)/1000);
    if(sec>30){
        const maxSec=Math.min(sec,10800);
        curEn=Math.min(maxEn,curEn+Math.floor(maxSec*(1+buyCount.energyRegen)));
        if(autoTap>0)coins+=Math.floor(maxSec*(autoTap/5));
        if(autoXP>0)addXP(Math.floor(maxSec*autoXP));
        document.getElementById('offlineBonus').style.display='block';
        document.getElementById('offlineBonus').innerHTML='🎁 Офлайн бонус за '+Math.floor(maxSec/60)+'хв';
        setTimeout(()=>document.getElementById('offlineBonus').style.display='none',8000);
        lastSaveTime=now;
    }
    startGame();
}

function startGame(){
    document.getElementById('login').style.display='none';
    document.getElementById('game').style.display='flex';
    document.getElementById('userName').textContent=tg?.initDataUnsafe?.user?.first_name||'Гравець';
    buildPages();
    updAll();
    openGame('tap');
    saveG();
}

function getLI(xp){let c=LEVELS[0],n=LEVELS[1];for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}}return{c,n}}
function addXP(a){const old=accLvl;accXP+=a;const li=getLI(accXP);accLvl=li.c.l;if(accLvl>old){coins+=li.c.rw;toast('🎉 Рівень '+accLvl+'! +'+li.c.rw+'💰')}updXp()}
function updXp(){const li=getLI(accXP);const next=li.n.x;const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100;document.getElementById('xpFill').style.width=Math.min(progress,100)+'%';document.getElementById('xpDisp').textContent=accXP;document.getElementById('lvlDisp').textContent=accLvl}
function updEnergy(){document.getElementById('energyFill').style.width=(curEn/maxEn*100)+'%';document.getElementById('energyText').textContent=Math.floor(curEn);document.getElementById('maxEnergyText').textContent=maxEn}

setInterval(()=>{curEn=Math.min(maxEn,curEn+1+buyCount.energyRegen);updEnergy();if(autoTap>0){coins+=autoTap;updBal()}if(autoXP>0)addXP(autoXP);saveG()},1000);

let clicks=[],blocked=0;
function tapClick(e){if(blocked)return;if(curEn<=0){toast('⚡ Немає енергії!');return}curEn--;const now=Date.now();clicks=clicks.filter(t=>now-t<1000);if(clicks.length>=12){blocked=1;setTimeout(()=>{blocked=0;clicks=[]},2000);return}clicks.push(now);let inc=Math.floor(Math.random()*3)+1+(tapLvl-1);inc=Math.floor(inc*coinBoost*tapPow);if(Math.random()*100<crit)inc=Math.floor(inc*2);coins+=inc;totalTaps++;addXP(1);updBal();updEnergy();saveG()}

window.addEventListener('beforeunload',()=>{saveG()});

function buildPages(){
    document.getElementById('contentArea').innerHTML='<div id="tab-games" class="page show"><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px"><button class="btn btn-g" onclick="openGame(\'tap\')">💸 Тап</button><button class="btn btn-o" onclick="openGame(\'casino\')">🎰 Казино</button><button class="btn btn-r" onclick="openGame(\'saper\')">💣 Сапер</button><button class="btn btn-b" onclick="openGame(\'morse\')">📻 Морзе</button></div><div id="game-area"></div></div><div id="tab-shop" class="page"><div class="shop-tabs"><button class="shop-tab active" onclick="shopTab(\'res\',event)">⚡</button><button class="shop-tab" onclick="shopTab(\'upg\',event)">⭐</button><button class="shop-tab" onclick="shopTab(\'vis\',event)">🎨</button><button class="shop-tab" onclick="shopTab(\'box\',event)">🎁</button></div><div id="shop-res"></div><div id="shop-upg" style="display:none"></div><div id="shop-vis" style="display:none"></div><div id="shop-box" style="display:none"></div></div><div id="tab-vip" class="page"><div id="vip-area"></div></div><div id="tab-profile" class="page"><div id="profile-area"></div></div><div id="tab-top" class="page"><div id="top-area"></div></div>';
    buildVip();buildProfile();buildTop();renderShopRes();renderShopUpg();renderShopVis();renderShopBox();
}

function renderShopRes(){document.getElementById('shop-res').innerHTML='<div class="card"><b>⚡ Енергія +50</b><br><small>💰'+getPrice('maxEnergy')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'maxEnergy\')">Купити</button></div><div class="card"><b>✨ Авто XP</b><br><small>💰'+getPrice('autoXP')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoXP\')">Купити</button></div><div class="card"><b>🚀 XP Бустер</b><br><small>💰300</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'xpBoost\')">Купити</button></div><div class="card"><b>⚡ Авто тап</b><br><small>💰'+getPrice('autoTap')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoTap\')">Купити</button></div><div class="card"><b>🔄 Регенерація</b><br><small>💰'+getPrice('energyRegen')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'energyRegen\')">Купити</button></div><div class="card homa-card"><b>🟣 Хоми</b><br><button class="btn btn-g btn-block btn-sm" onclick="buyHoma(1)">1🟣 50K</button></div>'}
function renderShopUpg(){document.getElementById('shop-upg').innerHTML='<div class="card"><b>⭐ Прокачка '+tapLvl+'</b><br><small>💰'+getPrice('upgradeTap')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'upgradeTap\')">Прокачати</button></div><div class="card"><b>🪙 Бустер x'+coinBoost.toFixed(1)+'</b><br><small>💰'+getPrice('coinBoostB')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'coinBoost\')">Купити</button></div><div class="card"><b>💪 Сила x'+tapPow.toFixed(1)+'</b><br><small>💰'+getPrice('tapPowerB')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'tapPower\')">Купити</button></div><div class="card"><b>🎯 Крит '+crit+'%</b><br><small>💰'+getPrice('critChanceB')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'critChance\')">Купити</button></div><div class="card"><b>👑 VIP</b><br><small>💰20000</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'vip\')">Купити '+(inv.includes('VIP')?'✅':'')+'</button></div><div class="card"><b>🍀 Удача x'+luck.toFixed(1)+'</b><br><small>💰'+getPrice('luckB')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'luck\')">Купити</button></div>'}
function renderShopVis(){document.getElementById('shop-vis').innerHTML='<b style="color:#00ff88">🎨 Гіфки</b><div class="gif-row" id="gifShop"></div><div class="card homa-card" style="margin-top:4px"><b>🏅 Хамка</b><br><small>5000🟣</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyHomaTitle()">Купити</button></div><b style="color:#00ff88;display:block;margin-top:4px">🏅 Титули</b><div id="titleShop"></div>';renderGifShop();renderTitleShop()}
function renderShopBox(){document.getElementById('shop-box').innerHTML='<div class="card"><b>📦 Простий</b><br><small>💰30K</small><br><button class="btn btn-g btn-block btn-sm" onclick="openChest(\'common\')">Відкрити</button></div><div class="card"><b>📦 Рідкісний</b><br><small>💰100K</small><br><button class="btn btn-g btn-block btn-sm" onclick="openChest(\'rare\')">Відкрити</button></div><div class="card"><b>📦 Епічний</b><br><small>💰500K</small><br><button class="btn btn-g btn-block btn-sm" onclick="openChest(\'epic\')">Відкрити</button></div><div class="card homa-card"><b>🟣 Хома-ящик</b><br><small>500🟣</small><br><button class="btn btn-g btn-block btn-sm" onclick="openHomaChest()">Відкрити</button></div>'}
function buildVip(){const v=document.getElementById('vip-area');if(isAdmin||inv.includes('VIP')){v.innerHTML='<div><b style="color:#00ff88">💻 Консоль</b><div class="console-box" id="consoleOutput">/help</div><input type="text" class="console-inp" id="consoleInput" placeholder="Команда..."><button class="btn btn-g btn-sm btn-block" onclick="execConsole()">▶</button></div>'}else{v.innerHTML='<h3 style="color:#ff4757;text-align:center">🔒 VIP (20000💰)</h3>'}}
function buildProfile(){const a=document.getElementById('profile-area');a.innerHTML='<div class="profile-header"><div class="avatar">'+curGif+'</div><div class="name">'+userName+'</div><div class="level">⭐ Рівень '+accLvl+'</div></div><div class="profile-stats"><div class="profile-stat"><div class="value">💰 '+coins+'</div>Монети</div><div class="profile-stat"><div class="value">🟣 '+homa+'</div>Хоми</div><div class="profile-stat"><div class="value">👆 '+totalTaps+'</div>Тапів</div><div class="profile-stat"><div class="value">💪 x'+tapPow.toFixed(1)+'</div>Сила</div></div>'}
function buildTop(){const a=document.getElementById('top-area');loadAll();const sorted=Object.entries(allUsers).sort((a,b)=>b[1].coins-a[1].coins).slice(0,20);let h='<div class="card"><b>🏆 Топ</b></div>';sorted.forEach(([key,data],i)=>{h+='<div class="top-item"><div class="rank" style="background:'+(i<3?['#ffcc00','#aaa','#cd7f32'][i]:'#333')+'">'+(i+1)+'</div><div style="flex:1"><b>'+(data.avatar||'🐹')+' '+(data.name||key)+'</b></div><div style="color:#ffcc00">💰 '+(data.coins||0)+'</div></div>'});a.innerHTML=h||'<p style="color:#888">Немає даних</p>'}
function shopTab(t,ev){document.querySelectorAll('#shop-res, #shop-upg, #shop-vis, #shop-box').forEach(e=>e.style.display='none');document.getElementById('shop-'+t).style.display='block';document.querySelectorAll('.shop-tab').forEach(b=>b.classList.remove('active'));if(ev&&ev.target)ev.target.classList.add('active');if(t==='vis'){renderGifShop();renderTitleShop()}}

function openGame(g){const a=document.getElementById('game-area');if(g==='tap'){a.innerHTML='<div class="center-game"><div style="font-size:18px;color:#ffcc00;font-weight:800">🪙 '+coins+'</div><div class="tap-circle" id="tapBtn">'+curGif+'</div><div class="stats-row">⚡ '+Math.floor(curEn)+'/'+maxEn+' | 👆 '+totalTaps+'</div></div>';document.getElementById('tapBtn').onclick=tapClick}else if(g==='casino'){a.innerHTML='<div class="center-game"><h3 style="color:#00ff88">🎰 Казино</h3><div style="display:flex;gap:5px"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">🍉</div></div><div class="bet-row"><button class="btn btn-g btn-sm" onclick="chBet(-10)">-</button><input type="number" id="bet" value="10"><button class="btn btn-g btn-sm" onclick="chBet(10)">+</button></div><button class="btn btn-o" onclick="spin()">🎰 КРУТИТИ (<span id="betDisp">10</span>💰)</button></div>'}else if(g==='saper'){resetSaper();renderSaper()}else if(g==='morse'){if(accLvl<4){a.innerHTML='<div class="center-game"><h3>🔒 Морзянка</h3><p>З 4 рівня</p></div>';return}a.innerHTML='<div class="center-game"><h3 style="color:#00ff88">📻 Морзянка</h3><p>Код: <b>IMA</b></p><p>+20000💰</p><div id="morseDisp" style="font-size:16px;color:#00ff88;min-height:18px"></div><div style="display:flex;gap:5px"><button class="btn btn-b btn-sm" onmousedown="startDot()" onmouseup="stopMorse()">•</button><button class="btn btn-o btn-sm" onmousedown="startDash()" onmouseup="stopMorse()">−</button></div><button class="btn btn-g" onclick="submitMorse()">▶</button></div>'}}
function chBet(d){const i=document.getElementById('bet');if(i){i.value=Math.max(1,parseInt(i.value||10)+d);document.getElementById('betDisp').textContent=i.value}}
function spin(){const now=Date.now();if(now-lastSpin<3000)return;const bet=Number(document.getElementById('bet')?.value||0);if(!bet||coins<bet)return;lastSpin=now;coins-=bet;updBal();const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');const em=["🍒","🍋","🍉","⭐","7️⃣","💎"];const int=setInterval(()=>{s1.textContent=em[Math.floor(Math.random()*6)];s2.textContent=em[Math.floor(Math.random()*6)];s3.textContent=em[Math.floor(Math.random()*6)]},80);setTimeout(()=>{clearInterval(int);const x=em[Math.floor(Math.random()*6)],y=em[Math.floor(Math.random()*6)],z=em[Math.floor(Math.random()*6)];s1.textContent=x;s2.textContent=y;s3.textContent=z;let win=0;if(x===y&&y===z)win=bet*3;else if(x===y||y===z||x===z)win=Math.floor(bet*1.5);win=Math.floor(win*luck);coins+=win;if(win>0){addXP(Math.floor(win/5));totalWon++}updBal();saveG()},1200)}

let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal';
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0}}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt}}
function renderSaper(){const a=document.getElementById('game-area');const cs=Math.min(24,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#2a2a30;color:#fff;border:1px solid #555;border-radius:3px;padding:2px;font-size:8px"> | x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'btn-o')+'" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'btn-g')+'" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat('+sCols+','+cs+'px);background:#222;padding:4px;border-radius:6px">';
for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#3a3a45';if(d.revealed){bg=d.mine?'#ff4757':'#5a5a6a';if(d.mine)t='💣';else if(d.adj>0)t=d.adj}else if(d.flag){bg='#ff8800';t='🚩'}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.5)+'px" onclick="saperClick('+r+','+c+')">'+t+'</button>'}
h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#555;color:#fff">'+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1}else{revealCell(r,c)}renderSaper()}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c)}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Міна!')}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc)}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 +'+w+'💰');saveG()}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача')}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;updBal();resetSaper();renderSaper();saveG()}
function changeSaperDiff(){if(sRows===7){sRows=10;sCols=10;sMines=16}else if(sRows===10){sRows=13;sCols=13;sMines=24}else{sRows=7;sCols=7;sMines=10}resetSaper();renderSaper()}

let morseCode='',morseSeq='',morseTimeout=null;
function startDot(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='.';document.getElementById('morseDisp').textContent=morseSeq}
function startDash(){if(morseTimeout){clearTimeout(morseTimeout);morseTimeout=null}morseSeq+='-';document.getElementById('morseDisp').textContent=morseSeq}
function stopMorse(){morseTimeout=setTimeout(()=>{if(morseSeq.length>0){const l=Object.keys({I:'..',M:'--',A:'.-'}).find(k=>({I:'..',M:'--',A:'.-'})[k]===morseSeq);if(l){morseCode+=l}morseSeq=''}},800)}
function submitMorse(){if(morseCode==='IMA'){coins+=20000;addXP(1000);morseUsed=1;morseCode='';updBal();saveG();toast('✅ +20000💰');openGame('morse')}}

function openChest(r){const p={common:30000,rare:100000,epic:500000};if(!p[r]||coins<p[r])return;coins-=p[r];updBal();saveG();setTimeout(()=>{const res=Math.random();if(res<0.5)homa++;else{const g=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(g.length)myGifs.push(g[Math.floor(Math.random()*g.length)].id)}updAll();saveG();toast('✅')},1500)}
function openHomaChest(){if(homa<500)return;homa-=500;updAll();saveG();setTimeout(()=>{const res=Math.random();if(res<0.5)homa+=100;else{const g=GIFS.filter(g=>!myGifs.includes(g.id)&&!g.homa);if(g.length)myGifs.push(g[Math.floor(Math.random()*g.length)].id)}updAll();saveG();toast('✅')},1500)}

function execConsole(){const i=document.getElementById('consoleInput');const c=i.value.trim();if(!c)return;clog('> '+c);if(c=='/help')clog('/help /clear /info');else if(c=='/clear')document.getElementById('consoleOutput').innerHTML='';else if(c=='/info')clog('💰'+coins+' 🟣'+homa+' ⭐'+tapLvl);else clog('❌');i.value=''}
function clog(t){const o=document.getElementById('consoleOutput');if(o){o.innerHTML+=t+'\n';o.scrollTop=o.scrollHeight}}

function buyItem(t){
    if(t==='maxEnergy'){const p=getPrice('maxEnergy');if(coins<p)return;coins-=p;maxEn+=50;curEn=Math.min(curEn+50,maxEn);buyCount.maxEnergy++}
    else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p)return;coins-=p;autoXP++;buyCount.autoXP++}
    else if(t==='xpBoost'){if(coins<300)return;coins-=300;addXP(100)}
    else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p)return;coins-=p;autoTap++;buyCount.autoTap++}
    else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p)return;coins-=p;buyCount.energyRegen++}
    else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p)return;coins-=p;tapLvl++;buyCount.upgradeTap++}
    else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p)return;coins-=p;coinBoost+=0.5;buyCount.coinBoostB++}
    else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p)return;coins-=p;tapPow+=0.5;buyCount.tapPowerB++}
    else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p)return;coins-=p;crit+=5;buyCount.critChanceB++}
    else if(t==='vip'){if(inv.includes('VIP'))return;if(coins<20000)return;coins-=20000;inv.push('VIP');luck=Math.min(luck+0.1,1.3);buildVip()}
    else if(t==='luck'){const p=getPrice('luckB');if(coins<p)return;coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++}
    updAll();saveG();toast('✅')
}
function buyHoma(n){const p=n*50000;if(coins<p)return;coins-=p;homa+=n;updAll();saveG()}
function buyHomaTitle(){if(myTitles.includes('hamka'))return;if(homa<5000)return;homa-=5000;myTitles.push('hamka');updAll();saveG()}
function buyGif(id){const g=GIFS.find(g=>g.id===id);if(!g||myGifs.includes(id))return;if(g.homa)return;const p=R[g.r]?.p||1000;if(coins<p)return;coins-=p;myGifs.push(id);updAll();saveG()}
function buyTitle(id){if(myTitles.includes(id))return;if(coins<1000)return;coins-=1000;myTitles.push(id);updAll();saveG()}
function selGif(id){if(!myGifs.includes(id))return;curGif=id;updAll();saveG()}

function renderGifShop(){const s=document.getElementById('gifShop');if(!s)return;s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>myGifs.includes(g.id)?'<div class="gif-cell" style="border-color:#888">'+g.e+'</div>':'<div class="gif-cell" onclick="buyGif(\''+g.id+'\')">'+g.e+'<span class="gif-price">'+(R[g.r]?.p||1000)+'</span></div>').join('')}
function renderTitleShop(){const s=document.getElementById('titleShop');if(!s)return;const a=['noob','player','pro'].filter(t=>!myTitles.includes(t));s.innerHTML=a.length===0?'<p style="color:#888">✅</p>':a.map(t=>'<div class="card"><b>['+t+']</b> 💰1000<br><button class="btn btn-g btn-block btn-sm" onclick="buyTitle(\''+t+'\')">Купити</button></div>').join('')}

function updAll(){updBal();updXp();updHoma();updEnergy();buildProfile();buildTop()}
function updBal(){document.getElementById('balance').textContent='💰 '+coins}
function updHoma(){document.getElementById('homaDisp').textContent=homa}

function activatePromo(){const i=document.getElementById('promoInp');const c=i.value.trim().toLowerCase();if(!c)return;if(usedPromos.includes(c)){toast('❌');return}if(promos[c]){coins+=promos[c];usedPromos.push(c);updBal();saveG();i.value=''}else if(c==='owerlord'){isAdmin=1;buildVip();updAll();saveG()}else{toast('❌')}}

function switchTab(t,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById('tab-'+t).classList.add('show');document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(t==='shop'){renderShopRes();renderShopUpg();renderShopVis();renderShopBox()}if(t==='vip')buildVip();if(t==='profile')buildProfile();if(t==='top')buildTop()}
</script>
