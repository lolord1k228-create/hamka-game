function generateMegaQuest(level) {
    const t = MEGA_QUEST_TYPES[Math.floor(Math.random() * MEGA_QUEST_TYPES.length)];
    const target = Math.floor(t.baseTarget * (1 + (level-1) * 0.5));
    return {
        type: t.type,
        desc: t.desc.replace('{0}', target),
        target: target,
        rewardEventHoma: 2 + level,
        rewardCoins: 500 * level,
        rewardHoma: 10 * level,
    };
}

function updateTopTitles() {
    const key = getUserKey();
    db.ref('users').orderByChild('xp').limitToLast(10).once('value')
    .then(snap => {
        const topList = [];
        snap.forEach(child => {
            const data = child.val();
            if (data && typeof data.xp === 'number') topList.push({ key: child.key, xp: data.xp });
        });
        topList.sort((a, b) => b.xp - a.xp);
        const position = topList.findIndex(item => item.key === key) + 1;
        const topTitles = ['king', 'lord', 'knight'];
        myTitles = myTitles.filter(t => !topTitles.includes(t));
        let newTopTitle = null;
        if (position === 1) { myTitles.push('king'); newTopTitle = 'king'; toast('👑 Ви стали Королем! (1 місце за XP)'); }
        else if (position === 2) { myTitles.push('lord'); newTopTitle = 'lord'; toast('🗡️ Ви стали Лордом! (2 місце за XP)'); }
        else if (position === 3) { myTitles.push('knight'); newTopTitle = 'knight'; toast('🛡️ Ви стали Лицарем! (3 місце за XP)'); }
        if (newTopTitle && curTitle !== newTopTitle) { curTitle = newTopTitle; }
        else if (!newTopTitle && topTitles.includes(curTitle)) {
            const priority = ['king', 'lord', 'knight', 'hamka', 'pro', 'player', 'noob', 'none'];
            let fallback = 'none';
            for (const t of priority) { if (myTitles.includes(t)) { fallback = t; break; } }
            curTitle = fallback;
        }
        saveG(); updAll();
    }).catch(e => console.error('Помилка оновлення топ-титулів:', e));
}

function getDailyQuests(dateStr) {
    let hash = 0;
    for (let i = 0; i < dateStr.length; i++) { hash = ((hash << 5) - hash) + dateStr.charCodeAt(i); hash |= 0; }
    const idx1 = Math.abs(hash % QUEST_POOL.length);
    const idx2 = Math.abs((hash * 31 + 17) % QUEST_POOL.length);
    const finalIdx2 = idx2 === idx1 ? (idx2 + 1) % QUEST_POOL.length : idx2;
    return [
        {...QUEST_POOL[idx1], progress:0, completed:false, claimed:false},
        {...QUEST_POOL[finalIdx2], progress:0, completed:false, claimed:false}
    ];
}

function claimQuestReward(index) {
    if (!dailyQuests[index] || !dailyQuests[index].completed) { toast('❌ Квест ще не виконано!'); return; }
    if (dailyQuests[index].claimed) { toast('❌ Нагороду вже отримано!'); return; }
    const q = dailyQuests[index];
    q.claimed = true;
    switch (q.rewardType) {
        case 'coins': coins += q.rewardValue; toast(`✅ +${q.rewardValue}💰`); break;
        case 'homa': homa += q.rewardValue; homaEarnedToday += q.rewardValue; toast(`✅ +${q.rewardValue}🟣`); break;
        case 'xp': addXP(q.rewardValue); toast(`✅ +${q.rewardValue} XP`); break;
        case 'gif':
            if (q.rewardValue === 'random') {
                const available = GIFS.filter(g => !myGifs.includes(g.id) && !g.homa);
                if (available.length > 0) { const gif = available[Math.floor(Math.random() * available.length)]; myGifs.push(gif.id); newGifsToday++; toast('🎨 Отримано гіфку: ' + gif.e); }
                else { homa += 100; homaEarnedToday += 100; toast('🟣 +100 Хом (всі гіфки зібрані)'); }
            }
            break;
        case 'title':
            if (!myTitles.includes(q.rewardValue)) { myTitles.push(q.rewardValue); newTitlesToday++; toast('🏅 Отримано титул: ' + q.rewardValue); }
            else { homa += 50; homaEarnedToday += 50; toast('🟣 +50 Хом (титул вже є)'); }
            break;
        case 'chest':
            if (chests[q.rewardValue] !== undefined) { chests[q.rewardValue] = (chests[q.rewardValue] || 0) + 1; toast('🎁 Отримано ящик: ' + q.rewardValue); }
            else { coins += 5000; toast('💰 +5000 (невідомий ящик)'); }
            break;
        default: toast('❌ Невідома нагорода');
    }
    updAll(); saveG(); renderQuests();
}
function renderQuests() {
    const a = document.getElementById('game-area');
    let html = '<div class="center-game"><h3 style="color:#f97316">📜 Щоденні квести</h3>';
    if (!dailyQuests.length) html += '<p>Немає квестів</p>';
    else {
        dailyQuests.forEach((q, i) => {
            const prog = Math.min(q.progress || 0, q.target);
            const done = prog >= q.target;
            const claimed = q.claimed || false;
            let rewardText = '';
            switch (q.rewardType) {
                case 'coins': rewardText = `💰${q.rewardValue}`; break;
                case 'homa': rewardText = `🟣${q.rewardValue}`; break;
                case 'xp': rewardText = `⭐${q.rewardValue} XP`; break;
                case 'gif': rewardText = `🎨 Випадкова гіфка`; break;
                case 'title': rewardText = `🏅 Титул "${q.rewardValue}"`; break;
                case 'chest': rewardText = `🎁 Ящик "${q.rewardValue}"`; break;
                default: rewardText = '❓';
            }
            html += `<div class="card" style="width:100%"><b>${q.desc}</b><br><small>Прогрес: ${prog}/${q.target}</small><div style="background:#333;height:5px;border-radius:3px;margin:4px 0"><div style="width:${(prog/q.target)*100}%;height:100%;background:#00ff88;border-radius:3px"></div></div><small>Нагорода: ${rewardText}</small><br><button class="btn btn-sm ${claimed?'btn-g':'btn-o'}" onclick="claimQuestReward(${i})" ${!done || claimed ? 'disabled' : ''}>${claimed ? 'Отримано' : (done ? 'Забрати' : 'Виконати')}</button></div>`;
        });
    }
    html += '</div>'; a.innerHTML = html;
}

function spin(){ 
    const now=Date.now();if(now-lastSpin<3000)return;
    const bet=Number(document.getElementById('bet')?.value||0);
    if(!bet||coins<bet)return;
    lastSpin=now;coins-=bet;updBal();
    const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');
    const em=["🍒","🍋","🍉","⭐","7️⃣","💎"];

    setTimeout(()=>{
        clearInterval(int);
        const x=em[Math.floor(Math.random()*6)],y=em[Math.floor(Math.random()*6)],z=em[Math.floor(Math.random()*6)];
        s1.textContent=x;s2.textContent=y;s3.textContent=z;
        let win=0;
        if(x===y&&y===z)win=bet*3;
        else if(x===y||y===z||x===z)win=Math.floor(bet*1.5);
        win=Math.floor(win*luck);
        coins+=win;
        if(win>0){addXP(Math.floor(win/5));totalWon++; casinoWinsToday++;}
        casinoPlaysToday++;
        updateQuestProgress(); updateMegaQuestProgress();
        updBal();saveG();
    },1200);
}

let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal',saperGameActive=false;
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;saperGameActive=false;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0};}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++;}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt;}}
function renderSaper(){const a=document.getElementById('game-area');const cs=Math.min(24,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 <input type="number" id="saperBetInp" value="100" style="width:40px;text-align:center;background:#1f2937;color:#fff;border:1px solid #374151;border-radius:3px;padding:2px;font-size:8px"> | x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:3px;margin:2px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'btn-o')+'" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'btn-g')+'" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:2px;grid-template-columns:repeat('+sCols+','+cs+'px);background:#1f2937;padding:4px;border-radius:6px">';for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#374151';if(d.revealed){bg=d.mine?'#ef4444':'#4b5563';if(d.mine)t='💣';else if(d.adj>0)t=d.adj;}else if(d.flag){bg='#f97316';t='🚩';}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.5)+'px;touch-action:manipulation" onclick="saperClick('+r+','+c+')">'+t+'</button>';}h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#374151;color:#fff">'+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h;}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1;}else{revealCell(r,c);}renderSaper();}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c);}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Міна!');}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc);}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 +'+w+'💰');saveG();}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача');}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;updBal();resetSaper();saperGameActive=true;renderSaper();saveG();}
function changeSaperDiff(){if(saperGameActive){toast('Закінчіть поточну гру');return;}if(sRows===7){sRows=10;sCols=10;sMines=16;}else if(sRows===10){sRows=13;sCols=13;sMines=24;}else{sRows=7;sCols=7;sMines=10;}sMult=sRows===7?1.3:sRows===10?1.6:2.0;resetSaper();renderSaper();}

// Боси
function fightBoss(cost) {
    if (homa < cost) { toast('❌ Недостатньо 🟣'); return; }
    homa -= cost; updHoma(); saveG();
    toast('⚔️ Битва з босом...');
    setTimeout(() => {
        let chance = 0.3 + accLvl * 0.03 + luck * 0.05;
        if (cost >= 5000) chance += 0.05;
        if (cost >= 15000) chance += 0.1;
        if (Math.random() < Math.min(chance, 0.85)) {
            const rewards = ['gif', 'homa', 'title', 'chest'];
            const reward = rewards[Math.floor(Math.random() * rewards.length)];
            if (reward === 'gif') {
                const available = GIFS.filter(g => !myGifs.includes(g.id) && !g.homa);
                if (available.length > 0) { const gif = available[Math.floor(Math.random() * available.length)]; myGifs.push(gif.id); toast('🎨 Отримано гіфку: ' + gif.e); newGifsToday++; }
                else { homa += 50; homaEarnedToday += 50; toast('🟣 +50 Хом (всі гіфки зібрані)'); }
            } else if (reward === 'homa') { const amount = Math.floor(Math.random() * 200) + 100 + cost; homa += amount; homaEarnedToday += amount; toast('🟣 +' + amount + ' Хом'); }
            else if (reward === 'title') {
                const specialTitles = ['king', 'lord', 'knight', 'hamka', 'pro', 'player', 'noob'];
                const newTitle = specialTitles[Math.floor(Math.random() * specialTitles.length)];
                if (!myTitles.includes(newTitle)) { myTitles.push(newTitle); toast('🏅 Отримано титул: ' + newTitle); newTitlesToday++; }
                else { homa += 100; homaEarnedToday += 100; toast('🟣 +100 Хом (титул вже є)'); }
            } else if (reward === 'chest') {
                const chestTypes = ['common', 'rare', 'epic', 'legendary', 'mythic'];
                const ct = chestTypes[Math.floor(Math.random() * chestTypes.length)];
                chests[ct] = (chests[ct] || 0) + 1;
                toast('🎁 Отримано ящик: ' + ct);
            }
        } else { toast('❌ Поразка... Спробуйте ще!'); }
        bossKillsToday++; updateQuestProgress(); updateMegaQuestProgress(); updAll(); saveG();
    }, 2000);
}

function renderShopBox(){ const boxDiv = document.getElementById('shop-box'); if (!boxDiv) return; const items = [ { type: 'common', name: '📦 Простий ящик', price: '30K💰' }, { type: 'rare', name: '📦 Рідкісний ящик', price: '100K💰' }, { type: 'epic', name: '📦 Епічний ящик', price: '500K💰' }, { type: 'legendary', name: '📦 Легендарний ящик', price: '2M💰' }, { type: 'mythic', name: '📦 Міфічний ящик', price: '10M💰' }, { type: 'homa_chest', name: '🟣 Хома-ящик', price: '500🟣' }, { type: 'homa10_chest', name: '🟣 Хома x10', price: '4500🟣' } ]; let html = ''; items.forEach(item => { const count = chests[item.type] || 0; html += `<div class="card"><b>${item.name}</b><br><small>${item.price} | В інвентарі: ${count}</small><br><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-g btn-sm" onclick="buyChest('${item.type}')">Купити</button><button class="btn btn-o btn-sm" onclick="openChestFromInventory('${item.type}')" ${count === 0 ? 'disabled style="opacity:0.5"' : ''}>Відкрити</button></div></div>`; }); boxDiv.innerHTML = html; }

function getPrice(item){ const p={maxEnergy:{base:2000,mult:1.5},autoXP:{base:5000,mult:2},autoTap:{base:300,mult:1.4},energyRegen:{base:15000,mult:2.5},upgradeTap:{base:1000,mult:1.8},coinBoostB:{base:5000,mult:2},energyUp:{base:5000,mult:1.8},tapPowerB:{base:15000,mult:2.5},critChanceB:{base:10000,mult:2},luckB:{base:3000,mult:2}}; const d=p[item];if(!d)return 0; if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1)); return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0)); }
function getLI(xp){ let c=LEVELS[0],n=LEVELS[1]; for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}} return{c,n}; }

function updXp(){ const li=getLI(accXP); const next=li.n.x; const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100; document.getElementById('xpFill').style.width=Math.min(progress,100)+'%'; document.getElementById('xpDisp').textContent=accXP; document.getElementById('lvlDisp').textContent=accLvl; }

async function executeAdminAction() {
    const nick = document.getElementById('adminNick').value.trim();
    const action = document.getElementById('adminAction').value;
    const val = document.getElementById('adminValue').value.trim();
    if (!nick) { toast('Введіть нік'); return; }
    const key = 'nick_' + nick;
    try {
        const snap = await db.ref('users/' + key).once('value');
        const data = snap.val();
        if (!data) { toast('❌ Гравця не знайдено'); return; }
        let updates = {};
        switch (action) {
            case 'addCoins': const addCoins = parseInt(val); if (isNaN(addCoins) || addCoins <= 0) { toast('Сума має бути числом'); return; } updates['coins'] = (data.coins || 0) + addCoins; break;
            case 'addHoma': const addHoma = parseInt(val); if (isNaN(addHoma) || addHoma <= 0) { toast('Сума має бути числом'); return; } updates['homa'] = (data.homa || 0) + addHoma; break;
            case 'addGif': const gifIds = val.split(',').map(s => s.trim()).filter(id => GIFS.some(g => g.id === id)); if (gifIds.length === 0) { toast('❌ Невірні ID гіфок'); return; } const currentGifs = data.myGifs || []; updates['myGifs'] = [...new Set([...currentGifs, ...gifIds])]; break;
            case 'addTitle': if (!val) { toast('Введіть назву титулу'); return; } const currentTitles = data.myTitles || []; if (!currentTitles.includes(val)) { updates['myTitles'] = [...currentTitles, val]; } else { toast('❌ Титул вже є'); return; } break;
            case 'rename': if (!val) { toast('Введіть нове ім\'я'); return; } updates['name'] = val; break;
            case 'delete': await db.ref('users/' + key).remove(); toast(`🗑️ Гравця ${nick} видалено`); return;
            default: toast('❌ Невідома дія'); return;
        }
        if (Object.keys(updates).length > 0) { await db.ref('users/' + key).update(updates); toast(`✅ Дію виконано для ${nick}`); }
    } catch (e) { console.error(e); toast('❌ Помилка: ' + e.message); }
}

function buildVip(){const v=document.getElementById('vip-area');if(isAdmin||inv.includes('VIP')){v.innerHTML='<div><b style="color:#00ff88;font-size:10px">🎨 Гіфка (вибір)</b><div class="gif-row" id="styleGifGrid"></div><b style="color:#00ff88;font-size:10px;display:block;margin-top:6px">🎨 Колір теми</b><div class="color-dots"><div class="color-dot active" style="background:#00ff88" onclick="chTheme(\'#00ff88\')"></div><div class="color-dot" style="background:#ef4444" onclick="chTheme(\'#ef4444\')"></div><div class="color-dot" style="background:#3b82f6" onclick="chTheme(\'#3b82f6\')"></div></div><b style="color:#00ff88;font-size:10px;display:block;margin-top:6px">💻 Консоль</b><div class="console-box" id="consoleOutput">Готово. /help</div><input type="text" class="console-inp" id="consoleInput" placeholder="Команда..."><button class="btn btn-g btn-sm btn-block" onclick="execConsole()">▶ Виконати</button>'; if(isAdmin){ v.innerHTML+='<button class="btn btn-o btn-block btn-sm" onclick="openAdminPanel()" style="margin-top:4px">🔧 Адмін панель</button>'; } v.innerHTML+='</div>'; renderStyleGifs(); }else{v.innerHTML='<h3 style="color:#ef4444;text-align:center;font-size:10px">🔒 Потрібен VIP (20000💰)</h3>';} }
function buildProfile(){const a=document.getElementById('profile-area');const titleNames={king:'👑 Король',lord:'🗡️ Лорд',knight:'🛡️ Лицар',hamka:'🐹 Хамка',pro:'Профі',player:'Гравець',noob:'Новачок',none:'Без титулу','летний':'🏖️ Літній','ĹÈŤOʻ':'💜 ĹÈŤOʻ'};const currentTitleName=titleNames[curTitle]||curTitle;a.innerHTML='<div class="profile-header"><div class="avatar">'+curGif+'</div><div class="name">'+userName+'</div><div class="level">'+currentTitleName+' | ⭐ Рівень '+accLvl+'</div></div><div class="profile-stats"><div class="profile-stat"><div class="value">💰 '+coins+'</div>Монети</div><div class="profile-stat"><div class="value">🟣 '+homa+'</div>Хоми</div><div class="profile-stat"><div class="value">👆 '+totalTaps+'</div>Тапів</div><div class="profile-stat"><div class="value">💪 x'+tapPow.toFixed(1)+'</div>Сила</div></div><div class="card" style="margin-top:6px"><b>🎒 Інвентар</b><br><small>Гіфки: '+myGifs.join(' ')+'</small><br><small>Титули: '+myTitles.filter(t=>t!=='none').map(t=>titleNames[t]||t).join(', ')+'</small></div>';if(currentNick)a.innerHTML+='<button class="btn btn-r btn-block btn-sm" onclick="logout()">🚪 Вийти</button>';}
function buildTop(){const a=document.getElementById('top-area');a.innerHTML='<div class="card"><b>🏆 Топ гравців (за XP)</b></div><p style="color:#888;text-align:center;font-size:9px">Завантаження...</p>';db.ref('users').orderByChild('xp').limitToLast(20).once('value').then(snap=>{const sorted=[];snap.forEach(child=>{const data=child.val();if(data&&typeof data.xp==='number') sorted.push({key:child.key,...data});});sorted.sort((a,b)=>(b.xp||0)-(a.xp||0));let h='<div class="card"><b>🏆 Топ гравців (за XP)</b></div>';if(sorted.length===0){h+='<p style="color:#888;text-align:center;font-size:9px">Немає даних</p>';}else{sorted.slice(0,20).forEach((data,i)=>{const rank=i+1;const rankClass=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';let displayName=data.name;if(!displayName) displayName=data.key.replace('nick_','').replace('tg_','').replace('guest_user','Гість');const avatar=data.avatar||'🐹';const lvl=data.lvl||1;const xpVal=data.xp||0;const medal=rank<=3?['🥇','🥈','🥉'][i]:rank;h+=`<div class="top-item"><div class="rank ${rankClass}" style="background:${rankClass?'':'#333'}">${medal}</div><div style="flex:1"><b>${avatar} ${displayName}</b><br><small style="color:#888">⭐ ${lvl} рівень | XP: ${xpVal}</small></div><div style="color:#fbbf24;font-weight:700">💰 ${data.coins||0}</div></div>`;});}a.innerHTML=h;updateTopTitles();}).catch(err=>{a.innerHTML='<div class="card"><b>🏆 Топ гравців</b></div><p style="color:#888;text-align:center;font-size:9px">Помилка завантаження</p>';console.error(err);});}
function renderStyleGifs(){const s=document.getElementById('styleGifGrid');if(!s)return;s.innerHTML=GIFS.map(g=>'<div class="gif-cell '+(curGif===g.id?'sel':'')+' '+(myGifs.includes(g.id)?'':'locked')+'" onclick="selGif(\''+g.id+'\')">'+g.e+'</div>').join('');}
function chTheme(c){document.documentElement.style.setProperty('--main',c);}
function execConsole(){const i=document.getElementById('consoleInput');const c=i.value.trim();if(!c)return;const o=document.getElementById('consoleOutput');if(!o)return;function clog(t){o.innerHTML+=t+'\n';o.scrollTop=o.scrollHeight;}clog('> '+c);if(!inv.includes('VIP')&&!isAdmin){clog('❌ Потрібен VIP');i.value='';return;}if(c=='/help')clog('/help /clear /info /neofetch /color"#f00" /rename"Ім\'я" /title <назва>');else if(c=='/clear')o.innerHTML='';else if(c=='/info')clog('💰'+coins+' 🟣'+homa+' ⭐'+tapLvl+' XP:'+accXP);else if(c=='/neofetch')clog('╔══╗\n║'+userName+'\n╚══╝\n💰'+coins+'\n🟣'+homa+'\n⭐'+accLvl+'\n👆'+totalTaps);else if(c.startsWith('/color"')){const m=c.match(/\/color"([^"]+)"/);if(m){chTheme(m[1]);clog('✅');}}else if(c.startsWith('/rename"')){const m=c.match(/\/rename"([^"]+)"/);if(m){userName=m[1];document.getElementById('userName').textContent=userName;saveG();clog('✅');}}else if(c.startsWith('/title ')){const newTitle=c.split(' ')[1];if(myTitles.includes(newTitle)){curTitle=newTitle;updAll();saveG();clog('✅ Титул змінено на '+newTitle);}else{clog('❌ У вас немає цього титулу');}}else clog('❌');i.value='';}

function shopTab(t,ev){document.querySelectorAll('#shop-res, #shop-upg, #shop-vis, #shop-box').forEach(e=>e.style.display='none');document.getElementById('shop-'+t).style.display='block';document.querySelectorAll('.shop-tab').forEach(b=>b.classList.remove('active'));if(ev&&ev.target)ev.target.classList.add('active');if(t==='vis'){renderGifShop();renderTitleShop();}}
function renderShopRes(){document.getElementById('shop-res').innerHTML=`<div class="card"><b>⚡ Енергія +50</b><br><small>💰${getPrice('maxEnergy')} | Куплено: ${buyCount.maxEnergy}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('maxEnergy')">Купити</button></div><div class="card"><b>✨ Авто XP</b><br><small>💰${getPrice('autoXP')} | Куплено: ${buyCount.autoXP}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('autoXP')">Купити</button></div><div class="card"><b>🚀 XP Бустер</b><br><small>💰300 | Без ліміту</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('xpBoost')">Купити</button></div><div class="card"><b>⚡ Авто тап</b><br><small>💰${getPrice('autoTap')} | Куплено: ${buyCount.autoTap}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('autoTap')">Купити</button></div><div class="card"><b>🔄 Регенерація +1</b><br><small>💰${getPrice('energyRegen')} | Куплено: ${buyCount.energyRegen}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('energyRegen')">Купити</button></div><div class="card homa-card"><b>🟣 Купівля Хом</b><br><small>1🟣 = 50K💰</small><br><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-g btn-sm" onclick="buyHoma(1)" style="flex:1">1🟣</button><button class="btn btn-g btn-sm" onclick="buyHoma(5)" style="flex:1">5🟣</button><button class="btn btn-g btn-sm" onclick="buyHoma(10)" style="flex:1">10🟣</button></div></div>`;}
function renderShopUpg(){document.getElementById('shop-upg').innerHTML=`<div class="card"><b>⭐ Прокачка ${tapLvl}</b><br><small>💰${getPrice('upgradeTap')} | +1 до тапу</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('upgradeTap')">Прокачати</button></div><div class="card"><b>🪙 Бустер монет</b><br><small>💰${getPrice('coinBoostB')} | x${coinBoost.toFixed(1)}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('coinBoost')">Купити</button></div><div class="card"><b>⚡ Енергія +100</b><br><small>💰${getPrice('energyUp')} | Куплено: ${buyCount.energyUp}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('energyUp')">Купити</button></div><div class="card"><b>💪 Сила +50%</b><br><small>💰${getPrice('tapPowerB')} | x${tapPow.toFixed(1)}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('tapPower')">Купити</button></div><div class="card"><b>🎯 Крит +5%</b><br><small>💰${getPrice('critChanceB')} | ${crit}%</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('critChance')">Купити</button></div><div class="card"><b>👑 VIP</b><br><small>💰20000 | Одноразово</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('vip')">Купити ${inv.includes('VIP')?'(Вже є)':''}</button></div><div class="card"><b>🍀 Удача +0.1</b><br><small>💰${getPrice('luckB')} | x${luck.toFixed(1)}</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem('luck')">Купити</button></div>`;}
function renderShopVis(){document.getElementById('shop-vis').innerHTML=`<b style="color:#00ff88;font-size:10px">🎨 Гіфки (купівля за 💰)</b><div class="gif-row" id="gifShop"></div><div class="card homa-card" style="margin-top:6px"><b>🏅 Титул "Хамка"</b><br><small>🟣 25000 | Одноразово</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyHomaTitle()">Купити ${myTitles.includes('hamka')?'(Вже є)':''}</button></div><div class="card homa-card"><b>⚔️ Гіфка "Меч"</b><br><small>🟣 15000 | Одноразово</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyHomaGif()">Купити ${myGifs.includes('⚔️')?'(Вже є)':''}</button></div><b style="color:#00ff88;font-size:10px;display:block;margin-top:6px">🏅 Титули (купівля за 💰)</b><div id="titleShop"></div>`;renderGifShop();renderTitleShop();}
function buyItem(t){ if(t==='maxEnergy'){const p=getPrice('maxEnergy');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;maxEn+=50;curEn=Math.min(curEn+50,maxEn);buyCount.maxEnergy++;} else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;autoXP++;buyCount.autoXP++;} else if(t==='xpBoost'){if(coins<300){toast('❌ 300💰');return}coins-=300;addXP(100);} else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;autoTap++;buyCount.autoTap++; boughtAutoTapToday++; updateQuestProgress(); updateMegaQuestProgress();} else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;buyCount.energyRegen++;} else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;tapLvl++;buyCount.upgradeTap++;} else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;coinBoost+=0.5;buyCount.coinBoostB++;} else if(t==='energyUp'){const p=getPrice('energyUp');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;maxEn+=100;curEn=Math.min(curEn+100,maxEn);buyCount.energyUp++;} else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;tapPow+=0.5;buyCount.tapPowerB++;} else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;crit+=5;buyCount.critChanceB++;} else if(t==='vip'){if(inv.includes('VIP')){toast('✅ Вже є!');return}if(coins<20000){toast('❌ 20000💰');return}coins-=20000;inv.push('VIP');luck=Math.min(luck+0.1,1.3);buildVip();toast('👑 VIP!');} else if(t==='luck'){const p=getPrice('luckB');if(coins<p){toast('❌ '+p+'💰');return}coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++;} updAll();saveG();toast('✅ Куплено!'); }
function buyHoma(n){const p=n*50000;if(coins<p){toast('❌ '+p+'💰');return}coins-=p;homa+=n;updAll();saveG();toast('✅ +'+n+'🟣');}
function buyHomaTitle(){if(myTitles.includes('hamka')){toast('✅ Вже є!');return}if(homa<25000){toast('❌ 25000🟣');return}homa-=25000;myTitles.push('hamka');updAll();saveG();toast('🏅 Хамка!');}
function buyHomaGif(){if(myGifs.includes('⚔️')){toast('✅ Вже є!');return}if(homa<15000){toast('❌ 15000🟣');return}homa-=15000;myGifs.push('⚔️');updAll();saveG();toast('⚔️ Меч!');}
function renderGifShop(){const s=document.getElementById('gifShop');if(!s)return;s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>myGifs.includes(g.id)?'<div class="gif-cell" style="border-color:#4b5563">'+g.e+'</div>':'<div class="gif-cell" onclick="buyGif(\''+g.id+'\')">'+g.e+'<span class="gif-price">'+(R[g.r]?.p||1000)+'</span></div>').join('');}
function buyGif(id){const g=GIFS.find(g=>g.id===id);if(!g||myGifs.includes(id))return;if(g.homa)return;const p=R[g.r]?.p||1000;if(coins<p){toast('❌ '+p+'💰');return}coins-=p;myGifs.push(id);updAll();saveG();toast('✅ '+g.e+'!'); newGifsToday++; boughtGifToday++; updateQuestProgress(); updateMegaQuestProgress();}
function renderTitleShop(){const s=document.getElementById('titleShop');if(!s)return;const a=[{id:'noob',name:'Новачок',price:50000},{id:'player',name:'Гравець',price:150000},{id:'pro',name:'Профі',price:500000}].filter(t=>!myTitles.includes(t.id));s.innerHTML=a.length===0?'<p style="color:#888;font-size:8px">✅</p>':a.map(t=>'<div class="card"><b>🏅 '+t.name+'</b><br><small>💰'+t.price+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyTitle(\''+t.id+'\')">Купити</button></div>').join('');}
function buyTitle(id){if(myTitles.includes(id))return;const prices={noob:50000,player:150000,pro:500000};const p=prices[id]||100000;if(coins<p){toast('❌ '+p+'💰');return}coins-=p;myTitles.push(id);updAll();saveG();toast('✅ Титул!'); newTitlesToday++; updateQuestProgress(); updateMegaQuestProgress();}
function selGif(id){if(!myGifs.includes(id))return;curGif=id;updAll();saveG();}

function activatePromo(){ const i=document.getElementById('promoInp'); const c=i.value.trim().toLowerCase(); if(!c)return; if(usedPromos.includes(c)){toast('❌ Використано!');return;} if(c in promos){ if(promos[c]==='admin'){ isAdmin=1; buildVip(); buildPages(); updAll(); saveG(); toast('🔧 Адмін права активовано!'); }else{ coins+=promos[c]; usedPromos.push(c); updBal(); saveG(); toast('🎁 +'+promos[c]+'💰'); } i.value=''; }else{ toast('❌ Невірний!'); } }
</script>
