<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 Hamka — Крипто-клікер</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc66;
            --bg: #07070b;
            --bg-card: #12121a;
            --border: #1e1e2e;
            --text: #e8e8f0;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --crypto: #f472b6;
            --crypto2: #fbbf24;
            --crypto3: #60a5fa;
            --gold: #fbbf24;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; touch-action:manipulation; }
        .app { width:100%; max-width:420px; height:100vh; background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }

        /* ===== AUTH SCREEN ===== */
        #authScreen { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; padding:30px 24px; background:radial-gradient(ellipse at center, #0a0a1a, #07070b); position:relative; overflow:hidden; }
        #authScreen::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle at 30% 40%, rgba(0,255,136,0.03), transparent 60%); animation:rotateBg 20s linear infinite; pointer-events:none; }
        @keyframes rotateBg { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        #authScreen .logo { font-size:80px; margin-bottom:8px; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 0 40px rgba(0,255,136,0.2)); position:relative; z-index:1; }
        @keyframes float { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-10px)} }
        #authScreen h2 { color:var(--primary); font-size:32px; font-weight:800; margin-bottom:2px; position:relative; z-index:1; text-shadow:0 0 30px rgba(0,255,136,0.15); }
        #authScreen .subtitle { color:var(--text-secondary); font-size:14px; margin-bottom:20px; position:relative; z-index:1; }

        #authScreen input {
            background:var(--bg-card);
            color:var(--text);
            border:1px solid var(--border);
            padding:16px 18px;
            border-radius:var(--radius-sm);
            width:100%;
            max-width:300px;
            margin-bottom:10px;
            text-align:center;
            font-size:16px;
            outline:none;
            transition:var(--transition);
            position:relative;
            z-index:1;
        }
        #authScreen input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,255,136,0.1); }
        #authScreen input::placeholder { color:var(--text-muted); }

        #authScreen .btn {
            width:100%;
            max-width:300px;
            padding:16px;
            margin-top:6px;
            font-size:16px;
            font-weight:700;
            border:none;
            border-radius:var(--radius-sm);
            cursor:pointer;
            transition:var(--transition);
            position:relative;
            z-index:1;
        }
        #authScreen .btn:active { transform:scale(0.97); }
        #authScreen .btn-g { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#000; box-shadow:0 0 30px rgba(0,255,136,0.2); }
        #authScreen .btn-tg { background:linear-gradient(135deg, #229ED9, #1a7ab5); color:#fff; box-shadow:0 0 30px rgba(34,158,217,0.2); font-size:17px; padding:18px; }
        #authScreen .divider { color:var(--text-muted); font-size:12px; margin:10px 0 6px; display:flex; align-items:center; gap:12px; width:100%; max-width:300px; position:relative; z-index:1; }
        #authScreen .divider::before, #authScreen .divider::after { content:''; flex:1; height:1px; background:var(--border); }
        #authScreen .error { color:#ef4444; font-size:13px; margin-top:4px; min-height:20px; text-align:center; position:relative; z-index:1; }
        #authScreen .success { color:var(--primary); font-size:13px; margin-top:4px; min-height:20px; text-align:center; position:relative; z-index:1; }

        /* ===== TOP BAR ===== */
        .top-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:rgba(18,18,26,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; gap:4px; }
        .top-bar .stat { display:flex; align-items:center; gap:4px; font-size:9px; font-weight:600; color:var(--text-secondary); padding:4px 10px; background:rgba(255,255,255,0.03); border-radius:20px; }
        .top-bar .stat .val { color:var(--text); font-size:10px; font-weight:700; }
        .top-bar .stat .gold { color:var(--gold); }
        .top-bar .stat .crypto { color:var(--crypto); }

        /* ===== TAB NAVIGATION ===== */
        .tab-nav { display:flex; gap:3px; padding:6px 8px; background:rgba(18,18,26,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; }
        .tab-nav button {
            flex:1;
            min-width:40px;
            padding:8px 4px;
            border:none;
            border-radius:var(--radius-sm);
            background:transparent;
            color:var(--text-secondary);
            font-size:9px;
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            white-space:nowrap;
            position:relative;
        }
        .tab-nav button::after { content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:0; height:2px; background:var(--primary); transition:var(--transition); border-radius:10px; }
        .tab-nav button.active { color:var(--text); background:rgba(0,255,136,0.08); }
        .tab-nav button.active::after { width:60%; }
        .tab-nav button:active { transform:scale(0.95); }
        .tab-nav button .tab-icon { font-size:14px; display:block; }
        .tab-nav button .tab-label { font-size:7px; display:block; margin-top:2px; }

        /* ===== CONTENT ===== */
        .content-area { flex:1; overflow-y:auto; padding:6px 8px; -webkit-overflow-scrolling:touch; }
        .content-area::-webkit-scrollbar { width:3px; }
        .content-area::-webkit-scrollbar-track { background:var(--bg); }
        .content-area::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }
        .page { display:none; animation:fadeSlide 0.3s ease; }
        .page.show { display:block; }
        @keyframes fadeSlide { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }

        .center-game { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100px; gap:6px; padding:6px 0; }

        /* ===== TAP CIRCLE ===== */
        .tap-circle {
            width:150px;
            height:150px;
            border-radius:50%;
            background:radial-gradient(circle at 30% 30%, #2a2a3a, #12121a);
            border:4px solid var(--primary);
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:56px;
            box-shadow:0 0 50px rgba(0,255,136,0.15), inset 0 0 50px rgba(0,255,136,0.05);
            transition:transform 0.08s linear, box-shadow 0.3s ease;
            touch-action:manipulation;
            position:relative;
        }
        .tap-circle:active { transform:scale(0.94); box-shadow:0 0 80px rgba(0,255,136,0.35); }
        .tap-circle .tap-ripple { position:absolute; border-radius:50%; border:2px solid var(--primary); animation:ripple 0.7s ease-out forwards; pointer-events:none; }
        @keyframes ripple { 0%{width:0;height:0;opacity:1} 100%{width:190px;height:190px;opacity:0} }
        .tap-balance { font-size:14px; color:var(--gold); font-weight:800; text-shadow:0 0 20px rgba(251,191,36,0.2); }

        /* ===== BARS ===== */
        .bar-wrap { width:92%; margin:3px auto; }
        .energy-bar, .xp-bar { width:100%; height:6px; background:rgba(255,255,255,0.05); border-radius:10px; overflow:hidden; }
        .energy-fill { height:100%; background:linear-gradient(90deg, #fbbf24, #f97316); border-radius:10px; transition:width 0.4s ease; }
        .xp-fill { height:100%; background:linear-gradient(90deg, var(--primary), #06b6d4); border-radius:10px; transition:width 0.4s ease; }
        .bar-label { display:flex; justify-content:space-between; font-size:7px; color:var(--text-secondary); margin-top:2px; }

        /* ===== BALANCE ===== */
        .bal { text-align:center; padding:4px; font-size:16px; font-weight:800; color:var(--gold); text-shadow:0 0 30px rgba(251,191,36,0.1); }

        /* ===== STATS ===== */
        .stats-row { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; padding:3px 0; font-size:8px; color:var(--text-secondary); }
        .stats-row .stat-item { display:flex; align-items:center; gap:3px; background:rgba(255,255,255,0.03); padding:3px 10px; border-radius:12px; }
        .stats-row .stat-item .highlight { color:var(--primary); }
        .stats-row .stat-item .gold { color:var(--gold); }

        /* ===== BUTTONS ===== */
        .btn {
            padding:8px 14px;
            border:none;
            border-radius:var(--radius-sm);
            font-weight:700;
            font-size:10px;
            cursor:pointer;
            transition:var(--transition);
            display:inline-flex;
            align-items:center;
            gap:4px;
            touch-action:manipulation;
        }
        .btn:active { transform:scale(0.95); }
        .btn-g { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#000; box-shadow:0 0 20px rgba(0,255,136,0.15); }
        .btn-g:hover { box-shadow:0 0 30px rgba(0,255,136,0.3); }
        .btn-o { background:linear-gradient(135deg, #f97316, #ea580c); color:#fff; }
        .btn-r { background:linear-gradient(135deg, #ef4444, #dc2626); color:#fff; }
        .btn-b { background:linear-gradient(135deg, #3b82f6, #2563eb); color:#fff; }
        .btn-p { background:linear-gradient(135deg, #8b5cf6, #7c3aed); color:#fff; }
        .btn-c { background:linear-gradient(135deg, var(--crypto), #db2777); color:#fff; }
        .btn-block { width:100%; justify-content:center; }
        .btn-sm { padding:4px 10px; font-size:8px; }
        .btn-lg { padding:12px 20px; font-size:12px; }
        .btn:disabled { opacity:0.4; pointer-events:none; }

        /* ===== CARDS ===== */
        .card { background:var(--bg-card); padding:8px 10px; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:6px; transition:var(--transition); }
        .card:hover { border-color:rgba(255,255,255,0.05); }
        .card .flex { display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
        .card-title { font-size:10px; font-weight:700; color:var(--text-secondary); margin-bottom:4px; }

        /* ===== TOAST ===== */
        .toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); padding:8px 20px; border-radius:30px; font-size:10px; font-weight:600; z-index:999; opacity:0; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); pointer-events:none; border:1px solid var(--primary); box-shadow:0 8px 32px rgba(0,0,0,0.5); max-width:90%; text-align:center; color:var(--text); }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ===== FLOATING ===== */
        .floating-number { position:fixed; font-size:18px; font-weight:800; pointer-events:none; z-index:1000; background:linear-gradient(135deg, var(--gold), #f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:floatUp 0.8s ease-out forwards; white-space:nowrap; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(0.8)} 30%{transform:translateY(-30px) scale(1.2)} 100%{opacity:0;transform:translateY(-70px) scale(0.6)} }
        .coin-particle { position:fixed; width:14px; height:14px; font-size:12px; pointer-events:none; z-index:999; animation:coinFly 0.6s ease-out forwards; }
        @keyframes coinFly { 0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)} 100%{opacity:0;transform:translate(var(--dx, 40px), var(--dy, -60px)) scale(0.3) rotate(360deg)} }

        /* ===== SHOP ===== */
        .shop-tabs { display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; }
        .shop-tab { flex:1; min-width:40px; padding:6px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:transparent; color:var(--text-secondary); font-size:7px; font-weight:600; cursor:pointer; text-align:center; transition:var(--transition); }
        .shop-tab.active { background:var(--primary); color:#000; border-color:var(--primary); box-shadow:0 0 20px rgba(0,255,136,0.2); }

        /* ===== INVENTORY ===== */
        .inventory-grid { display:flex; flex-wrap:wrap; gap:4px; margin:3px 0; }
        .inv-item { background:rgba(255,255,255,0.03); border-radius:var(--radius-sm); padding:4px 8px; text-align:center; min-width:40px; border:1px solid var(--border); cursor:pointer; transition:var(--transition); }
        .inv-item .icon { font-size:16px; display:block; }
        .inv-item .count { font-size:7px; color:var(--gold); }

        /* ===== GIFS ===== */
        .gif-row { display:flex; flex-wrap:wrap; gap:3px; margin:3px 0; }
        .gif-cell { width:32px; height:32px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.03); cursor:pointer; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; transition:var(--transition); }
        .gif-cell.sel { border-color:var(--primary); box-shadow:0 0 20px rgba(0,255,136,0.2); }

        /* ===== SLOT ===== */
        .slot-machine { display:flex; gap:6px; justify-content:center; margin:4px 0; }
        .slot { width:40px; height:40px; background:var(--bg); border:2px solid var(--border); border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:18px; transition:var(--transition); }
        .slot.spinning { animation:slotSpin 0.3s ease; }
        @keyframes slotSpin { 0%{transform:scale(1)} 50%{transform:scale(0.9)} 100%{transform:scale(1)} }
        .bet-row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:center; }
        .bet-row input { width:44px; text-align:center; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px; border-radius:var(--radius-sm); font-size:9px; outline:none; transition:var(--transition); }

        /* ===== PROFILE ===== */
        .profile-header { text-align:center; padding:6px; }
        .profile-header .avatar { font-size:44px; filter:drop-shadow(0 0 30px rgba(0,255,136,0.15)); }
        .profile-header .name { font-size:15px; font-weight:700; margin-top:3px; }
        .profile-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:3px; margin-top:4px; }
        .profile-stat { background:rgba(255,255,255,0.03); padding:3px; border-radius:var(--radius-sm); text-align:center; font-size:5px; color:var(--text-secondary); border:1px solid var(--border); }
        .profile-stat .value { font-size:10px; font-weight:800; color:var(--gold); }
        .profile-stat .value.crypto { color:var(--crypto); }
        .profile-stat .value.crypto2 { color:var(--crypto2); }
        .profile-stat .value.crypto3 { color:var(--crypto3); }

        /* ===== TOP ===== */
        .top-item { display:flex; align-items:center; gap:4px; padding:4px 8px; background:rgba(255,255,255,0.02); border-radius:var(--radius-sm); margin:2px 0; font-size:7px; border:1px solid var(--border); }
        .top-item .rank { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:7px; }
        .rank-1 { background:linear-gradient(135deg, #ffd700, #f59e0b); color:#000; box-shadow:0 0 20px rgba(255,215,0,0.3); }
        .rank-2 { background:linear-gradient(135deg, #c0c0c0, #9ca3af); color:#000; }
        .rank-3 { background:linear-gradient(135deg, #cd7f32, #b45309); color:#000; }

        /* ===== PROMO ===== */
        .promo-row { display:flex; gap:3px; padding:3px 8px; background:rgba(18,18,26,0.95); backdrop-filter:blur(20px); border-top:1px solid var(--border); flex-shrink:0; }
        .promo-row input { flex:1; background:var(--bg-card); color:var(--text); border:1px solid var(--border); padding:4px 10px; border-radius:var(--radius-sm); font-size:8px; outline:none; transition:var(--transition); }

        /* ===== CRYPTO ===== */
        .crypto-card { background:linear-gradient(135deg, rgba(26,26,46,0.9), rgba(18,18,26,0.9)); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; margin-bottom:4px; }
        .crypto-card .flex { display:flex; justify-content:space-between; align-items:center; }
        .crypto-card .symbol { font-size:14px; font-weight:800; }
        .crypto-card .price { font-size:12px; font-weight:800; color:var(--text); }
        .crypto-card .change { font-size:9px; font-weight:700; }
        .crypto-card .change.up { color:var(--primary); }
        .crypto-card .change.down { color:#ef4444; }

        /* ===== CHART ===== */
        .chart-container { background:var(--bg-card); border-radius:var(--radius); padding:6px; border:1px solid var(--border); margin-bottom:4px; }
        .chart-container canvas { width:100% !important; height:80px !important; border-radius:var(--radius-sm); }
        .chart-stats { display:flex; justify-content:space-between; font-size:6px; color:var(--text-secondary); padding:2px 4px; }

        /* ===== MARKET ===== */
        .market-item { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); padding:4px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:3px; }
        .market-item .info .name { font-size:8px; font-weight:600; }
        .market-item .info .desc { font-size:5px; color:var(--text-secondary); }
        .market-item .price { color:var(--gold); font-weight:700; font-size:8px; }

        /* ===== TRADER ===== */
        .trader-card { background:linear-gradient(135deg, rgba(26,26,46,0.9), rgba(18,18,26,0.9)); border:1px solid var(--border); border-radius:var(--radius); padding:6px 8px; margin-bottom:4px; }
        .trader-card .name { font-size:9px; font-weight:700; color:var(--crypto); }
        .trader-card .items { display:flex; gap:3px; flex-wrap:wrap; margin:3px 0; }
        .trader-item { background:rgba(255,255,255,0.03); padding:3px 6px; border-radius:var(--radius-sm); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:1px; }
        .trader-item .icon { font-size:14px; }
        .trader-item .price { font-size:5px; color:var(--crypto); }

        /* ===== UPGRADER ===== */
        .upgrader-container { display:flex; gap:6px; justify-content:center; align-items:stretch; padding:8px; background:rgba(18,18,26,0.8); border-radius:var(--radius); margin-bottom:6px; border:1px solid var(--border); }
        .upgrader-card { flex:1; background:rgba(255,255,255,0.02); border-radius:var(--radius-sm); padding:6px 4px; text-align:center; border:1px solid var(--border); transition:var(--transition); cursor:pointer; }
        .upgrader-card .icon-wrap { width:40px; height:40px; margin:0 auto 3px; background:var(--bg); border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:24px; border:2px solid var(--border); transition:var(--transition); }
        .upgrader-card.selected .icon-wrap { border-color:var(--primary); box-shadow:0 0 30px rgba(0,255,136,0.15); }
        .upgrader-card .item-name { font-size:7px; font-weight:600; color:var(--text); }
        .upgrader-card .item-price { font-size:6px; color:var(--gold); background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:12px; display:inline-block; margin-top:2px; }
        .upgrader-center { flex:0.5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:rgba(255,255,255,0.02); border-radius:var(--radius-sm); padding:8px 6px; border:1px solid var(--border); }
        .chance-value { font-size:20px; font-weight:800; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .chance-label { font-size:6px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; }
        .upgrade-btn { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); border:none; padding:8px 16px; font-size:10px; font-weight:800; color:#000; border-radius:30px; cursor:pointer; width:100%; transition:var(--transition); }
        .upgrade-btn.disabled { opacity:0.4; pointer-events:none; }

        /* ===== TITLES ===== */
        .title-cyber { color:#0f0; text-shadow:0 0 5px #0f0; font-weight:800; }
        .title-neon { background:linear-gradient(45deg,#ff00cc,#3333ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .title-gold { background:linear-gradient(135deg,#ffd700,#ffaa00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .title-legendary { background:linear-gradient(135deg,#ffd700,#ff8c00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-weight:800; }

        /* ===== RESPONSIVE ===== */
        @media (max-width:400px) {
            .tap-circle { width:120px; height:120px; font-size:44px; }
            .bal { font-size:14px; }
            .top-bar .stat { font-size:7px; padding:2px 6px; }
            .tab-nav button { font-size:7px; padding:6px 2px; }
            .tab-nav button .tab-icon { font-size:12px; }
            .tab-nav button .tab-label { font-size:6px; }
            .upgrader-container { flex-direction:column; }
            .upgrader-center { flex-direction:row; padding:6px; }
            .chance-value { font-size:16px; }
            .profile-stats { grid-template-columns:1fr 1fr 1fr; }

// ============================================================
//  🔧 HELPERS
// ============================================================
function rand(a,b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function clamp(v,a,b) { return Math.max(a, Math.min(b, v)); }

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 2500);
}

function formatNum(n) {
    if (n < 1000) return Math.floor(n).toString();
    if (n < 1e6) return (n/1e3).toFixed(1) + 'K';
    if (n < 1e9) return (n/1e6).toFixed(1) + 'M';
    if (n < 1e12) return (n/1e9).toFixed(1) + 'B';
    return (n/1e12).toFixed(1) + 'T';
}

function getLevelReward(l) {
    for (let i = 0; i < LEVELS.length; i++) {
        if (LEVELS[i].l === l) return LEVELS[i].rw;
    }
    return 0;
}

function calcMaxEnergy() {
    return 100 + G.upgrades.maxEnergy * 50 + G.upgrades.energyUp * 100;
}

function calcTapIncome() {
    let base = G.tapLevel + G.upgrades.tapLevel;
    let powerMul = 1 + G.upgrades.tapPower * 0.5;
    let boost = G.coinBoost * (1 + G.upgrades.coinBoost * 0.5);
    let inc = (rand(1,5) + base) * boost * powerMul;
    let critChance = G.crit + G.upgrades.critChance * 0.05;
    if (Math.random() < critChance) {
        inc *= 2;
        toast('💥 КРИТ! x2');
    }
    return Math.floor(inc);
}

function hasGif(id) { return G.ownedGifs[id] && G.ownedGifs[id] > 0; }
function getGifCount(id) { return G.ownedGifs[id] || 0; }
function addGif(id, n=1) { G.ownedGifs[id] = (G.ownedGifs[id] || 0) + n; }
function hasTitle(id) { return G.ownedTitles[id] && G.ownedTitles[id] > 0; }
function addTitle(id, n=1) { G.ownedTitles[id] = (G.ownedTitles[id] || 0) + n; }

function getTitleDisplay(id) {
    const t = TITLES[id] || {name:id, color:'#fff', class:''};
    if (t.class) return `<span class="${t.class}">${t.name}</span>`;
    return `<span style="color:${t.color}">${t.name}</span>`;
}

function saveGame() {
    if (!G.uid) {
        try {
            const data = {...G};
            delete data.cryptoHistory;
            localStorage.setItem('hamka_guest_save', JSON.stringify(data));
        } catch(e) {}
        return;
    }
    G.lastSave = Date.now();
    const data = {...G};
    db.ref('users/' + G.uid).set(data).catch(e => console.warn('Save error:', e));
    updatePublicProfile();
}

function loadGame(data) {
    if (!data) return;
    Object.keys(data).forEach(key => {
        if (key === 'creatorData') {
            Object.assign(G.creatorData, data.creatorData);
        } else if (key === 'upgrades') {
            Object.assign(G.upgrades, data.upgrades);
        } else if (key === 'ownedGifs') {
            G.ownedGifs = data.ownedGifs || {'🐹':1};
        } else if (key === 'ownedTitles') {
            G.ownedTitles = data.ownedTitles || {'none':1};
        } else if (key === 'chests') {
            G.chests = data.chests || {};
        } else if (key === 'upgradeInventory') {
            G.upgradeInventory = data.upgradeInventory || {"figurine_durov":1};
        } else if (key === 'inv') {
            G.inv = data.inv || [];
        } else if (key === 'marketListings') {
            G.marketListings = data.marketListings || [];
        } else if (key === 'cryptoHistory') {
            G.cryptoHistory = data.cryptoHistory || { HAM: [], HAMG: [], HAMC: [] };
        } else if (key === 'crypto') {
            G.crypto = data.crypto || { HAM: 0, HAMG: 0, HAMC: 0 };
        } else if (key === 'cryptoRate') {
            G.cryptoRate = data.cryptoRate || { HAM: 0.001, HAMG: 0.0005, HAMC: 0.0002 };
        } else {
            G[key] = data[key];
        }
    });
    G.maxEnergy = calcMaxEnergy();
    G.energy = Math.min(G.energy, G.maxEnergy);
    G.name = G.name || 'Гравець';
    checkLevelUp();
    updateUI();
}

function updatePublicProfile() {
    if (!G.uid) return;
    db.ref('public_users/' + G.uid).set({
        name: G.name,
        level: G.level,
        xp: G.xp,
        avatar: G.activeGif,
        title: G.activeTitle,
        totalTaps: G.totalTaps,
        homa: G.homa,
        kreita: G.kreita,
        crypto: G.crypto,
        hideFromTop: G.hideFromTop || false,
        lastUpdate: Date.now()
    }).catch(e => console.warn('Public update error:', e));
}

// ============================================================
//  ⭐ XP & LEVEL
// ============================================================
function addXP(amount) {
    G.xp += amount;
    checkLevelUp();
    updateUI();
}

function checkLevelUp() {
    let lvl = 1;
    for (let i = LEVELS.length-1; i >= 0; i--) {
        if (G.xp >= LEVELS[i].x) { lvl = LEVELS[i].l; break; }
    }
    if (lvl > G.level) {
        let reward = 0;
        for (let i = G.level + 1; i <= lvl; i++) {
            reward += getLevelReward(i);
        }
        G.coins += reward;
        toast(`🎉 Рівень ${lvl}! +${reward}💰`);
        G.level = lvl;
    } else {
        G.level = lvl;
    }
}

    const cur = LEVELS.find(l => l.l === G.level) || LEVELS[0];
    const next = LEVELS.find(l => l.l === G.level + 1) || cur;
    const prog = ((G.xp - cur.x) / (next.x - cur.x)) * 100;
    document.getElementById('xpFill').style.width = Math.min(100, prog) + '%';

    document.getElementById('autoTapDisp').textContent = G.autoTap;
    document.getElementById('regenPerSec').textContent = G.energyRegen + G.upgrades.energyRegen;

function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    updateUI();
    buildPages();

    setInterval(() => {
        updateCryptoRates();
    }, 5000);

    setInterval(() => {
        let regen = G.energyRegen + G.upgrades.energyRegen;
        G.energy = Math.min(G.maxEnergy, G.energy + regen);
        if (G.autoTap > 0) G.coins += G.autoTap;
        if (G.autoXP > 0) addXP(G.autoXP);

        let now = Date.now();
        if (now - G.lastTimeReward >= 300000) {
            G.lastTimeReward = now;
            G.coins += 500;
            toast('⏰ +500 монет');
        }
        updateUI();
        saveGame();
    }, 1000);

    saveGame();
    toast('🐹 Ласкаво просимо до Hamka!');
}

// ============================================================
//  🐹 TAP
// ============================================================
function handleTap(e) {
    e.preventDefault();
    if (G.energy < 1) {
        toast('⚡ Немає енергії! Зачекай.');
        return;
    }
    let x = e.clientX || e.touches?.[0]?.clientX || window.innerWidth/2;
    let y = e.clientY || e.touches?.[0]?.clientY || window.innerHeight/2;
    G.energy--;
    const inc = calcTapIncome();
    G.coins += inc;
    G.taps++;
    G.totalTaps++;
    addXP(1);
    G.kreita += Math.floor(inc / 10) + 1;
    if (G.totalTaps % 30 === 0) {
        G.crypto.HAM = (G.crypto.HAM || 0) + 0.02;
        toast('₿ +0.02 HAM за 30 тапів!');
    }
    if (G.totalTaps % 100 === 0) {
        G.crypto.HAMG = (G.crypto.HAMG || 0) + 0.01;
        toast('🪙 +0.01 HAMG за 100 тапів!');
    }
    if (G.totalTaps % 200 === 0) {
        G.crypto.HAMC = (G.crypto.HAMC || 0) + 0.005;
        toast('💎 +0.005 HAMC за 200 тапів!');
    }
    if (G.totalTaps % 100 === 0) {
        G.eventHoma += 1;
        toast('🌸 +1 івенхом за 100 тапів!');
    }
    updateUI();
    showTapAnimation(x, y, inc);
    if (G.taps % 10 === 0) saveGame();
}

function showTapAnimation(x, y, amount) {
    const num = document.createElement('div');
    num.className = 'floating-number';
    num.textContent = '+' + amount + '💰';
    num.style.left = (x - 20) + 'px';
    num.style.top = (y - 30) + 'px';
    document.body.appendChild(num);
    setTimeout(() => num.remove(), 800);
    for (let i = 0; i < 5; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin-particle';
        coin.textContent = ['💰', '🪙', '✨', '💎', '🌟'][rand(0,4)];
        const angle = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 50;
        coin.style.left = (x - 10) + 'px';
        coin.style.top = (y - 10) + 'px';
        coin.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        coin.style.setProperty('--dy', (Math.sin(angle) * dist - 30) + 'px');
        document.body.appendChild(coin);
        setTimeout(() => coin.remove(), 600);
    }
    const btn = document.getElementById('tapBtn');
    if (btn) {
        const ripple = document.createElement('div');
        ripple.className = 'tap-ripple';
        ripple.style.left = '50%';
        ripple.style.top = '50%';
        ripple.style.transform = 'translate(-50%, -50%)';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
    }
}

let currentGame = 'tap';

function openGame(g) {
    currentGame = g;
    const a = document.getElementById('game-area');
    if (g === 'tap') {
        a.innerHTML = `<div class="center-game">
            <div class="tap-balance">🪙 <span id="tapBalance">${formatNum(G.coins)}</span></div>
            <div class="tap-circle" id="tapBtn">${G.activeGif}</div>
        </div>`;
        const btn = document.getElementById('tapBtn');
        if (btn) {
            btn.onclick = handleTap;
            btn.ontouchstart = handleTap;
        }
    } else if (g === 'casino') {
        a.innerHTML = `<div class="center-game"><h3 style="color:var(--primary);font-size:13px;">🎰 Казино</h3>
            <div class="slot-machine">
                <div class="slot" id="s1">🍒</div>
                <div class="slot" id="s2">🍋</div>
                <div class="slot" id="s3">🍉</div>
            </div>
            <div class="bet-row">
                <button class="btn btn-g btn-sm" onclick="document.getElementById('bet').value=Math.max(1,parseInt(document.getElementById('bet').value||10)-10)">−</button>
                <input type="number" id="bet" value="10">
                <button class="btn btn-g btn-sm" onclick="document.getElementById('bet').value=parseInt(document.getElementById('bet').value||10)+10">+</button>
            </div>
            <button class="btn btn-o btn-lg" onclick="spinSlot()">🎰 КРУТИТИ</button></div>`;
    } else if (g === 'upgrader') {
        renderUpgrader();
    } else if (g === 'boss') {
        renderBosses();
    } else if (g === 'event') {
        renderEvent();
    }
}

// ============================================================
//  🎰 CASINO
// ============================================================
function spinSlot() {
    let bet = parseInt(document.getElementById('bet')?.value) || 0;
    if (!bet || bet < 1) { toast('Введіть ставку >0'); return; }
    if (G.coins < bet) { toast('❌ Не вистачає монет'); return; }
    G.coins -= bet;
    const sym = ['🍒','🍋','🍉','⭐','7️⃣','💎'];
    let r1 = sym[rand(0,5)], r2 = sym[rand(0,5)], r3 = sym[rand(0,5)];
    document.querySelectorAll('.slot').forEach(el => el.classList.add('spinning'));
    setTimeout(() => {
        document.querySelectorAll('.slot').forEach(el => el.classList.remove('spinning'));
    }, 300);
    document.getElementById('s1').textContent = r1;
    document.getElementById('s2').textContent = r2;
    document.getElementById('s3').textContent = r3;
    let win = 0;
    if (r1 === r2 && r2 === r3) win = bet * 3;
    else if (r1 === r2 || r2 === r3 || r1 === r3) win = Math.floor(bet * 1.5);
    win = Math.floor(win * G.luck);
    G.coins += win;
    if (win > 0) {
        addXP(Math.floor(win / 5));
        toast(`🎉 Виграш! +${win}💰`);
    } else {
        toast(`😢 Програш -${bet}💰`);
    }
    updateUI();
    saveGame();
}

// ============================================================
//  🔧 UPGRADER (З ВИКОРИСТАННЯМ ГІФОК)
// ============================================================
function renderUpgrader() {
    const inItem = G.selectedItemIn ? UPGRADE_ITEMS.find(i => i.id === G.selectedItemIn) : null;
    const outItem = G.selectedItemOut ? UPGRADE_ITEMS.find(i => i.id === G.selectedItemOut) : null;
    let chance = 0;
    if (inItem && outItem) {
        chance = Math.min(100, (inItem.price / outItem.price) * 100);
    }
    
    // Отримуємо гіфки для відображення
    const gifKeys = Object.keys(G.ownedGifs);
    const gifDisplay = gifKeys.slice(0, 6).map(id => 
        `<div class="gif-cell" style="border-color:${G.activeGif === id ? 'var(--primary)' : 'var(--border)'};" onclick="G.activeGif='${id}';renderUpgrader();updateUI();">${id}</div>`
    ).join('');
    
    let html = `<div class="upgrader-container">
        <div class="upgrader-card ${inItem ? 'selected' : ''}" onclick="if(!inItem)G.selectedItemIn=null;renderUpgrader()">
            <div class="icon-wrap">${inItem ? inItem.image : '➕'}</div>
            <div class="item-name">${inItem ? inItem.name : 'Оберіть предмет'}</div>
            <div class="item-price">${inItem ? '$' + inItem.price.toLocaleString() : '—'}</div>
            ${inItem ? `<div style="font-size:6px;color:var(--text-secondary);margin-top:2px;">${inItem.rarity}</div>` : ''}
        </div>
        <div class="upgrader-center">
            <div><div class="chance-value">${chance.toFixed(0)}%</div><div class="chance-label">Шанс</div></div>
            <button class="upgrade-btn ${!inItem || !outItem ? 'disabled' : ''}" onclick="performUpgrade()">🚀</button>
        </div>
        <div class="upgrader-card ${outItem ? 'selected' : ''}" onclick="if(!outItem)G.selectedItemOut=null;renderUpgrader()">
            <div class="icon-wrap">${outItem ? outItem.image : '❓'}</div>
            <div class="item-name">${outItem ? outItem.name : 'Бажаний'}</div>
            <div class="item-price">${outItem ? '$' + outItem.price.toLocaleString() : '—'}</div>
            ${outItem ? `<div style="font-size:6px;color:var(--text-secondary);margin-top:2px;">${outItem.rarity}</div>` : ''}
        </div>
    </div>
    <div class="card"><div class="card-title">🎁 Ваші предмети</div><div class="inventory-grid">`;
    for (let [id, count] of Object.entries(G.upgradeInventory)) {
        if (count > 0) {
            const item = UPGRADE_ITEMS.find(i => i.id === id);
            if (item) {
                html += `<div class="inv-item ${G.selectedItemIn === id ? 'selected' : ''}" onclick="G.selectedItemIn='${id}';renderUpgrader()">
                    <span class="icon">${item.image}</span>
                    <span class="count">x${count}</span>
                    <span class="name">${item.name.slice(0,5)}</span>
                </div>`;
            }
        }
    }
    html += `</div></div>
    <div class="card"><div class="card-title">🎯 Бажані предмети</div><div class="inventory-grid">`;
    UPGRADE_ITEMS.forEach(item => {
        html += `<div class="inv-item ${G.selectedItemOut === item.id ? 'selected' : ''}" onclick="G.selectedItemOut='${item.id}';renderUpgrader()">
            <span class="icon">${item.image}</span>
            <span class="name">${item.name.slice(0,5)}</span>
        </div>`;
    });
    html += `</div></div>
    <div class="card"><div class="card-title">🎨 Ваші гіфки</div><div class="gif-row">${gifDisplay}</div>
    <div style="font-size:8px;color:var(--text-secondary);margin-top:4px;">Активна: ${G.activeGif}</div>
    </div>`;
    document.getElementById('game-area').innerHTML = html;
}

function performUpgrade() {
    if (!G.selectedItemIn || !G.selectedItemOut) { toast('Виберіть предмети'); return; }
    if (!G.upgradeInventory[G.selectedItemIn] || G.upgradeInventory[G.selectedItemIn] <= 0) {
        toast('Немає предмета');
        return;
    }
    const inItem = UPGRADE_ITEMS.find(i => i.id === G.selectedItemIn);
    const outItem = UPGRADE_ITEMS.find(i => i.id === G.selectedItemOut);
    if (!inItem || !outItem) return;
    
    const btn = document.querySelector('.upgrade-btn');
    if (btn) {
        btn.style.transform = 'scale(0.9)';
        btn.style.opacity = '0.6';
        btn.textContent = '⏳';
        setTimeout(() => {
            btn.style.transform = 'scale(1)';
            btn.style.opacity = '1';
            btn.textContent = '🚀';
        }, 400);
    }
    
    let chance = Math.min(100, (inItem.price / outItem.price) * 100);
    setTimeout(() => {
        if (Math.random() * 100 <= chance) {
            G.upgradeInventory[G.selectedItemIn]--;
            if (G.upgradeInventory[G.selectedItemIn] === 0) delete G.upgradeInventory[G.selectedItemIn];
            G.upgradeInventory[G.selectedItemOut] = (G.upgradeInventory[G.selectedItemOut] || 0) + 1;
            toast('✅ Успіх! +' + outItem.name);
            G.crypto.HAM = (G.crypto.HAM || 0) + 0.5;
            // Додаємо випадкову гіфку за успіх
            const randGif = GIFS[rand(0, GIFS.length-1)];
            addGif(randGif.id);
            toast('🎨 +' + randGif.id + ' за успіх!');
        } else {
            G.upgradeInventory[G.selectedItemIn]--;
            if (G.upgradeInventory[G.selectedItemIn] === 0) delete G.upgradeInventory[G.selectedItemIn];
            toast('❌ Невдача! Предмет згорів');
        }
        G.selectedItemIn = null;
        G.selectedItemOut = null;
        saveGame();
        renderUpgrader();
        updateUI();
    }, 500);
}

// ============================================================
//  🐉 BOSSES
// ============================================================
function fightBoss(idx) {
    const b = BOSSES[idx];
    if (b.cost > 0 && G.homa < b.cost) { toast(`❌ Потрібно ${b.cost}🟣`); return; }
    if (b.id === 0 && Date.now() - G.lastFreeBoss < 600000) {
        toast(`⏳ ${Math.ceil((600000-(Date.now()-G.lastFreeBoss))/60000)} хв`);
        return;
    }
    if (b.cost > 0) G.homa -= b.cost;
    if (b.id === 0) G.lastFreeBoss = Date.now();
    toast('⚔️ Битва...');
    setTimeout(() => {
        let chance = b.chance + (G.level - 1) * 0.03 + (G.luck - 1) * 0.05 + G.upgrades.luckB * 0.1;
        chance = clamp(chance, 0.05, 0.85);
        if (Math.random() < chance) {
            if (b.rewardMin > 0) {
                let reward = rand(b.rewardMin, b.rewardMax);
                G.homa += reward;
                toast(`🎉 Перемога! +${reward}🟣`);
            } else {
                let rew = ['gif','homa','title','chest','kreita','crypto','eventHoma'][rand(0,6)];
                if (rew === 'gif') {
                    let av = GIFS.filter(g => !g.id.includes('⚔️'));
                    let g = av[rand(0, av.length-1)];
                    addGif(g.id);
                    toast('🎨 +' + g.id);
                } else if (rew === 'homa') {
                    let a = rand(10, 50);
                    G.homa += a;
                    toast('🟣 +' + a + ' Хом');
                } else if (rew === 'kreita') {
                    let a = rand(20, 70);
                    G.kreita += a;
                    toast('🔥 +' + a + ' Крейтів');
                } else if (rew === 'crypto') {
                    let types = ['HAM', 'HAMG', 'HAMC'];
                    let type = types[rand(0,2)];
                    let a = rand(1, 10) / 100;
                    G.crypto[type] = (G.crypto[type] || 0) + a;
                    toast(`₿ +${a.toFixed(2)} ${type}`);
                } else if (rew === 'eventHoma') {
                    let a = rand(1, 5);
                    G.eventHoma += a;
                    toast(`🌸 +${a} івенхомів`);
                } else if (rew === 'title') {
                    let titles = ['king','lord','knight','hamka','pro','player','noob','cyber','neon','cosmic','void','fire','ice','letniy','sunny','leto'];
                    let nt = titles[rand(0, titles.length-1)];
                    addTitle(nt);
                    toast('🏅 Титул ' + (TITLES[nt]?.name || nt));
                } else {
                    let ct = ['common','rare','epic','mythic'][rand(0,3)];
                    G.chests[ct] = (G.chests[ct] || 0) + 1;
                    toast('🎁 Ящик ' + ct);
                }
            }
        } else {
            toast('💀 Поразка...');
        }
        saveGame();
        renderBosses();
        updateUI();
    }, 1500);
}

function renderBosses() {
    let html = '<div class="center-game"><h3 style="color:var(--primary);font-size:13px;">🐉 БОСИ</h3>';
    BOSSES.forEach((b, i) => {
        let cd = b.id === 0 ? Math.max(0, Math.ceil((600000-(Date.now()-G.lastFreeBoss))/60000)) : 0;
        let label = b.id === 0 ? (cd>0 ? '⏳ '+cd+'хв' : 'Безкоштовно') : b.cost + '🟣';
        let canFight = b.id === 0 ? cd === 0 : G.homa >= b.cost;
        html += `<div class="card" style="width:100%;">
            <div class="flex"><b>${b.name}</b> <span style="color:var(--text-secondary);font-size:6px;">${label}</span>
            <button class="btn ${canFight?'btn-o':'btn-sm'}" onclick="fightBoss(${i})" ${!canFight?'disabled':''}>⚔️</button></div>
        </div>`;
    });
    html += '</div>';
    document.getElementById('game-area').innerHTML = html;
}

function renderEvent() {
    document.getElementById('game-area').innerHTML = `
        <div class="center-game"><h3 style="color:#ec4899;font-size:13px;">🌸 Літній бум</h3>
            <div class="card"><b>🪙 Івенхоми:</b> ${G.eventHoma.toFixed(2)}</div>
            <div class="card"><b>📦 Івенхоум</b> (1)<br><button class="btn btn-o btn-sm" onclick="openEventChest(1)">Відкрити</button></div>
            <div class="card"><b>📦 Великий івенхоум</b> (10)<br><button class="btn btn-o btn-sm" onclick="openEventChest(10)">Відкрити</button></div>
            <div class="card"><button class="btn btn-b btn-sm" onclick="tapEventHoma()">⚡ Тапнути (+0.25)</button><br><small>Раз на 5 сек</small></div>
        </div>
    `;
}

function tapEventHoma() {
    let now = Date.now();
    if (now - G.eventTapCooldown < 5000) {
        toast(`⏳ ${Math.ceil((5000-(now-G.eventTapCooldown))/1000)} сек`);
        return;
    }
    G.eventTapCooldown = now;
    G.eventHoma += 0.25;
    toast('+0.25 івенхома');
    updateUI();
    saveGame();
    renderEvent();
}

function openEventChest(cost) {
    if (G.eventHoma < cost) { toast('❌ Не вистачає івенхом'); return; }
    G.eventHoma -= cost;
    let r = Math.random(), msg = '';
    if (cost === 1) {
        if (r < 0.34) { G.homa += 5; msg = '5 хом'; }
        else if (r < 0.6) { G.homa += 20; msg = '20 хом'; }
        else if (r < 0.75) { addGif('☀️'); msg = 'гіфка ☀️'; }
        else if (r < 0.85) { addGif('🏖️'); msg = 'гіфка 🏖️'; }
        else if (r < 0.95) { addTitle('letniy'); msg = 'титул летний'; }
        else if (r < 0.99) { G.homa += 150; msg = '150 хом'; }
        else { addTitle('leto'); msg = 'титул ĹÈŤO'; }
    } else {
        if (r < 0.2) { G.homa += 50; msg = '50 хом'; }
        else if (r < 0.4) { G.homa += 150; msg = '150 хом'; }
        else if (r < 0.55) { addGif('☀️'); msg = 'гіфка ☀️'; }
        else if (r < 0.7) { addGif('🏖️'); msg = 'гіфка 🏖️'; }
        else if (r < 0.85) { addTitle('letniy'); msg = 'титул летний'; }
        else if (r < 0.95) { G.homa += 500; msg = '500 хом'; }
        else if (r < 0.997) { addTitle('leto'); msg = 'титул ĹÈŤO'; }
        else { addTitle('sunny'); msg = 'титул сонячний'; }
    }
    toast('🎁 ' + msg);
    updateUI();
    saveGame();
    renderEvent();
}

        <div class="shop-tabs">
            <button class="shop-tab active" onclick="renderShopRes()">⚡ Ресурси</button>
            <button class="shop-tab" onclick="renderShopUpg()">⭐ Прокачка</button>
            <button class="shop-tab" onclick="renderShopVis()">🎨 Візуальне</button>
            <button class="shop-tab" onclick="renderShopBox()">📦 Ящики</button>
            <button class="shop-tab" onclick="renderMarket()">🏪 Ринок</button>
        </div>
        <div id="shop-inner"></div>
    `;
    renderShopRes();
}

function getPrice(item) {
    const base = {maxEnergy:2000, autoXP:5000, energyRegen:15000, tapLevel:1000, coinBoost:5000, energyUp:5000, tapPower:15000, critChance:10000, luckB:3000};
    const mult = {maxEnergy:1.5, autoXP:2, energyRegen:2.5, tapLevel:1.8, coinBoost:2, energyUp:1.8, tapPower:2.5, critChance:2, luckB:2};
    if (item === 'autoTap') return 1500 + (G.upgrades.autoTap || 0) * 800;
    if (item === 'tapLevel') return Math.floor(base.tapLevel * Math.pow(mult.tapLevel, G.upgrades.tapLevel || 0));
    return Math.floor((base[item] || 1000) * Math.pow((mult[item] || 1.5), (G.upgrades[item] || 0)));
}

function buyItem(item) {
    const p = getPrice(item);
    if (G.coins < p) { toast('❌ Не вистачає монет'); return; }
    G.coins -= p;
    if (item === 'maxEnergy') { G.maxEnergy += 50; G.energy += 50; G.upgrades.maxEnergy++; }
    else if (item === 'autoXP') { G.autoXP++; G.upgrades.autoXP++; }
    else if (item === 'xpBoost') { addXP(100); }
    else if (item === 'autoTap') {
        if (G.autoTap >= 10) { toast('Макс 10'); return; }
        G.autoTap++; G.upgrades.autoTap++;
    } else if (item === 'energyRegen') { G.upgrades.energyRegen++; }
    else if (item === 'tapLevel') { G.upgrades.tapLevel++; }
    else if (item === 'coinBoost') { G.upgrades.coinBoost++; }
    else if (item === 'energyUp') { G.maxEnergy += 100; G.energy += 100; G.upgrades.energyUp++; }
    else if (item === 'tapPower') { G.upgrades.tapPower++; }
    else if (item === 'critChance') { G.upgrades.critChance++; }
    else if (item === 'luckB') { G.upgrades.luckB++; }
    else if (item === 'vip') {
        if (G.vip) { toast('Вже є'); return; }
        G.vip = true;
        G.inv.push('VIP');
        G.luck = Math.min(G.luck + 0.1, 1.3);
    }
    toast('✅ Куплено!');
    updateUI();
    saveGame();
    renderShop();
}

function buyHoma(n) {
    let cost = n * 50000;
    if (G.coins >= cost) {
        G.coins -= cost;
        G.homa += n;
        toast('✅ +' + n + '🟣');
        updateUI();
        saveGame();
        renderShop();
    } else {
        toast('❌ Мало монет');
    }
}

function buyGif(id) {
    const g = GIFS.find(x => x.id === id);
    if (!g || hasGif(id)) return;
    const price = RARITY_PRICES[g.r] || 1000;
    if (G.coins >= price) {
        G.coins -= price;
        addGif(id);

function listMarketItem() {
    const select = document.getElementById('marketItemSelect');
    const priceInput = document.getElementById('marketPriceInput');
    const itemId = select.value;
    const price = parseFloat(priceInput.value);
    
    if (!itemId) { toast('Виберіть предмет'); return; }
    if (!price || price <= 0) { toast('Введіть ціну >0'); return; }
    if (!G.upgradeInventory[itemId] || G.upgradeInventory[itemId] <= 0) {
        toast('У вас немає цього предмета');
        return;
    }
    
    G.upgradeInventory[itemId]--;
    if (G.upgradeInventory[itemId] === 0) delete G.upgradeInventory[itemId];
    
    G.marketListings.push({
        itemId: itemId,
        price: price,
        seller: G.name,
        time: Date.now()
    });
    
    toast('✅ Лот виставлено на ринок');
    saveGame();
    renderMarket();
}

function buyMarketItem(idx) {
    const item = G.marketListings[idx];
    if (!item) { toast('Лот вже продано'); return; }
    if ((G.crypto.HAM || 0) < item.price) { toast(`❌ Потрібно ₿ ${item.price.toFixed(2)}`); return; }
    
    G.crypto.HAM -= item.price;
    G.upgradeInventory[item.itemId] = (G.upgradeInventory[item.itemId] || 0) + 1;
    G.marketListings.splice(idx, 1);
    
    toast(`✅ Куплено ${UPGRADE_ITEMS.find(i => i.id === item.itemId)?.name || item.itemId}`);
    saveGame();
    renderMarket();
    updateUI();
}

function buyFromTrader(traderId, itemId) {
    const trader = G.traders.find(t => t.id === traderId);
    if (!trader) return;
    const item = UPGRADE_ITEMS.find(i => i.id === itemId);
    if (!item) return;
    const price = Math.floor((item.price / 1000000) * trader.multiplier) + 0.1;
    if ((G.crypto[trader.crypto] || 0) < price) {
        toast(`❌ Потрібно ${price.toFixed(2)} ${trader.crypto}`);
        return;
    }
    G.crypto[trader.crypto] -= price;
    G.upgradeInventory[itemId] = (G.upgradeInventory[itemId] || 0) + 1;
    toast(`✅ Куплено ${item.name} за ${price.toFixed(2)} ${trader.crypto}`);
    saveGame();
    renderMarket();
    updateUI();
}

function updateCryptoRates() {
    const cryptoKeys = ['HAM', 'HAMG', 'HAMC'];
    cryptoKeys.forEach(key => {
        let change = (Math.random() - 0.48) * 0.0003;
        let newRate = G.cryptoRate[key] + change;
        newRate = Math.max(0.0001, Math.min(0.005, newRate));
        G.cryptoRate[key] = newRate;
        G.cryptoHistory[key].push({time: Date.now(), rate: G.cryptoRate[key]});
        if (G.cryptoHistory[key].length > 60) G.cryptoHistory[key].shift();
    });
    document.getElementById('cryptoRateDisp').textContent = G.cryptoRate.HAM.toFixed(6);
    saveGame();
    if (document.getElementById('cryptoChart')) drawChart();
}

function drawChart() {
    const canvas = document.getElementById('cryptoChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width || 300;
    const h = canvas.height || 80;
    canvas.width = w;
    canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    const data = G.cryptoHistory.HAM || [];
    if (data.length < 2) {
        ctx.fillStyle = '#555';
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Немає даних', w/2, h/2);
        return;
    }
    const min = Math.min(...data.map(d => d.rate));
    const max = Math.max(...data.map(d => d.rate));
    const range = max - min || 0.001;
    const padding = 8;
    const graphW = w - padding * 2;
    const graphH = h - padding * 2;
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(0, 255, 136, 0.25)');
    grad.addColorStop(1, 'rgba(0, 255, 136, 0.02)');
    ctx.beginPath();
    data.forEach((d, i) => {
        const x = padding + (i / (data.length - 1)) * graphW;
        const y = padding + graphH - ((d.rate - min) / range) * graphH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.lineTo(w - padding, h - padding);
    ctx.lineTo(padding, h - padding);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    const startColor = data[data.length-1].rate > data[0].rate ? '#00ff88' : '#ef4444';
    data.forEach((d, i) => {
        const x = padding + (i / (data.length - 1)) * graphW;
        const y = padding + graphH - ((d.rate - min) / range) * graphH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = startColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    const last = data[data.length-1];
    const lx = padding + graphW;
    const ly = padding + graphH - ((last.rate - min) / range) * graphH;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fillStyle = startColor;
    ctx.fill();
}

function handleLogin() {
    if (!firebaseReady || !auth) {
        document.getElementById('authError').textContent = '❌ Firebase не готовий. Перезавантажте сторінку.';
        return;
    }
    
    const nick = document.getElementById('authNick').value.trim();
    const pass = document.getElementById('authPass').value;
    const error = document.getElementById('authError');
    const success = document.getElementById('authSuccess');

    if (!nick || !pass) { error.textContent = '❌ Введіть нік та пароль'; return; }
    if (nick.length < 3) { error.textContent = '❌ Нік ≥3 символи'; return; }
    if (pass.length < 4) { error.textContent = '❌ Пароль ≥4 символи'; return; }

    error.textContent = '';
    success.textContent = '⏳ Вхід...';

    const cleanNick = nick.toLowerCase().replace(/[^a-z0-9]/g, '');
    const email = cleanNick + '@hamka.ua';

    auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
            success.textContent = '✅ Вхід виконано!';
            error.textContent = '';
        })
        .catch(e => {
            console.error('Login error:', e);
            if (e.code === 'auth/user-not-found') {
                error.textContent = '❌ Користувача не знайдено. Спробуйте інший нік або Telegram.';
            } else if (e.code === 'auth/wrong-password') {
                error.textContent = '❌ Невірний пароль';
            } else if (e.code === 'auth/invalid-email') {
                error.textContent = '❌ Нік містить заборонені символи. Використайте тільки літери та цифри.';
            } else {
                error.textContent = '❌ ' + e.message;
            }
            success.textContent = '';
        });
}

function handleTelegram() {
    if (!firebaseReady || !auth) {
        document.getElementById('authError').textContent = '❌ Firebase не готовий.';
        return;
    }
    
    const error = document.getElementById('authError');
    const success = document.getElementById('authSuccess');
    
    if (!tg) {
        error.textContent = '❌ Запустіть гру в Telegram WebApp';
        return;
    }
    
    const tgUser = tg.initDataUnsafe?.user;
    if (!tgUser) {
        error.textContent = '❌ Не вдалося отримати дані Telegram';
        return;
    }
    
    error.textContent = '';
    success.textContent = '⏳ Вхід через Telegram...';
    
    const tgId = 'tg_' + tgUser.id;
    const tgName = tgUser.first_name || 'TelegramUser';
    
    db.ref('tg_mapping/' + tgId).once('value').then(snap => {
        const uid = snap.val();
        if (uid) {
            auth.signInAnonymously().then(userCredential => {
                const newUid = userCredential.user.uid;
                db.ref('users/' + uid).once('value').then(userSnap => {
                    if (userSnap.exists()) {
                        db.ref('users/' + newUid).set(userSnap.val());
                        db.ref('public_users/' + newUid).set(userSnap.val());
                        db.ref('tg_mapping/' + tgId).set(newUid);
                        db.ref('users/' + uid).remove();
                        db.ref('public_users/' + uid).remove();
                        loadGame(userSnap.val());
                        startGame();
                        success.textContent = '✅ Вхід через Telegram!';
                    }
                });
            });
        } else {
            auth.signInAnonymously().then(userCredential => {
                const uid = userCredential.user.uid;
                db.ref('tg_mapping/' + tgId).set(uid);
                G.uid = uid;
                G.name = tgName;
                saveGame();
                startGame();
                success.textContent = '✅ Вхід через Telegram!';
            });
        }
    }).catch(e => {
        error.textContent = '❌ ' + e.message;
        success.textContent = '';
    });
}

function logout() {
    if (confirm('Вийти з акаунту?')) {
        auth.signOut();
        location.reload();
    }
}

// ============================================================
//  🎁 PROMO
// ============================================================
function activatePromo() {
    let code = document.getElementById('promoInp').value.trim().toUpperCase();
    if (!code) return;
    if (code === 'LETO') { G.eventHoma += 50; toast('🌸 +50 івенхомів'); updateUI(); saveGame(); }
    else if (code === 'START') { G.coins += 1000; toast('💰 +1000 монет'); updateUI(); saveGame(); }
    else if (code === 'CRYPTO') { 
        G.crypto.HAM = (G.crypto.HAM || 0) + 1;
        G.crypto.HAMG = (G.crypto.HAMG || 0) + 0.5;
        G.crypto.HAMC = (G.crypto.HAMC || 0) + 0.25;
        toast('₿ +1 HAM, +0.5 HAMG, +0.25 HAMC'); 
        updateUI(); 
        saveGame(); 
    }
    else if (code === 'VIP') {
        if (!G.vip) {
            G.vip = true;
            G.inv.push('VIP');
            G.luck = Math.min(G.luck + 0.1, 1.3);
            toast('👑 VIP активовано!');
            updateUI();
            saveGame();
        } else {
            toast('VIP вже є');
        }
    } else if (code === 'HAMKA') {
        addTitle('hamka');
        toast('🏅 Титул Хамка!');
        updateUI();
        saveGame();
    } else {
        toast('❌ Невірний промокод');
    }
    document.getElementById('promoInp').value = '';
}

// ============================================================
//  🔄 RESET
// ============================================================
function resetGame() {
    if (!confirm('⚠️ Скинути весь прогрес?')) return;
    localStorage.removeItem('hamka_guest_save');
    localStorage.removeItem('hamka_save');
    location.reload();
}

// ============================================================
//  🚀 INIT
// ============================================================
if (firebaseReady && auth) {
    auth.onAuthStateChanged(user => {
        if (user) {
            G.uid = user.uid;
            db.ref('users/' + user.uid).once('value').then(snap => {
                if (snap.val()) {
                    loadGame(snap.val());
                } else {
                    const localSave = localStorage.getItem('hamka_guest_save');
                    if (localSave) {
                        try {
                            const data = JSON.parse(localSave);
                            loadGame(data);
                            localStorage.removeItem('hamka_guest_save');
                        } catch(e) {}
                    } else if (!G.name || G.name === 'Гравець') {
                        G.name = user.isAnonymous ? 'Гість' : 'Гравець';
                    }
                    saveGame();
                }
                startGame();
            }).catch(e => {
                console.error('Load data error:', e);
                startGame();
            });
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('game').style.display = 'none';
            gameStarted = false;
        }
    });
} else {
    document.getElementById('authError').textContent = '❌ Помилка підключення до Firebase. Перезавантажте сторінку.';
}
