<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 hamka</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
        .app{width:100%;max-width:420px;height:100vh;background:#0a0a0a;display:flex;flex-direction:column;overflow:hidden}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#111;border-bottom:1px solid #222;min-height:46px;flex-shrink:0}
        .top-bar span{font-size:13px;color:#00ff88;font-weight:700}
        .tab-nav{display:flex;gap:3px;padding:6px;background:#111;border-bottom:1px solid #222;flex-shrink:0}
        .tab-nav button{flex:1;padding:9px 4px;border:none;border-radius:8px;background:transparent;color:#888;font-size:10px;font-weight:600;cursor:pointer}
        .tab-nav button.active{background:#00ff88;color:#000}
        .content-area{flex:1;overflow-y:auto;padding:10px}
        .page{display:none}.page.show{display:block}
        .center-game{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;gap:12px;padding:15px 0}
        .tap-circle{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#2a2a35,#141418);border:3px solid #00ff88;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:50px;box-shadow:0 0 30px rgba(0,255,136,0.3);transition:transform 0.15s}
        .tap-circle:active{transform:scale(0.9)}
        .game-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
        .bar-container{width:80%;height:5px;background:#222;border-radius:3px;overflow:hidden}
        .xp-fill{height:100%;background:linear-gradient(90deg,#4488ff,#00ccff);transition:width 0.4s}
        .btn{padding:11px 14px;border:none;border-radius:10px;font-weight:700;font-size:10px;cursor:pointer;text-align:center;transition:all 0.15s}
        .btn:active{transform:scale(0.95);opacity:0.8}
        .btn-g{background:#00ff88;color:#000}.btn-o{background:#ff8800;color:#fff}.btn-r{background:#ff4757;color:#fff}.btn-b{background:#4488ff;color:#fff}
        .btn-block{width:100%}.btn-sm{padding:7px 10px;font-size:9px}
        .card{background:#1a1a1d;padding:10px 12px;border-radius:10px;border:1px solid #222;margin-bottom:6px;font-size:10px}
        .shop-tabs{display:flex;gap:3px;margin-bottom:8px}
        .shop-tab{flex:1;padding:9px;border:1px solid #333;border-radius:8px;background:transparent;color:#999;font-size:9px;font-weight:600;cursor:pointer;text-align:center}
        .shop-tab.active{background:#00ff88;color:#000;border-color:#00ff88}
        .slot{width:45px;height:45px;background:#1a1a1d;border:2px solid #333;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .bet-row{display:flex;align-items:center;gap:6px}
        .bet-row input{width:55px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;padding:7px;border-radius:8px;font-size:10px;outline:none}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,0.95);padding:8px 16px;border-radius:20px;font-size:10px;font-weight:600;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid #333;color:#fff}
        .toast.show{opacity:1}
        .bal{text-align:center;padding:6px;background:#111;font-size:14px;font-weight:800;color:#ffcc00;flex-shrink:0}
        .xp-info{text-align:center;font-size:9px;color:#4488ff;padding:3px;flex-shrink:0}
        .promo-row{display:flex;gap:4px;padding:6px 10px;background:#111;flex-shrink:0}
        .promo-row input{flex:1;background:#1a1a1d;color:#fff;border:1px solid #333;padding:8px;border-radius:8px;font-size:10px;outline:none}
        .saper-cell{border:none;border-radius:2px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center}
        .stats-row{font-size:8px;color:#888;text-align:center}
        .gif-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
        .gif-cell{width:30px;height:30px;border-radius:6px;background:#2a2a35;cursor:pointer;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
        .gif-cell.sel{border-color:#ffcc00;box-shadow:0 0 10px rgba(255,204,0,0.5)}
        .gif-cell .gif-price{position:absolute;bottom:-6px;font-size:6px;color:#ffcc00;background:#000;padding:1px 3px;border-radius:3px}
        .inv-item{display:inline-block;background:rgba(0,0,0,0.3);padding:3px 6px;border-radius:5px;margin:2px;font-size:9px;border:1px solid #333}
        .console-box{background:#000;border-radius:6px;padding:6px;font-family:monospace;font-size:8px;color:#0f0;min-height:40px;max-height:100px;overflow-y:auto;white-space:pre-wrap;margin:4px 0;border:1px solid #1a3a1a}
        .console-inp{width:100%;background:#000;color:#0f0;border:1px solid #333;padding:6px;font-family:monospace;font-size:9px;outline:none;border-radius:4px}
        .color-dots{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
        .color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
        .color-dot.active{border-color:#fff}
        .homa-card{border-left:3px solid #ff44ff}
        input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    </style>
</head>
<body>
<div class="app" id="app">
    <div id="login" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center">
        <div style="font-size:55px">🐹</div>
        <h2 style="color:#00ff88;margin:10px;font-size:22px">hamka</h2>
        <button class="btn btn-g btn-block" onclick="playGame()" style="font-size:13px;margin-top:10px">🎮 Грати</button>
        <div style="color:#888;margin:8px 0;font-size:10px">— або —</div>
        <input type="text" id="newName" placeholder="Ім'я акаунту" style="width:100%;background:#1a1a1d;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;font-size:11px;outline:none">
        <button class="btn btn-g btn-block" onclick="createAcc()" style="margin-top:4px;font-size:11px">Створити акаунт</button>
        <div id="accList" style="margin-top:6px;text-align:left;max-height:180px;overflow-y:auto;width:100%"></div>
    </div>
    <div id="game" style="display:none;flex-direction:column;height:100%">
        <div class="top-bar"><span>🐹 <span id="userName">Гравець</span></span><span style="color:#ff44ff;font-size:11px">🟣 <span id="homaDisp">0</span></span><button class="btn btn-r btn-sm" onclick="doLogout()">🚪</button></div>
        <div class="tab-nav"><button class="active" onclick="switchTab('games',this)">🎮</button><button onclick="switchTab('shop',this)">🛒</button><button onclick="switchTab('vip',this)">👑</button><button onclick="switchTab('inv',this)">🎒</button><button onclick="switchTab('info',this)">ℹ️</button><button onclick="switchTab('profile',this)">👤</button></div>
        <div class="content-area" id="contentArea"></div>
        <div class="bal" id="balance">💰 50</div>
        <div class="xp-info">⭐ Рівень <span id="lvlDisp">1</span> | XP: <span id="xpDisp">0</span> / 500</div>
        <div class="bar-container" style="width:90%;margin:0 auto"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <div class="promo-row"><input type="text" id="promoInp" placeholder="🎁 Промокод"><button class="btn btn-g btn-sm" onclick="activatePromo()">OK</button></div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ВСЕ ФУНКЦИИ
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

const GIFS=[{id:'🐹',e:'🐹',r:'common'},{id:'🐱',e:'🐱',r:'common'},{id:'🐶',e:'🐶',r:'common'},{id:'🦊',e:'🦊',r:'common'},{id:'🐰',e:'🐰',r:'common'},{id:'🐻',e:'🐻',r:'common'},{id:'🐯',e:'🐯',r:'rare'},{id:'🦁',e:'🦁',r:'rare'},{id:'🐺',e:'🐺',r:'rare'},{id:'🦅',e:'🦅',r:'rare'},{id:'👑',e:'👑',r:'superrare'},{id:'💎',e:'💎',r:'superrare'},{id:'🏆',e:'🏆',r:'superrare'},{id:'🌟',e:'🌟',r:'epic'},{id:'🔥',e:'🔥',r:'epic'},{id:'❄️',e:'❄️',r:'epic'},{id:'🚀',e:'🚀',r:'mythic'},{id:'🛸',e:'🛸',r:'mythic'},{id:'🦄',e:'🦄',r:'legendary'},{id:'🐲',e:'🐲',r:'legendary'},{id:'👾',e:'👾',r:'secret'},{id:'⚔️',e:'⚔️',r:'exclusive',homa:1}];
const R={common:{n:'Простий',c:'#aaa',p:5000},rare:{n:'Рідкісний',c:'#4488ff',p:10000},superrare:{n:'Надрідкісний',c:'#aa44ff',p:25000},epic:{n:'Епічний',c:'#ff44ff',p:250000},mythic:{n:'Міфічний',c:'#ff4444',p:750000},legendary:{n:'Легендарний',c:'#ff8800',p:1500000},secret:{n:'Секретний',c:'#00ffff',p:5000000},exclusive:{n:'Ексклюзивний',c:'#ffcc00',p:0}};
const LEVELS=[{l:1,x:0,rw:0},{l:2,x:500,rw:50},{l:3,x:1500,rw:100},{l:4,x:4000,rw:200},{l:5,x:10000,rw:500},{l:6,x:25000,rw:1000},{l:7,x:60000,rw:2000},{l:8,x:150000,rw:5000},{l:9,x:400000,rw:10000},{l:10,x:1000000,rw:25000}];

let coins=50,inv=[],autoTap=0,tapLvl=1,totalTaps=0,totalWon=0,luck=1.0,lastSpin=0,isAdmin=0,coinBoost=1.0,autoXP=0,homa=0,saperHW=0,casinoW=0,maxEn=400,curEn=400,accXP=0,accLvl=1,curUser=null,isGuest=0,allAccs={},tapPow=1.0,crit=0,myGifs=['🐹'],curGif='🐹',myTitles=['none'],curTitle='none',morseUsed=0;
let buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0};
const usedPromos=[],promos={lordeddw:1000,robot:500,hamka2024:2500,gift:10000};

function getPrice(item){const p={maxEnergy:{base:5000,mult:1.8},autoXP:{base:15000,mult:2.5},autoTap:{base:500,mult:1.5},energyRegen:{base:50000,mult:3},upgradeTap:{base:2000,mult:2},coinBoostB:{base:15000,mult:2.5},energyUp:{base:15000,mult:2},tapPowerB:{base:50000,mult:3},critChanceB:{base:40000,mult:2.5},luckB:{base:10000,mult:2.5}};const d=p[item];if(!d)return 0;if(item==='upgradeTap')return Math.floor(d.base*Math.pow(d.mult,tapLvl-1));return Math.floor(d.base*Math.pow(d.mult,buyCount[item]||0))}

function loadAll(){try{const s=localStorage.getItem('hAcc');if(s)allAccs=JSON.parse(s)}catch(e){allAccs={}}}
function saveAll(){localStorage.setItem('hAcc',JSON.stringify(allAccs))}
function loadD(d){coins=d.coins||50;inv=d.inv||[];autoTap=d.autoTap||0;tapLvl=d.tapLvl||1;totalTaps=d.totalTaps||0;totalWon=d.totalWon||0;luck=d.luck||1.0;curGif=d.curGif||'🐹';myGifs=d.myGifs||['🐹'];isAdmin=d.isAdmin||0;accXP=d.xp||0;accLvl=d.lvl||1;myTitles=d.myTitles||['none'];curTitle=d.curTitle||'none';coinBoost=d.coinBoost||1.0;autoXP=d.autoXP||0;maxEn=d.maxEn||400;curEn=d.curEn||400;homa=d.homa||0;saperHW=d.saperHW||0;casinoW=d.casinoW||0;tapPow=d.tapPow||1.0;crit=d.crit||0;morseUsed=d.morseUsed||0;buyCount=d.buyCount||{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0}}
function defD(){coins=50;inv=[];autoTap=0;tapLvl=1;totalTaps=0;totalWon=0;luck=1.0;curGif='🐹';myGifs=['🐹'];isAdmin=0;accXP=0;accLvl=1;myTitles=['none'];curTitle='none';coinBoost=1.0;autoXP=0;maxEn=400;curEn=400;homa=0;saperHW=0;casinoW=0;tapPow=1.0;crit=0;morseUsed=0;buyCount={maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0}}
function saveG(){const d={coins,inv,autoTap,tapLvl,totalTaps,totalWon,luck,curGif,myGifs,isAdmin,usedP:[...usedPromos],xp:accXP,lvl:accLvl,myTitles,curTitle,coinBoost,autoXP,maxEn,curEn,homa,saperHW,casinoW,tapPow,crit,morseUsed,buyCount};if(isGuest)localStorage.setItem('hGuest',JSON.stringify(d));else if(curUser){allAccs[curUser]={name:curUser,...d};saveAll()}}

function playGuest(){isGuest=1;curUser=null;const s=localStorage.getItem('hGuest');if(s)try{loadD(JSON.parse(s))}catch(e){defD()}else defD();startGame('Гість')}
function createAcc(){const n=document.getElementById('newName').value.trim();if(!n)return;if(allAccs[n])return toast('Такий акаунт вже існує!');allAccs[n]={name:n,coins:50,inv:[],autoTap:0,tapLvl:1,totalTaps:0,totalWon:0,luck:1.0,curGif:'🐹',myGifs:['🐹'],isAdmin:0,usedP:[],xp:0,lvl:1,myTitles:['none'],curTitle:'none',coinBoost:1.0,autoXP:0,maxEn:400,curEn:400,homa:0,saperHW:0,casinoW:0,tapPow:1.0,crit:0,morseUsed:0,buyCount:{maxEnergy:0,autoXP:0,autoTap:0,energyRegen:0,upgradeTap:0,coinBoostB:0,energyUp:0,tapPowerB:0,critChanceB:0,luckB:0}};saveAll();document.getElementById('newName').value='';updAccList();loginAcc(n)}
function loginAcc(k){if(!allAccs[k])return;isGuest=0;curUser=k;loadD(allAccs[k]);startGame(allAccs[k].name||k)}
function startGame(n){document.getElementById('login').style.display='none';document.getElementById('game').style.display='flex';document.getElementById('userName').textContent=n;buildPages();updAll();openGame('tap');saveG()}
function doLogout(){saveG();curUser=null;isGuest=0;defD();document.getElementById('login').style.display='flex';document.getElementById('game').style.display='none';updAccList()}
function deleteAcc(k,event){event.stopPropagation();if(!allAccs[k])return;if(!confirm('Видалити акаунт "'+k+'"?'))return;delete allAccs[k];saveAll();if(curUser===k){curUser=null;isGuest=0;defD();document.getElementById('login').style.display='flex';document.getElementById('game').style.display='none'}updAccList();toast('🗑️ Акаунт видалено')}
function updAccList(){const l=document.getElementById('accList');const a=Object.entries(allAccs);if(!a.length){l.innerHTML='<p style="color:#888;font-size:9px;text-align:center">Немає акаунтів</p>';return}l.innerHTML=a.map(([k,v])=>'<div style="background:#1a1a1d;padding:8px;border-radius:8px;margin:3px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid #333;font-size:10px" onclick="loginAcc(\''+k+'\')"><div><b style="color:#0f0">'+(v.curGif||'🐹')+'</b> '+(v.name||k)+'<br><small style="color:#888">💰'+(v.coins||0)+' ⭐'+(v.lvl||1)+'</small></div><button style="background:#ff4757;color:#fff;border:none;border-radius:4px;padding:4px 8px;font-size:8px;cursor:pointer;margin-left:8px" onclick="deleteAcc(\''+k+'\',event)">🗑️</button></div>').join('')}

function getLI(xp){let c=LEVELS[0],n=LEVELS[1];for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].x){c=LEVELS[i];n=LEVELS[i+1]||LEVELS[i];break}}return{c,n}}
function addXP(a){const old=accLvl;accXP+=a;const li=getLI(accXP);accLvl=li.c.l;if(accLvl>old){coins+=li.c.rw;morseUsed=0;toast('🎉 Рівень '+accLvl+'! +'+li.c.rw+'💰')}updXp();saveG()}
function updXp(){const li=getLI(accXP);const next=li.n.x;const progress=next>li.c.x?((accXP-li.c.x)/(next-li.c.x))*100:100;document.getElementById('xpFill').style.width=Math.min(progress,100)+'%';document.getElementById('xpDisp').textContent=accXP;document.getElementById('lvlDisp').textContent=accLvl}

function buildPages(){
    document.getElementById('contentArea').innerHTML='<div id="tab-games" class="page show"><div class="game-btn-row"><button class="btn btn-g" onclick="openGame(\'tap\')">💸 Тап</button><button class="btn btn-o" onclick="openGame(\'casino\')">🎰 Казино</button><button class="btn btn-r" onclick="openGame(\'saper\')">💣 Сапер</button><button class="btn btn-b" onclick="openGame(\'morse\')">📻 Морзе</button></div><div id="game-area"></div></div><div id="tab-shop" class="page"><div class="shop-tabs"><button class="shop-tab active" onclick="shopTab(\'res\',event)">⚡ Ресурси</button><button class="shop-tab" onclick="shopTab(\'upg\',event)">⭐ Прокачка</button><button class="shop-tab" onclick="shopTab(\'vis\',event)">🎨 Візуальне</button><button class="shop-tab" onclick="shopTab(\'box\',event)">🎁 Ящики</button></div><div id="shop-res"></div><div id="shop-upg" style="display:none"></div><div id="shop-vis" style="display:none"></div><div id="shop-box" style="display:none"></div></div><div id="tab-vip" class="page"><div id="vip-area"></div></div><div id="tab-inv" class="page"><div id="inv-area"></div></div><div id="tab-info" class="page"><div class="card"><b>📋 Команди</b><br><small>/help /clear /info /neofetch /color"#f00" /rename"Ім\'я" /xom"5" /money"2" /maxenergy /maxtap</small></div><div class="card"><b>🎮 Як грати</b><br><small>Тапайте на коло. Грайте в казино, сапер та морзянку. Купуйте прокачки в магазині!</small></div></div><div id="tab-profile" class="page"><div class="card" style="text-align:center"><div style="font-size:35px" id="pEmoji">🐹</div><div style="font-size:13px;font-weight:bold;color:#00ff88" id="pName">Гравець</div><div style="color:#888;font-size:9px" id="pTitle">Без титулу</div></div><div class="card" style="text-align:center"><b>💰 <span id="sBal">0</span></b></div><div class="card" style="text-align:center"><b>👆 <span id="sTaps">0</span></b></div></div>';
    buildVip();buildInv();renderShopRes();renderShopUpg();renderShopVis();renderShopBox();
}

function renderShopRes(){document.getElementById('shop-res').innerHTML='<div class="card"><b>⚡ Енергія +50</b><br><small>💰'+getPrice('maxEnergy')+' | Куплено: '+buyCount.maxEnergy+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'maxEnergy\')">Купити</button></div><div class="card"><b>✨ Авто XP</b><br><small>💰'+getPrice('autoXP')+' | Куплено: '+buyCount.autoXP+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoXP\')">Купити</button></div><div class="card"><b>🚀 XP Бустер</b><br><small>💰500</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'xpBoost\')">Купити</button></div><div class="card"><b>⚡ Авто тап</b><br><small>💰'+getPrice('autoTap')+' | Куплено: '+buyCount.autoTap+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'autoTap\')">Купити</button></div><div class="card"><b>🔄 Регенерація +1</b><br><small>💰'+getPrice('energyRegen')+'</small><br><button class="btn btn-g btn-block btn-sm" onclick="buyItem(\'energyRegen\')">Купити</button></div><div class="card homa-card"><b>🟣 Купівля Хом</b><br><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-g btn-sm" onclick="buyHoma(1)" style="flex:1">1🟣 50K</button><button class="btn btn-g btn-sm" onclick="buyHoma(5)" style="flex:1">5🟣 250K</button></div></div>'}

let saperGrid=[],sRows=7,sCols=7,sMines=10,sFlags=0,sOver=0,sRevealed=0,sActive=0,sBet=0,sMult=1.3,sFirst=1,saperMode='reveal';
function resetSaper(){saperGrid=[];sFlags=0;sOver=0;sRevealed=0;sFirst=1;sMult=sRows===7?1.3:sRows===10?1.6:2.0;for(let r=0;r<sRows;r++){saperGrid[r]=[];for(let c=0;c<sCols;c++)saperGrid[r][c]={mine:0,revealed:0,flag:0,adj:0}}}
function placeMines(sr,sc){let p=0;while(p<sMines){const r=Math.floor(Math.random()*sRows),c=Math.floor(Math.random()*sCols);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;if(!saperGrid[r][c].mine){saperGrid[r][c].mine=1;p++}}for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++)if(!saperGrid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&saperGrid[r+dr][c+dc].mine)cnt++;saperGrid[r][c].adj=cnt}}
function renderSaper(){const a=document.getElementById('game-area');if(!a)return;const cs=Math.min(22,Math.floor((window.innerWidth-40)/sCols));let h='<div class="center-game"><h3 style="color:#00ff88">💣 Сапер (50/50)</h3><div class="stats-row">💰 Ставка: <input type="number" id="saperBetInp" value="100" style="width:50px;text-align:center;background:#1a1a1d;color:#fff;border:1px solid #333;border-radius:4px;padding:4px;font-size:10px"> | 🏆 x'+sMult.toFixed(1)+' | 🚩'+sFlags+'/'+sMines+'</div><div style="display:flex;gap:6px;margin:4px 0"><button class="btn btn-sm '+(saperMode==='reveal'?'btn-g':'')+'" onclick="saperMode=\'reveal\';renderSaper()">👆</button><button class="btn btn-sm '+(saperMode==='flag'?'btn-o':'')+'" onclick="saperMode=\'flag\';renderSaper()">🚩</button></div><div style="display:inline-grid;gap:1px;grid-template-columns:repeat('+sCols+','+cs+'px)">';
for(let r=0;r<sRows;r++)for(let c=0;c<sCols;c++){const d=saperGrid[r][c];let t='',bg='#444';if(d.revealed){bg=d.mine?'#ff4757':'#1a1a1d';if(d.mine)t='💣';else if(d.adj>0)t=d.adj}else if(d.flag){bg='#ff8800';t='🚩'}h+='<button class="saper-cell" style="width:'+cs+'px;height:'+cs+'px;background:'+bg+';font-size:'+(cs*0.45)+'px" onclick="saperClick('+r+','+c+')">'+t+'</button>'}
h+='</div><button class="btn btn-o btn-sm" onclick="startSaperBet()">💰 Грати</button><button class="btn btn-sm" onclick="changeSaperDiff()" style="background:#555;color:#fff">📊 '+(sRows===7?'Легко x1.3':sRows===10?'Середньо x1.6':'Важко x2.0')+'</button></div>';a.innerHTML=h}
function saperClick(r,c){if(sOver)return;if(saperMode==='flag'){if(saperGrid[r][c].revealed)return;saperGrid[r][c].flag=!saperGrid[r][c].flag;sFlags+=saperGrid[r][c].flag?1:-1}else{revealCell(r,c)}renderSaper()}
function revealCell(r,c){if(saperGrid[r][c].revealed||saperGrid[r][c].flag)return;if(sFirst){sFirst=0;placeMines(r,c)}saperGrid[r][c].revealed=1;sRevealed++;if(saperGrid[r][c].mine){sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;sActive=0;toast('💥 Міна! -'+sBet+'💰')}else if(saperGrid[r][c].adj===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(saperGrid[r+dr]&&saperGrid[r+dr][c+dc]&&!saperGrid[r+dr][c+dc].revealed)revealCell(r+dr,c+dc)}if(!sOver&&sRevealed>=sRows*sCols-sMines){if(Math.random()<0.5){sOver=1;const w=Math.floor(sBet*sMult);coins+=w;updBal();addXP(Math.floor(w/5));toast('🏆 Перемога! +'+w+'💰');if(sRows===13)saperHW++;saveG()}else{sOver=1;for(let rr=0;rr<sRows;rr++)for(let cc=0;cc<sCols;cc++)if(saperGrid[rr][cc].mine)saperGrid[rr][cc].revealed=1;toast('💥 Невдача!')}}}
function startSaperBet(){const i=document.getElementById('saperBetInp');const b=Number(i?.value||0);if(!b||b<10||coins<b)return;coins-=b;sBet=b;sActive=1;updBal();resetSaper();renderSaper();saveG()}
function changeSaperDiff(){if(sRows===7){sRows=10;sCols=10;sMines=16}else if(sRows===10){sRows=13;sCols=13;sMines=24}else{sRows=7;sCols=7;sMines=10}resetSaper();renderSaper()}

    else if(t==='autoXP'){const p=getPrice('autoXP');if(coins<p)return;coins-=p;autoXP++;buyCount.autoXP++}
    else if(t==='xpBoost'){if(coins<500)return;coins-=500;addXP(100)}
    else if(t==='autoTap'){const p=getPrice('autoTap');if(coins<p)return;coins-=p;autoTap++;buyCount.autoTap++}
    else if(t==='energyRegen'){const p=getPrice('energyRegen');if(coins<p)return;coins-=p;buyCount.energyRegen++}
    else if(t==='upgradeTap'){const p=getPrice('upgradeTap');if(coins<p)return;coins-=p;tapLvl++;buyCount.upgradeTap++}
    else if(t==='coinBoost'){const p=getPrice('coinBoostB');if(coins<p)return;coins-=p;coinBoost+=0.5;buyCount.coinBoostB++}
    else if(t==='energyUp'){const p=getPrice('energyUp');if(coins<p)return;coins-=p;maxEn+=100;curEn=Math.min(curEn+100,maxEn);buyCount.energyUp++}
    else if(t==='tapPower'){const p=getPrice('tapPowerB');if(coins<p)return;coins-=p;tapPow+=0.5;buyCount.tapPowerB++}
    else if(t==='critChance'){const p=getPrice('critChanceB');if(coins<p)return;coins-=p;crit+=5;buyCount.critChanceB++}
    else if(t==='vip'){if(inv.includes('VIP')){toast('✅ Вже є!');return}if(coins<50000)return;coins-=50000;inv.push('VIP');luck=Math.min(luck+0.1,1.5);buildVip()}
    else if(t==='luck'){const p=getPrice('luckB');if(coins<p)return;coins-=p;luck=Math.round((luck+0.1)*10)/10;buyCount.luckB++}
    updAll();saveG();toast('✅ Куплено!')
}
function buyHoma(n){const p=n*50000;if(coins<p)return;coins-=p;homa+=n;updAll();saveG();toast('✅ +'+n+'🟣')}
function buyHomaTitle(){if(myTitles.includes('hamka')){toast('✅');return}if(homa<25000)return;homa-=25000;myTitles.push('hamka');updAll();saveG();toast('🏅 Хамка!')}
function buyHomaGif(){if(myGifs.includes('⚔️')){toast('✅');return}if(homa<15000)return;homa-=15000;myGifs.push('⚔️');updAll();saveG();toast('⚔️ Меч!')}
function buyGif(id){const g=GIFS.find(g=>g.id===id);if(!g||myGifs.includes(id))return;if(g.homa)return;const p=R[g.r]?.p||5000;if(coins<p)return;coins-=p;myGifs.push(id);updAll();saveG();toast('✅ '+g.e+'!')}
function buyTitle(id){if(myTitles.includes(id))return;const p=5000;if(coins<p)return;coins-=p;myTitles.push(id);updAll();saveG();toast('✅ Титул!')}
function selGif(id){if(!myGifs.includes(id))return;curGif=id;updAll();saveG()}
function selTitle(id){if(!myTitles.includes(id))return;curTitle=id;updAll();saveG()}

function renderGifShop(){const s=document.getElementById('gifShop');if(!s)return;s.innerHTML=GIFS.filter(g=>!g.homa).map(g=>{const o=myGifs.includes(g.id);return o?'<div class="gif-cell" style="border-color:#888">'+g.e+'</div>':'<div class="gif-cell" onclick="buyGif(\''+g.id+'\')">'+g.e+'<span class="gif-price">'+(R[g.r]?.p||5000)+'💰</span></div>'}).join('')}
function renderTitleShop(){const s=document.getElementById('titleShop');if(!s)return;const a=['noob','player','pro','master','elite'].filter(t=>!myTitles.includes(t));s.innerHTML=a.length===0?'<p style="color:#888;font-size:9px">✅ Всі</p>':a.map(t=>'<div class="card"><b>['+t+']</b> 💰5000<br><button class="btn btn-g btn-block btn-sm" onclick="buyTitle(\''+t+'\')">Купити</button></div>').join('')}
function renderStyleGifs(){const s=document.getElementById('styleGifGrid');if(!s)return;s.innerHTML=GIFS.map(g=>{const o=myGifs.includes(g.id),sel=curGif===g.id;return'<div class="gif-cell '+(sel?'sel':'')+' '+(o?'':'locked')+'" onclick="selGif(\''+g.id+'\')">'+g.e+'</div>'}).join('')}
function renderStyleTitles(){const s=document.getElementById('styleTitleGrid');if(!s)return;s.innerHTML=['none','noob','player','pro','master','elite','hamka'].map(t=>{const o=myTitles.includes(t),sel=curTitle===t;return'<div class="gif-cell '+(sel?'sel':'')+' '+(o?'':'locked')+'" onclick="selTitle(\''+t+'\')" style="font-size:7px">'+t+'</div>'}).join('')}

function updAll(){updBal();updXp();updHoma();updProf();updTitle();buildInv();renderStyleGifs();renderStyleTitles();const pe=document.getElementById('pEmoji');if(pe)pe.textContent=curGif}
function updBal(){document.getElementById('balance').textContent='💰 '+coins;const sb=document.getElementById('sBal');if(sb)sb.textContent=coins;const tb=document.getElementById('tapBalance');if(tb)tb.textContent=coins}
function updProf(){document.getElementById('pName').textContent=curUser||'Гість';document.getElementById('sTaps').textContent=totalTaps}
function updTitle(){const pt=document.getElementById('pTitle');if(pt)pt.textContent=curTitle==='none'?'Без титулу':curTitle}
function updHoma(){document.getElementById('homaDisp').textContent=homa}

function activatePromo(){const i=document.getElementById('promoInp');const c=i.value.trim().toLowerCase();if(!c)return;if(usedPromos.includes(c)){toast('❌ Використано!');return}if(promos[c]){coins+=promos[c];usedPromos.push(c);updBal();toast('🎁 +'+promos[c]+'💰');saveG();i.value=''}else if(c==='owerlord'){isAdmin=1;buildVip();updAll();toast('🔧 Адмін!');saveG()}else{toast('❌ Невірний!')}}

function switchTab(t,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));const tab=document.getElementById('tab-'+t);if(tab)tab.classList.add('show');document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(t==='shop'){renderShopRes();renderShopUpg();renderShopVis();renderShopBox()}if(t==='vip')buildVip();if(t==='inv')buildInv()}

function playGame(){playGuest()}
loadAll();updAccList();
</script>
</body>
</html>
